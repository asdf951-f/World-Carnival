    <title>影子丛林 - 萤火虫</title>
    <style id="theme-vars">
:root {
  --brand-color-primary: #6C5CE7;
  --brand-color-primary-light: #A29BFE;
  --brand-color-primary-lighter: #DCD6FF;
  --brand-state-success: #00B894;
  --brand-state-success-light: #55EFC4;
  --brand-state-warning: #FDCB6E;
  --brand-state-error: #FF7675;
  --brand-state-info: #74B9FF;
  --brand-color-text-primary: #2D3436;
  --brand-color-text-secondary: #636E72;
  --brand-jungle-base: #1A1A2E;
  --brand-jungle-ground: #16213E;
  --brand-jungle-cyan: #00D2FF;
  --brand-jungle-green: #A8FF78;
  --brand-jungle-gold: #F2C94C;
  --brand-jungle-purple: #CE93D8;
  --brand-font-display: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --brand-font-body: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
    
    /* === 语音引导设置面板 === */
    .voice-settings-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .voice-settings-btn:active { transform: scale(0.9); }
    .voice-settings-btn.muted { opacity: 0.5; }
    
    .voice-settings-panel {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 100px);
      right: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      z-index: 101;
      min-width: 200px;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      animation: panelIn 0.2s ease-out;
    }
    .voice-settings-panel.show { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .voice-settings-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .voice-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .voice-setting-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .voice-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .voice-toggle.on { background: #4ECDC4; }
    .voice-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
    }
    .voice-toggle.on::after { left: 22px; }

  
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    /* 点击手势 - 在目标位置脉冲 */
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim {
      animation: gestureTap 1.8s ease-in-out infinite;
    }
    /* 拖拽手势 - 从A拖到B */
    @keyframes gestureDragX {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      10% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      70% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); left: var(--drag-to); }
      80% { opacity: 0.8; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      90% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
    }
    /* 摩擦手势 - 两只手指来回搓 */
    @keyframes gestureRubLeft {
      0%, 100% { transform: translateX(-22px); }
      50% { transform: translateX(22px); }
    }
    @keyframes gestureRubRight {
      0%, 100% { transform: translateX(22px); }
      50% { transform: translateX(-22px); }
    }
    .gesture-rub-left {
      animation: gestureRubLeft 0.6s ease-in-out infinite;
    }
    .gesture-rub-right {
      animation: gestureRubRight 0.6s ease-in-out infinite;
    }
    /* 按住手势 - 手指按下不动 */
    @keyframes gesturePress {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
      20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }
    .gesture-press-anim {
      animation: gesturePress 2s ease-in-out infinite;
    }
    /* 点击涟漪效果 */
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim {
      animation: gestureRipple 1.8s ease-out infinite;
    }
    /* 滑动方向箭头 */
    @keyframes gestureSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(-40px); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    @keyframes gestureSlideLeft {
      0% { opacity: 0; transform: translateX(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }
      80% { opacity: 0.8; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }

  
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5));
      animation: starPulse 2s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .star-guide:hover {
      transform: scale(1.15);
    }
    .star-guide:active {
      transform: scale(0.95);
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7)); }
    }
    .star-guide-balloon {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      max-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s ease-out;
      pointer-events: none;
    }
    .star-guide-balloon.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .star-guide-balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 14px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.95);
      transform: rotate(45deg);
    }
    /* 飞行路径动画 */
    .star-guide-flying {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 44px;
      filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7));
    }
    @keyframes starFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 目标高亮光环 */
    .star-guide-target-glow {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #F2C94C;
      animation: targetGlow 1.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9997;
    }
    @keyframes targetGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

  <!-- ========== AUDIO (Web Audio API for buzz + chimes) ========== -->
  <script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBuzz() {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }
  function playChime(freq, dur = 0.4) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }
  function playSuccessMelody() {
    const notes = [523, 659, 784, 1047]; // C5 E5 G5 C6
    notes.forEach((f, i) => setTimeout(() => playChime(f, 0.5), i * 120));
  }
  function playPop() {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }
  function playSparkle() {
    ensureAudio();
    [1200, 1600, 2000].forEach((f, i) => setTimeout(() => playChime(f, 0.3), i * 60));
  }
  </script>

  <!-- ========== INTERACTION STATE MACHINE ========== -->
  <script>
  // ===== Shared progress/navigation helpers =====
  const ISLAND_ID = 'shadowJungle';
  const ISLAND_PAGE = 'shadow-jungle-v2.html';
  const WORLD_MAP = 'world-map-v2.html';
  const WORLD_MAP_PAGE = 'world-map-v2.html';
  const TOTAL_ANIMALS = 4;
  const ANIMAL_ID = 'firefly';
  const ISLAND_ANIMALS = ['monkey', 'chameleon', 'firefly', 'sloth'];

  // TTS 读两遍
  function speakLightTwice() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const make = () => {
      const u = new SpeechSynthesisUtterance('Light');
      u.lang = 'en-US';
      u.rate = 0.8;
      u.pitch = 1.1;
      return u;
    };
    window.speechSynthesis.speak(make());
    setTimeout(() => {
      if ('speechSynthesis' in window) window.speechSynthesis.speak(make());
    }, 1000);
  }

  // 点击方向按钮时朗读中文方向名
  const DIR_WORDS = {
    up: '上',
    down: '下',
    left: '左',
    right: '右'
  };
  function speakDir(dir) {
    if (!('speechSynthesis' in window)) return;
    const word = DIR_WORDS[dir];
    if (!word) return;
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }

  function getCurrentPlayerId() {
    try {
      const raw = localStorage.getItem('starCarnivalDB');
      if (raw) {
        const db = JSON.parse(raw);
        if (db.currentPlayerId) return db.currentPlayerId;
      }
    } catch(e){}
    return localStorage.getItem('currentPlayerId');
  }

  function getProgress() {
    const cid = getCurrentPlayerId();
    if (!cid) return null;
    const key = 'starCarnival_progress_' + cid;
    let prog = {};
    try { prog = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => {
      if (!prog[id]) prog[id] = { completed: [], gemEarned: false };
      if (!prog[id].completed) prog[id].completed = [];
    });
    if (typeof prog.gems !== 'number') prog.gems = 0;
    if (!prog.unlocked) prog.unlocked = ['echoValley'];
    return prog;
  }

  function saveProgress(prog) {
    const cid = getCurrentPlayerId();
    if (!cid) return;
    localStorage.setItem('starCarnival_progress_' + cid, JSON.stringify(prog));
  }

  function markAnimalCompleted() {
    const prog = getProgress();
    if (!prog) return;
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
      prog[ISLAND_ID].completed.push(ANIMAL_ID);
    }
    let g = 0;
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
    prog.gems = g;
    saveProgress(prog);
  }

  function navigateAfterRescue() {
    const prog = getProgress();
    if (!prog) {
      document.body.style.transition = 'opacity 0.3s';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = ISLAND_PAGE; }, 300);
      return;
    }
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
      prog[ISLAND_ID].completed.push(ANIMAL_ID);
    }
    let g = 0;
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
    prog.gems = g;
    saveProgress(prog);
    const allDone = ISLAND_ANIMALS.every(a => prog[ISLAND_ID].completed.includes(a));
    document.body.style.transition = 'opacity 0.3s';
    document.body.style.opacity = '0';
    setTimeout(() => {
      window.location.href = allDone ? (WORLD_MAP_PAGE + '?islandComplete=' + ISLAND_ID) : ISLAND_PAGE;
    }, 300);
  }

  function navigateBack() {
    document.body.style.transition = 'opacity 0.25s';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = ISLAND_PAGE; }, 250);
  }

  // Wire back button
  document.querySelector('[data-dom-id="btn-back-to-map"]').addEventListener('click', navigateBack);

  const SEQUENCE = ['up', 'right', 'down', 'left', 'up'];
  const SEQ_SYMBOLS = { up:'↑', right:'→', down:'↓', left:'←' };
  const SEQ_COLORS = { up:'#A8FF78', right:'#00D2FF', down:'#F2C94C', left:'#CE93D8' };

  let stage = 'idle'; // idle -> sparking -> puzzle -> opening -> spelling -> reading -> lighting -> complete
  let seqProgress = 0;

  const hintText = document.getElementById('hint-text');
  const bottle = document.getElementById('bottle');
  const cork = document.getElementById('cork');
  const bottleBody = document.getElementById('bottle-body');
  const bottleArrows = document.getElementById('bottle-arrows');
  const compassPuzzle = document.getElementById('compass-puzzle');
  const pillarBaseBtn = document.getElementById('pillar-base-btn');
  const baseGlow = document.getElementById('base-glow');
  const seqSteps = document.querySelectorAll('.seq-step');
  const errorFlash = document.getElementById('error-flash');
  const lightWordContainer = document.getElementById('light-word-container');
  const lightWord = document.getElementById('light-word');
  const lightWordHint = document.getElementById('light-word-hint');
  const lightWordBtn = document.getElementById('light-word-btn');
  const successOverlay = document.getElementById('success-overlay');
  const flyingFireflies = document.getElementById('flying-fireflies');
  const fireflySlot = document.getElementById('firefly-slot');

  function setHint(text) {
    hintText.textContent = text;
    if (window.VoiceGuide && window.VoiceGuide.isEnabled && window.VoiceGuide.isEnabled()) {
      clearTimeout(window.voiceGuide_hintTimer);
      window.voiceGuide_hintTimer = setTimeout(function() {
        window.VoiceGuide.speak(text);
      }, 300);
    }
  }

  // Stage 1: click pillar base -> spark chain travels up
  pillarBaseBtn.addEventListener('click', () => {
    if (stage !== 'idle') return;
    stage = 'sparking';
    baseGlow.style.animation = 'none';
    baseGlow.style.opacity = '0';
    pillarBaseBtn.style.pointerEvents = 'none';
    pillarBaseBtn.style.opacity = '0';
    pillarBaseBtn.style.transition = 'opacity 0.3s';
    // Stop pillar stone invite glow
    const pillarStone = document.getElementById('pillar-center-stone');
    if (pillarStone) pillarStone.style.animation = 'none';
    setHint('✨ 光顺着石柱爬上去了...');

    // Create spark chain traveling up the pillar
    playSparkle();
    const sparkChain = document.getElementById('spark-chain');
    const sparks = [];
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('span');
      const sz = 6 + Math.random() * 4;
      const colors = ['#A8FF78','#F2C94C','#00D2FF'];
      const c = colors[i%3];
      s.style.cssText = `position:absolute;width:${sz}px;height:${sz}px;border-radius:50%;background:${c};box-shadow:0 0 ${sz*2}px ${c};bottom:${10 + i*2}%;left:${40 + Math.random()*20}%;opacity:0;`;
      sparkChain.appendChild(s);
      sparks.push(s);
    }
    sparkChain.style.opacity = '1';
    sparks.forEach((s, i) => {
      setTimeout(() => {
        s.style.transition = 'all 0.5s cubic-bezier(0.2,0.8,0.2,1)';
        s.style.bottom = `${85 + i*2}%`;
        s.style.opacity = '1';
      }, i * 100);
      setTimeout(() => { s.style.opacity = '0'; }, i * 100 + 400);
    });

    // After sparks reach top, reveal bottle
    setTimeout(() => {
      // Reveal bottle
      bottle.style.opacity = '1';
      bottle.style.transform = 'scale(1) translateY(0)';
      bottleBody.style.boxShadow = '0 0 30px rgba(168,255,120,0.6), 0 0 60px rgba(242,201,76,0.3), inset 0 0 15px rgba(168,255,120,0.15)';
      bottleBody.style.borderColor = 'rgba(168,255,120,0.6)';
      // Make bottle fireflies brighter
      document.querySelectorAll('.bottle-ff').forEach(f => {
        f.style.opacity = '1';
        f.style.animationDuration = '1s';
      });
      playChime(880, 0.5);
      setHint('🫙 瓶子出现了！周围有方向箭头...');

      setTimeout(() => {
        // Show direction arrows around bottle
        bottleArrows.style.opacity = '1';
        document.querySelectorAll('.bottle-dir-arrow').forEach((a, i) => {
          a.style.animation = `arrow-bounce 1.2s ease-in-out infinite ${i * 0.15}s`;
        });
        setTimeout(() => startPuzzle(), 300);
      }, 600);
    }, 900);
  });

  function startPuzzle() {
    stage = 'puzzle';
    seqProgress = 0;
    setHint('🧭 按照萤火虫飞行轨迹 ↑→↓←↑ 点击方向！');
    compassPuzzle.style.opacity = '1';
    compassPuzzle.style.transform = 'translateX(-50%) translateY(0)';
    compassPuzzle.style.pointerEvents = 'auto';
    // Highlight first step as current
    updateSeqDisplay();
  }

  function updateSeqDisplay() {
    seqSteps.forEach((el, i) => {
      if (i < seqProgress) {
        // Completed
        el.style.background = `${SEQ_COLORS[SEQUENCE[i]]}33`;
        el.style.color = SEQ_COLORS[SEQUENCE[i]];
        el.style.border = `2px solid ${SEQ_COLORS[SEQUENCE[i]]}`;
        el.style.boxShadow = `0 0 12px ${SEQ_COLORS[SEQUENCE[i]]}66`;
        el.style.transform = 'scale(1)';
      } else if (i === seqProgress) {
        // Current
        el.style.background = `${SEQ_COLORS[SEQUENCE[i]]}44`;
        el.style.color = '#fff';
        el.style.border = `2px solid ${SEQ_COLORS[SEQUENCE[i]]}`;
        el.style.boxShadow = `0 0 16px ${SEQ_COLORS[SEQUENCE[i]]}88`;
        el.style.transform = 'scale(1.1)';
        el.style.animation = 'seq-current-pulse 1s ease-in-out infinite';
      } else {
        // Pending
        el.style.background = 'rgba(224,224,224,0.08)';
        el.style.color = 'rgba(224,224,224,0.3)';
        el.style.border = 'none';
        el.style.boxShadow = 'none';
        el.style.transform = 'scale(1)';
        el.style.animation = 'none';
      }
    });
  }

  // D-pad button handlers
  document.querySelectorAll('.dpad-btn-compass').forEach(btn => {
    btn.addEventListener('click', () => {
      if (stage !== 'puzzle') return;
      const dir = btn.dataset.dir;
      const expected = SEQUENCE[seqProgress];

      // 每次点击都朗读对应的中文方向
      speakDir(dir);

      // Press feedback
      btn.classList.add('dpad-pressed');
      setTimeout(() => { btn.classList.remove('dpad-pressed'); }, 200);

      if (dir === expected) {
        // Correct!
        playChime([523,659,784,880,1047][seqProgress] || 880, 0.3);
        seqProgress++;
        // Light up that arrow on bottle too
        lightBottleArrow(dir);
        updateSeqDisplay();

        if (seqProgress >= SEQUENCE.length) {
          // All correct! Open bottle
          setTimeout(() => openBottle(), 500);
        } else {
          const dirNames = {
            'up': '上方是天空',
            'right': '右方是拿筷子的手',
            'down': '下方是地面',
            'left': '左边'
          };
          const dirName = dirNames[dir] || '';
          if (dirName) {
            setHint(`✨ 正确！这是${dirName}！`);
          } else {
            setHint(`✨ 正确！继续下一个方向！`);
          }
        }
      } else {
        // Wrong! Buzz, but don't reset progress
        playBuzz();
        // Shake effect
        errorFlash.style.opacity = '1';
        setTimeout(() => { errorFlash.style.opacity = '0'; }, 150);
        const compassInner = document.getElementById('compass-inner');
        compassInner.style.animation = 'compass-shake 0.3s';
        setTimeout(() => { compassInner.style.animation = ''; }, 300);
        btn.style.borderColor = '#FF7675';
        btn.style.boxShadow = '0 0 16px rgba(255,118,117,0.6)';
        setTimeout(() => {
          btn.style.borderColor = '';
          btn.style.boxShadow = '';
        }, 400);
        setHint('❌ 嗡嗡~ 再试一次，已经点亮的不会熄灭哦！');
      }
    });
  });

  function lightBottleArrow(dir) {
    const arrows = document.querySelectorAll('.bottle-dir-arrow');
    const dirIdx = { up:0, right:1, down:2, left:3 }[dir];
    if (arrows[dirIdx]) {
      arrows[dirIdx].style.animation = 'none';
      // Force reflow then trigger lit animation
      void arrows[dirIdx].offsetWidth;
      arrows[dirIdx].style.animation = 'arrow-lit 0.4s ease-out forwards';
    }
  }

  function openBottle() {
    stage = 'opening';
    setHint('🎉 瓶盖打开了！萤火虫飞出来了！');
    compassPuzzle.style.opacity = '0';
    compassPuzzle.style.pointerEvents = 'none';
    setTimeout(() => { compassPuzzle.style.display = 'none'; }, 500);

    // Cork pops off
    playPop();
    cork.style.transform = 'translateY(-40px) rotate(45deg)';
    cork.style.opacity = '0';

    // Bottle glows bright
    bottleBody.style.boxShadow = '0 0 50px rgba(168,255,120,0.9), 0 0 100px rgba(242,201,76,0.5), inset 0 0 30px rgba(168,255,120,0.4)';

    // Fireflies fly out from bottle
    setTimeout(() => {
      releaseFireflies();
    }, 300);
  }

  function releaseFireflies() {
    stage = 'spelling';
    const colors = ['#A8FF78','#F2C94C','#00D2FF','#CE93D8','#A8FF78','#F2C94C','#00D2FF','#CE93D8','#A8FF78','#F2C94C'];
    const bottleRect = bottle.getBoundingClientRect();
    const startX = bottleRect.left + bottleRect.width/2;
    const startY = bottleRect.top + bottleRect.height/2;

    colors.forEach((c, i) => {
      const f = document.createElement('span');
      f.textContent = '✨';
      const sz = 16 + Math.floor(Math.random() * 8);
      f.style.cssText = `position:fixed;left:${startX}px;top:${startY}px;font-size:${sz}px;line-height:1;filter:drop-shadow(0 0 8px ${c}) drop-shadow(0 0 16px ${c});color:${c};pointer-events:none;z-index:28;transition:all 1.5s cubic-bezier(0.2,0.8,0.2,1);user-select:none;`;
      document.body.appendChild(f);
      setTimeout(() => {
        // Fly to scattered positions
        const tx = startX + (Math.random() - 0.5) * 200;
        const ty = startY - 80 - Math.random() * 120;
        f.style.left = tx + 'px';
        f.style.top = ty + 'px';
      }, 50 + i * 80);

      // Remove after word formation
      setTimeout(() => {
        f.style.transition = 'all 1s ease-in';
        f.style.opacity = '0';
        setTimeout(() => f.remove(), 1000);
      }, 2500 + i * 50);
    });

    // After fireflies fly around, they form the word "Light"
    setTimeout(() => {
      formLightWord();
    }, 500);
  }

  function formLightWord() {
    lightWordContainer.style.opacity = '1';
    lightWord.style.opacity = '1';
    lightWord.style.transform = 'scale(1)';
    // 显示中文
    const lightWordCn = document.getElementById('light-word-cn');
    if (lightWordCn) lightWordCn.style.opacity = '1';
    playSparkle();
    playSuccessMelody();
    setHint('✨ 萤火虫拼出了单词！点一下跟读~');

    // TTS 读两遍 Light
    speakLightTwice();

    setTimeout(() => {
      lightWordHint.style.opacity = '1';
      stage = 'reading';
    }, 300);
  }

  lightWordBtn.addEventListener('click', () => {
    if (stage !== 'reading') return;
    stage = 'lighting';
    lightWordBtn.style.pointerEvents = 'none';
    lightWordHint.style.opacity = '0';

    // Word pulses on tap (read-along feedback)
    lightWord.style.transform = 'scale(1.15)';
    playChime(659, 0.2);
    setTimeout(() => playChime(880, 0.3), 150);
    setTimeout(() => {
      lightWord.style.transform = 'scale(1)';
    }, 300);

    setHint('🌟 萤火虫飞向三根石柱，点亮凹槽！');

    // Fireflies fly from the word to the 3 pillars
    setTimeout(() => {
      flyToPillars();
    }, 600);
  });

  function flyToPillars() {
    // Animate the word fading out
    lightWord.style.transition = 'all 0.8s ease-in';
    lightWord.style.opacity = '0';
    lightWord.style.transform = 'scale(0.5) translateY(-40px)';
    setTimeout(() => { lightWordContainer.style.opacity = '0'; }, 300);

    // Send fireflies to each of 3 pillars (left, center, right)
    const pillarTargets = [
      { el: document.querySelector('#pillar-left .pillar-groove'), color: '#A8FF78' },
      { el: document.querySelector('#pillar-right .pillar-groove'), color: '#00D2FF' },
      { el: document.querySelector('#pillar-center .pillar-groove'), color: '#F2C94C' }
    ];

    pillarTargets.forEach((t, i) => {
      setTimeout(() => {
        const rect = t.el.getBoundingClientRect();
        // Create a bright firefly that flies to the groove
        const f = document.createElement('span');
        f.textContent = '✨';
        f.style.cssText = `position:fixed;left:50%;top:40%;font-size:20px;line-height:1;filter:drop-shadow(0 0 12px ${t.color}) drop-shadow(0 0 24px ${t.color});color:${t.color};pointer-events:none;z-index:35;transition:all 1.2s cubic-bezier(0.2,0.8,0.2,1);transform:translate(-50%,-50%);user-select:none;`;
        document.body.appendChild(f);
        playChime([659,880,1047][i], 0.4);
        setTimeout(() => {
          f.style.left = rect.left + rect.width/2 + 'px';
          f.style.top = rect.top + rect.height/2 + 'px';
        }, 50);
        setTimeout(() => {
          // Light up the groove!
          t.el.style.background = t.color;
          t.el.style.boxShadow = `0 0 20px ${t.color}, 0 0 40px ${t.color}88, inset 0 0 10px #fff`;
          t.el.style.borderColor = t.color;
          f.style.opacity = '0';
          f.style.transform = 'translate(-50%,-50%) scale(2)';
          setTimeout(() => f.remove(), 400);
        }, 1300);
      }, i * 500);
    });

    // After all pillars lit, show success
    setTimeout(() => {
      showComplete();
    }, 500);
  }

  function showComplete() {
    stage = 'complete';
    // Light up the firefly slot in bottom bar
    fireflySlot.style.background = 'rgba(168,255,120,0.15)';
    fireflySlot.style.border = '2px solid rgba(168,255,120,0.5)';
    fireflySlot.style.boxShadow = '0 0 16px rgba(168,255,120,0.4)';
    const slotSpan = fireflySlot.querySelector('span');
    slotSpan.style.opacity = '1';
    slotSpan.style.filter = 'drop-shadow(0 0 8px rgba(168,255,120,0.8))';

    // Update counter
    const shadowCount = document.querySelector('#firefly-slot')?.parentElement?.parentElement?.querySelector('span');
    if (shadowCount) shadowCount.textContent = '影子收集 1/4';
    const friendCount = document.querySelector('span[style*="朋友"]');
    if (friendCount) friendCount.textContent = '朋友 4/10';

    // Fill a star gem
    const stars = document.querySelectorAll('.star-gem-empty');
    if (stars[0]) {
      stars[0].textContent = '★';
      stars[0].style.color = '#F2C94C';
      stars[0].style.opacity = '1';
      stars[0].style.textShadow = '0 0 8px #F2C94C, 0 0 16px #F2C94C88';
    }

    // Show success overlay
    successOverlay.style.opacity = '1';
    // STARLIGHT_SUCCESS_FEEDBACK
    setTimeout(function() {
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("太棒了！萤火虫回家了！你点亮了黑夜！");
      }
      setTimeout(function() {
        var btn = document.getElementById('btn-continue-adventure');
        if (btn && window.GestureGuide) {
          window.GestureGuide.showTap(btn, { id: 'shadow-jungle-v3_continue', duration: 4000, once: false });
        }
      }, 1500);
    }, 500);
    successOverlay.style.pointerEvents = 'auto';
    playSuccessMelody();
    setHint('🎊 萤火虫家族加入冒险！点击继续探险');

    // Wire continue button
    const continueBtn = document.getElementById('btn-continue-adventure');
    if (continueBtn) {
      continueBtn.addEventListener('click', navigateAfterRescue);
    }
  }
  </script>

  <script>
  // 引导手势动画系统
  window.GestureGuide = {
    STORAGE_KEY: 'starlight_gesture_seen',
    
    
    GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
    
    _enabled: true,
    
    // 检查手势指引是否启用
    isEnabled: function() {
      const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
      return v !== 'false';
    },
    
    // 设置手势指引启用状态
    setEnabled: function(enabled) {
      this._enabled = enabled;
      localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
    },
    
    // 检查是否已经看过某个手势
    hasSeen: function(id) { {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        return seen[id] === true;
      } catch(e) { return false; }
    },
    
    // 标记已看过
    markSeen: function(id) {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        seen[id] = true;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
      } catch(e) {}
    },
    
    // 移除手势
    remove: function(overlay) {
      if (overlay && overlay.parentNode) {
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.3s';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    },
    
    // === 点击手势 ===
    showTap: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'tap_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 手指 emoji
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-tap-anim';
      hand.textContent = '👆';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      // 涟漪
      var ripple = document.createElement('div');
      ripple.className = 'gesture-ripple gesture-ripple-anim';
      ripple.style.left = (rect.left + rect.width / 2) + 'px';
      ripple.style.top = (rect.top + rect.height / 2) + 'px';
      overlay.appendChild(ripple);
      
      document.body.appendChild(overlay);
      
      var self = this;
      var timer = setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      overlay._timer = timer;
      return overlay;
    },
    
    // === 拖拽手势 ===
    showDrag: function(fromEl, toEl, options) {
      var opts = options || {};
      var id = opts.id || 'drag_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 4000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var fromRect = fromEl.getBoundingClientRect();
      var toRect = toEl.getBoundingClientRect();
      
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand';
      hand.textContent = '👆';
      hand.style.fontSize = opts.size || '72px';
      hand.style.position = 'absolute';
      hand.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      hand.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      hand.style.opacity = '0';
      hand.style.transform = 'translate(-50%,-50%)';
      hand.style.transition = 'none';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      // 动画序列：出现→拖到目标→放下→消失
      var steps = [
        { t: 0,    opacity: 0,   x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1.3 },
        { t: 300,  opacity: 1, x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1 },
        { t: 1800, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 2200, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 0.85 },
        { t: 2500, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 3000, opacity: 0,   x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
      ];
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        // 找到当前所在的两个关键帧
        var prev = steps[0], next = steps[steps.length - 1];
        for (var i = 0; i < steps.length - 1; i++) {
          if (elapsed >= steps[i].t && elapsed < steps[i+1].t) {
            prev = steps[i]; next = steps[i+1]; break;
          }
        }
        if (elapsed >= steps[steps.length-1].t) {
          prev = next = steps[steps.length-1];
        }
        
        var progress = (next.t === prev.t) ? 1 : (elapsed - prev.t) / (next.t - prev.t);
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = prev.x + (next.x - prev.x) * ease;
        var curY = prev.y + (next.y - prev.y) * ease;
        var curOp = prev.opacity + (next.opacity - prev.opacity) * ease;
        var curScale = prev.scale + (next.scale - prev.scale) * ease;
        
        hand.style.left = curX + 'px';
        hand.style.top = curY + 'px';
        hand.style.opacity = curOp;
        hand.style.transform = 'translate(-50%,-50%) scale(' + curScale + ')';
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 双指摩擦手势 ===
    showRub: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'rub_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3500;
      var cycles = opts.cycles || 3;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 左手
      var handL = document.createElement('div');
      handL.className = 'gesture-hand';
      handL.textContent = '👆';
      handL.style.fontSize = '64px';
      handL.style.position = 'absolute';
      handL.style.top = (rect.top + rect.height / 2 - 10) + 'px';
      handL.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      handL.style.opacity = '0.9';
      handL.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handL);
      
      // 右手
      var handR = document.createElement('div');
      handR.className = 'gesture-hand';
      handR.textContent = '👆';
      handR.style.fontSize = '64px';
      handR.style.position = 'absolute';
      handR.style.top = (rect.top + rect.height / 2 + 10) + 'px';
      handR.style.left = (rect.left + rect.width / 2 + 20) + 'px';
      handR.style.opacity = '0.9';
      handR.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handR);
      
      document.body.appendChild(overlay);
      
      // 来回搓动
      var rubDuration = 600; // 每次来回 600ms
      var totalRubTime = rubDuration * cycles;
      var startTime = null;
      var fadeStart = totalRubTime + 500;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        if (elapsed < totalRubTime) {
          // 搓动阶段
          var phase = (elapsed % rubDuration) / rubDuration;
          var offset = Math.sin(phase * Math.PI * 2) * 26;
          handL.style.transform = 'translate(calc(-50% + ' + (-offset) + 'px), -50%)';
          handR.style.transform = 'translate(calc(-50% + ' + offset + 'px), -50%)';
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else if (elapsed < fadeStart) {
          // 搓完停留
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else {
          // 淡出
          var fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          var fadeOp = Math.max(0, 0.65 * (1 - fadeProgress));
          handL.style.opacity = fadeOp;
          handR.style.opacity = fadeOp;
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 按住手势 ===
    showPress: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'press_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-press-anim';
      hand.textContent = '👇';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      var self = this;
      setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      return overlay;
    },
    
    // === 喊叫手势 ===
    showShout: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'shout_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 嘴巴 emoji 靠近麦克风
      var mouth = document.createElement('div');
      mouth.className = 'gesture-hand';
      mouth.textContent = '📢';
      mouth.style.left = (rect.left + rect.width / 2) + 'px';
      mouth.style.top = (rect.top - 40) + 'px';
      mouth.style.fontSize = '64px';
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(mouth);
      
      // 声波效果
      for (var i = 1; i <= 3; i++) {
        var wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = (rect.left + rect.width / 2) + 'px';
        wave.style.top = (rect.top - 20) + 'px';
        wave.style.width = (20 + i * 15) + 'px';
        wave.style.height = (20 + i * 15) + 'px';
        wave.style.borderRadius = '50%';
        wave.style.border = '2px solid rgba(242,201,76,0.4)';
        wave.style.opacity = '0';
        wave.style.transform = 'translate(-50%,-50%)';
        wave.style.pointerEvents = 'none';
        wave._delay = i * 200;
        wave._index = i;
        overlay.appendChild(wave);
      }
      
      document.body.appendChild(overlay);
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = elapsed / duration;
        
        // 嘴巴淡入淡出
        if (progress < 0.15) {
          mouth.style.opacity = (progress / 0.15) * 0.7;
        } else if (progress < 0.8) {
          mouth.style.opacity = '1';
        } else {
          mouth.style.opacity = Math.max(0, 0.7 * (1 - (progress - 0.8) / 0.2));
        }
        
        // 声波扩散
        var children = overlay.children;
        for (var i = 1; i < children.length; i++) {
          var w = children[i];
          if (!w._delay) continue;
          var wElapsed = elapsed - w._delay;
          if (wElapsed > 0 && wElapsed < 1500) {
            var wProgress = (wElapsed % 800) / 800;
            w.style.opacity = Math.max(0, 0.4 * (1 - wProgress));
            var wScale = 1 + wProgress * 1.5;
            w.style.transform = 'translate(-50%,-50%) scale(' + wScale + ')';
          } else {
            w.style.opacity = '0';
          }
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    }
  };
  </script>

      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }
    
    let currentUtterance = null;
    
    function stopSpeak() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      currentUtterance = null;
    }
    
    function speakGuide(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      if (!text || !text.trim()) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = opts.rate || 0.9;
      utter.pitch = opts.pitch || 1.3;
      utter.volume = opts.volume || 1;
      
      const voices = synth.getVoices();
      const zhVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
      });
      if (zhVoice) utter.voice = zhVoice;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    function speakEn(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = opts.rate || 0.8;
      utter.pitch = opts.pitch || 1.2;
      utter.volume = opts.volume || 1;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('voice-settings-btn');
      const panel = document.getElementById('voice-settings-panel');
      const toggle = document.getElementById('voice-guide-toggle');
      const gestureToggle = document.getElementById('gesture-guide-toggle');
      const resetBtn = document.getElementById('reset-gesture-btn');
      
      updateBtnIcon();
      if (isVoiceGuideEnabled()) {
        if (toggle) toggle.classList.add('on');
      } else {
        if (toggle) toggle.classList.remove('on');
      }
      
      if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
        if (gestureToggle) gestureToggle.classList.add('on');
      } else {
        if (gestureToggle) gestureToggle.classList.remove('on');
      }
      
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (panel) panel.classList.toggle('show');
        });
      }
      
      document.addEventListener('click', function(e) {
        if (panel && !panel.contains(e.target) && e.target !== btn) {
          panel.classList.remove('show');
        }
      });
      
      if (toggle) {
        toggle.addEventListener('click', function() {
          const enabled = !isVoiceGuideEnabled();
          setVoiceGuideEnabled(enabled);
          if (enabled) {
            toggle.classList.add('on');
          } else {
            toggle.classList.remove('on');
          }
        });
      }
      
      if (gestureToggle) {
        gestureToggle.addEventListener('click', function() {
          const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
          localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
          if (!enabled) {
            gestureToggle.classList.add('on');
          } else {
            gestureToggle.classList.remove('on');
          }
          if (window.GestureGuide && window.GestureGuide.setEnabled) {
            window.GestureGuide.setEnabled(!enabled);
          }
        });
      }
      
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          try {
            localStorage.removeItem('starlight_gesture_seen');
            alert('手势演示已重置！刷新页面即可重新看到引导动画。');
          } catch(e) {}
        });
      }
      
      if (synth) {
        synth.getVoices();
        window.addEventListener('voiceschanged', function() {
          synth.getVoices();
        });
      }
    });
    
    window.VoiceGuide = {
      speak: speakGuide,
      speakEn: speakEn,
      stop: stopSpeak,
      isEnabled: isVoiceGuideEnabled
    };
  })();
  </script>


  <!-- ========== 小星星向导 ========== -->
  <div id="star-guide-container" class="star-guide-container">
    <div id="star-guide-balloon" class="star-guide-balloon"></div>
    <div id="star-guide" class="star-guide" title="小星星向导">⭐</div>
  </div>
  <script>
  // 小星星向导系统
  window.StarGuide = {
    container: null,
    star: null,
    balloon: null,
    currentStep: 0,
    idleTimer: null,
    idleTimeout: 3000,
    isFlying: false,
    targetGlow: null,
    
    shownSteps: [],
    // 每个页面的引导步骤配置
    steps: [],
    
    init: function(stepsConfig) {
      this.container = document.getElementById('star-guide-container');
      this.star = document.getElementById('star-guide');
      this.balloon = document.getElementById('star-guide-balloon');
      this.steps = stepsConfig || [];
      this.currentStep = 0;
      
      this.shownSteps = [];
      if (!this.container || !this.star || !this.balloon) return;
      
      var self = this;
      
      // 星星点击事件
      this.star.addEventListener('click', function() {
        self.showCurrentStep();
      });
      
      // 监听用户操作（重置空闲计时器）
      document.addEventListener('mousedown', function() { self.resetIdleTimer(); });
      document.addEventListener('touchstart', function() { self.resetIdleTimer(); });
      document.addEventListener('pointerdown', function() { self.resetIdleTimer(); });
      
      // 启动空闲检测
      this.startIdleTimer();
      
      // 页面加载完成后，延迟显示星星
      setTimeout(function() {
        self.container.classList.remove('hidden');
      }, 500);
    },
    
    startIdleTimer: function() {
      var self = this;
      this.idleTimer = setTimeout(function() {
        self.onIdle();
      }, this.idleTimeout);
    },
    
    resetIdleTimer: function() {
      if (this.idleTimer) {
        clearTimeout(this.idleTimer);
      }
      this.startIdleTimer();
      // 隐藏气球
      this.hideBalloon();
    },
    
    onIdle: function() {
      if (this.isFlying) return;
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      // 如果步骤需要等待某个条件，则检查
      if (step.condition && !step.condition()) {
        this.startIdleTimer();
        return;
      }

      // 如果本步骤已经展示过，跳过（避免语音重复覆盖教学）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) {
        this.startIdleTimer();
        return;
      }

      
      this.showCurrentStep();

    },
    
    showCurrentStep: function() {
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      var self = this;
      
      // 已展示过的步骤不再朗读（用户点星星时跳过）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) return;
      // 如果有目标元素，飞过去
      if (step.target) {
        var targetEl = typeof step.target === 'string' 
          ? document.querySelector(step.target) 
          : step.target;
        
        if (targetEl) {
          this.flyTo(targetEl, function() {
                        // 记录已展示的步骤，防止重复朗读
            var shownSteps = self.shownSteps || (self.shownSteps = []);
            if (shownSteps.indexOf(self.currentStep) === -1) {
              shownSteps.push(self.currentStep);
            }
            self.speak(step.speak || step.text || '看！那里有一个发光的圈圈，点一下试试！');
            self.showBalloon(step.text || '点一下试试！');
            self.highlightTarget(targetEl);
          });
        } else {
          // 找不到目标，直接显示提示
          this.speak(step.speak || step.text);
          this.showBalloon(step.text);
        }
      } else {
        // 没有目标，直接显示提示
        this.speak(step.speak || step.text);
        this.showBalloon(step.text);
      }
    },
    
    flyTo: function(targetEl, callback) {
      this.isFlying = true;
      
      var starRect = this.star.getBoundingClientRect();
      var targetRect = targetEl.getBoundingClientRect();
      
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      var endX = targetRect.left + targetRect.width / 2;
      var endY = targetRect.top + targetRect.height / 2 - 40;
      
      // 创建飞行中的星星克隆体
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      // 隐藏原星星
      this.container.classList.add('hidden');
      
      // 飞行动画
      var duration = 800;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        // 缓动函数
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 动画结束，移除飞行星星，显示原星星在目标位置
          document.body.removeChild(flyingStar);
          
          // 将原星星移到目标位置
          if (self.container) {
            self.container.style.position = 'fixed';
            self.container.style.left = (endX - 30) + 'px';
            self.container.style.top = (endY - 30) + 'px';
            self.container.style.right = 'auto';
            self.container.style.bottom = 'auto';
            self.container.classList.remove('hidden');
          }
          
          self.isFlying = false;
          if (callback) callback();
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    returnToCorner: function() {
      if (this.isFlying) return;
      
      var self = this;
      
      // 创建飞行中的星星克隆体
      var starRect = this.star.getBoundingClientRect();
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      
      var endX = window.innerWidth - 54;
      var endY = window.innerHeight - 54;
      
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      this.container.classList.add('hidden');
      this.isFlying = true;
      
      var duration = 600;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.removeChild(flyingStar);
          
          self.container.style.position = 'fixed';
          self.container.style.right = '24px';
          self.container.style.bottom = '24px';
          self.container.style.left = 'auto';
          self.container.style.top = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    showBalloon: function(text) {
      if (!this.balloon) return;
      this.balloon.textContent = text;
      this.balloon.classList.add('show');
      
      // 3秒后自动隐藏
      setTimeout(function() {
        this.hideBalloon();
      }.bind(this), 3500);
    },
    
    hideBalloon: function() {
      if (!this.balloon) return;
      this.balloon.classList.remove('show');
    },
    
    highlightTarget: function(targetEl) {
      // 移除旧的光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
      }
      
      var rect = targetEl.getBoundingClientRect();
      this.targetGlow = document.createElement('div');
      this.targetGlow.className = 'star-guide-target-glow';
      this.targetGlow.style.left = (rect.left - 8) + 'px';
      this.targetGlow.style.top = (rect.top - 8) + 'px';
      this.targetGlow.style.width = (rect.width + 16) + 'px';
      this.targetGlow.style.height = (rect.height + 16) + 'px';
      
      document.body.appendChild(this.targetGlow);
      
      // 3秒后移除光环
      setTimeout(function() {
        if (this.targetGlow && this.targetGlow.parentNode) {
          this.targetGlow.parentNode.removeChild(this.targetGlow);
          this.targetGlow = null;
        }
      }.bind(this), 3500);
    },
    
    speak: function(text) {
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak(text);
      }
    },
    
    nextStep: function() {
      // 清除目标光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      
      this.hideBalloon();
      this.currentStep++;
      
      // 返回角落
      setTimeout(function() {
        this.returnToCorner();
        
        // 重新启动空闲检测
        setTimeout(function() {
          this.startIdleTimer();
        }.bind(this), 1000);
      }.bind(this), 500);
    },
    
    reset: function() {
      this.currentStep = 0;
      this.returnToCorner();
      this.hideBalloon();
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      this.startIdleTimer();
    }
  };
  </script>


  <script>
  // STAR_GUIDE_STEPS_firefly - 小星星向导步骤配置
  (function() {
    function initStarGuide() {
      if (window.StarGuide) {
        window.StarGuide.init([
          
    { target: '[data-dir]', text: '点击方向按钮，帮助萤火虫回家！', speak: '点击方向按钮，帮助萤火虫回家！' }
    
        ]);
      } else {
        setTimeout(initStarGuide, 300);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStarGuide);
    } else {
      initStarGuide();
    }
  })();
  </script>
