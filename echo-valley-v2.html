    /* === 语音引导设置面板 === */
    .voice-settings-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .voice-settings-btn:active { transform: scale(0.9); }
    .voice-settings-btn.muted { opacity: 0.5; }
    
    .voice-settings-panel {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 100px);
      right: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      z-index: 101;
      min-width: 200px;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      animation: panelIn 0.2s ease-out;
    }
    .voice-settings-panel.show { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .voice-settings-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .voice-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .voice-setting-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .voice-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .voice-toggle.on { background: #4ECDC4; }
    .voice-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
    }
    .voice-toggle.on::after { left: 22px; }

  
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    /* 点击手势 - 在目标位置脉冲 */
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim {
      animation: gestureTap 1.8s ease-in-out infinite;
    }
    /* 拖拽手势 - 从A拖到B */
    @keyframes gestureDragX {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      10% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      70% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); left: var(--drag-to); }
      80% { opacity: 0.8; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      90% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
    }
    /* 摩擦手势 - 两只手指来回搓 */
    @keyframes gestureRubLeft {
      0%, 100% { transform: translateX(-22px); }
      50% { transform: translateX(22px); }
    }
    @keyframes gestureRubRight {
      0%, 100% { transform: translateX(22px); }
      50% { transform: translateX(-22px); }
    }
    .gesture-rub-left {
      animation: gestureRubLeft 0.6s ease-in-out infinite;
    }
    .gesture-rub-right {
      animation: gestureRubRight 0.6s ease-in-out infinite;
    }
    /* 按住手势 - 手指按下不动 */
    @keyframes gesturePress {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
      20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }
    .gesture-press-anim {
      animation: gesturePress 2s ease-in-out infinite;
    }
    /* 点击涟漪效果 */
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim {
      animation: gestureRipple 1.8s ease-out infinite;
    }
    /* 滑动方向箭头 */
    @keyframes gestureSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(-40px); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    @keyframes gestureSlideLeft {
      0% { opacity: 0; transform: translateX(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }
      80% { opacity: 0.8; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }

  
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5));
      animation: starPulse 2s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .star-guide:hover {
      transform: scale(1.15);
    }
    .star-guide:active {
      transform: scale(0.95);
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7)); }
    }
    .star-guide-balloon {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      max-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s ease-out;
      pointer-events: none;
    }
    .star-guide-balloon.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .star-guide-balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 14px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.95);
      transform: rotate(45deg);
    }
    /* 飞行路径动画 */
    .star-guide-flying {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 44px;
      filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7));
    }
    @keyframes starFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 目标高亮光环 */
    .star-guide-target-glow {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #F2C94C;
      animation: targetGlow 1.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9997;
    }
    @keyframes targetGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

<style>
    /* --- Soundwave hotspot breathing/pulsing animation --- */
    @keyframes sw-breathe {
        0%, 100% {
            transform: scale(1.0);
            opacity: 0.7;
        }
        50% {
            transform: scale(1.18);
            opacity: 1;
        }
    }

    .soundwave-hotspot {
        background: transparent;
        border: none;
        cursor: pointer;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        padding: 4px;
    }

    .sw-ring-outer {
        animation: sw-breathe 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .sw-ring-mid {
        animation: sw-breathe 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        animation-delay: 0.3s;
    }

    .sw-ring-inner {
        animation: sw-breathe 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        animation-delay: 0.6s;
    }

    .sw-label {
        transition: opacity 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .soundwave-hotspot:focus-visible .sw-ring-outer {
        outline: 2px solid white;
        outline-offset: 4px;
    }

    .soundwave-hotspot:active .sw-ripple-container {
        transform: scale(0.92);
        transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* --- Decibel meter pulsing glow --- */
    @keyframes meter-glow-pulse {
        0%, 100% {
            opacity: 0.4;
            transform: scale(1);
        }
        50% {
            opacity: 0.8;
            transform: scale(1.15);
        }
    }

    .decibel-glow {
        animation: meter-glow-pulse 2s ease-in-out infinite;
    }

    .decibel-fill {
        transition: height 320ms cubic-bezier(0.3, 0, 0, 1);
    }

    /* --- Back button interaction --- */
    .ev-back-btn {
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .ev-back-btn:active {
        transform: scale(0.9);
        background: rgba(255,255,255,0.25);
    }

    .ev-back-btn:focus-visible {
        outline: 2px solid rgba(242, 201, 76, 0.8);
        outline-offset: 3px;
    }

    /* --- Toolbar button interaction --- */
    .toolbar-btn {
        transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .toolbar-btn:active {
        transform: scale(0.9);
    }

    .toolbar-btn:focus-visible {
        outline: 2px solid rgba(242, 201, 76, 0.8);
        outline-offset: 3px;
    }

    /* --- Reduced motion support --- */
    @media (prefers-reduced-motion: reduce) {
        .sw-ring-outer,
        .sw-ring-mid,
        .sw-ring-inner,
        .decibel-glow,
        .ev-back-btn,
        .toolbar-btn {
            animation-duration: 0.01ms;
            transition-duration: 0.01ms;
        }
    }

    /* --- Star filled (SVG) style --- */
    .ev-star.star-filled {
        fill: #FDCB6E;
        stroke: #FDCB6E;
        filter: drop-shadow(0 0 6px rgba(253,203,110,0.7));
    }

    /* --- Page fade transition --- */
    .page-fade-out {
        opacity: 0 !important;
        transition: opacity 300ms ease;
    }

    /* --- Completed hotspot visual state --- */
    .soundwave-hotspot.completed .sw-ring-outer {
        border-color: rgba(253, 203, 110, 0.25);
        animation-duration: 4s;
    }
    .soundwave-hotspot.completed .sw-ring-mid {
        border-color: rgba(253, 203, 110, 0.4);
        animation-duration: 4s;
    }
    .soundwave-hotspot.completed .sw-ring-inner {
        background: rgba(253, 203, 110, 0.2);
        border-color: rgba(253, 203, 110, 0.55);
        animation-duration: 4s;
    }
    .sw-check {
        position: absolute;
        top: -4px;
        right: -4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #00B894;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .sw-completed-label {
        color: #FDCB6E !important;
    }

    /* --- Gem celebration overlay --- */
    .ev-gem-overlay {
        position: fixed; inset: 0; z-index: 200;
        background: rgba(0,0,0,0.75);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 400ms ease;
    }
    .ev-gem-overlay.visible { opacity: 1; pointer-events: auto; }
    .ev-gem-card {
        background: linear-gradient(135deg, #FFF8F0 0%, #FFFDF7 100%);
        border-radius: 24px;
        padding: 32px 28px;
        text-align: center;
        max-width: 280px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 60px rgba(253,203,110,0.3);
        transform: scale(0.5);
        transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
        font-family: var(--font-body);
    }
    .ev-gem-overlay.visible .ev-gem-card { transform: scale(1); }
    .ev-gem-icon {
        font-size: 64px;
        display: inline-block;
        animation: evGemSpin 700ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        filter: drop-shadow(0 0 20px rgba(253,203,110,0.8));
    }
    @keyframes evGemSpin {
        0% { transform: scale(0) rotate(-180deg); }
        60% { transform: scale(1.3) rotate(20deg); }
        100% { transform: scale(1) rotate(0deg); }
    }
    .ev-gem-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #2D3436;
        margin: 12px 0 6px;
        font-family: var(--font-display);
    }
    .ev-gem-sub {
        font-size: 0.875rem;
        color: #636E72;
        margin-bottom: 20px;
    }
    .ev-gem-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 24px;
        background: linear-gradient(135deg, #FDCB6E, #F2994A);
        color: white;
        border: none;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(253,203,110,0.5);
        transition: transform 160ms ease;
        font-family: var(--font-body);
    }
    .ev-gem-btn:active { transform: scale(0.95); }
</style>

<script>
    lucide.createIcons();

    // ===== Island Configuration =====
    const ISLAND_ID = 'echoValley';
    const ISLAND_PAGE = 'echo-valley-v2.html';
    const ANIMALS = [
      { id: 'frog',   emoji: '🐸', page: 'echo-valley-v3.html',      hotspotAttr: 'hotspot-frog'   },
      { id: 'owl',    emoji: '🦉', page: 'echo-valley-owl.html',     hotspotAttr: 'hotspot-owl'    },
      { id: 'parrot', emoji: '🦜', page: 'echo-valley-parrot.html',  hotspotAttr: 'hotspot-parrot' }
    ];
    const TOTAL_ANIMALS = ANIMALS.length; // 3
    const WORLD_MAP = 'world-map-v2.html';
    const DB_KEY = 'starCarnivalDB';
    const PROGRESS_KEY_PREFIX = 'starCarnival_progress_';
    const PLAYER_SELECT_PAGE = 'player-select.html';
    const ISLAND_ORDER = ['echoValley', 'bubbleBay', 'shadowJungle'];
    const ISLAND_TOTALS = { echoValley: 3, bubbleBay: 4, shadowJungle: 4 };
    const TOTAL_COMPANIONS = 11;

    // ===== Load Player =====
    let db = { players: [], currentPlayerId: null };
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        db = JSON.parse(raw);
        if (!db.currentPlayerId) db.currentPlayerId = localStorage.getItem('currentPlayerId');
      } else {
        db.currentPlayerId = localStorage.getItem('currentPlayerId');
      }
    } catch(e) { console.warn('Failed to load starCarnivalDB', e); }

    if (!db.currentPlayerId || !db.players || db.players.length === 0) {
      setTimeout(() => {
        if (confirm('还没有选择小探险家，要去选一个吗？')) {
          navigateWithFade(PLAYER_SELECT_PAGE);
        }
      }, 400);
    }

    const player = db.players && db.currentPlayerId ? db.players.find(p => p.id === db.currentPlayerId) : null;

    // ===== Load / Init Progress =====
    const progKey = PROGRESS_KEY_PREFIX + (db.currentPlayerId || '');
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem(progKey) || '{}'); } catch(e) {}

    // Ensure structure
    ISLAND_ORDER.forEach(id => {
      if (!progress[id]) progress[id] = { completed: [], gemEarned: false };
      if (!Array.isArray(progress[id].completed)) progress[id].completed = [];
      if (typeof progress[id].gemEarned !== 'boolean') progress[id].gemEarned = false;
    });
    if (typeof progress.gems !== 'number') progress.gems = 0;
    if (!progress.unlocked) progress.unlocked = ['echoValley'];

    // Migrate legacy progress formats (echoValleyFrog / friends array)
    if (progress.echoValleyFrog && !progress.echoValley.completed.includes('frog')) {
      progress.echoValley.completed.push('frog');
    }
    if (Array.isArray(progress.friends)) {
      progress.friends.forEach(f => {
        if (ANIMALS.find(a => a.id === f) && !progress.echoValley.completed.includes(f)) {
          progress.echoValley.completed.push(f);
        }
      });
    }

    function computeGems() {
      let g = 0;
      ISLAND_ORDER.forEach(id => { if (progress[id].gemEarned) g++; });
      progress.gems = g;
      return g;
    }

    function computeTotalCompanions() {
      let total = 0;
      ISLAND_ORDER.forEach(id => { total += (progress[id].completed || []).length; });
      return total;
    }

    function saveProgress() {
      try { localStorage.setItem(progKey, JSON.stringify(progress)); } catch(e) {}
    }

    computeGems();
    saveProgress();

    // ===== Navigation with fade =====
    function navigateWithFade(url) {
      document.body.classList.add('page-fade-out');
      setTimeout(() => { window.location.href = url; }, 300);
    }

    // ===== Update Player Info =====
    if (player) {
      const av = document.getElementById('ev-player-avatar');
      const nm = document.getElementById('ev-player-name');
      if (av) av.textContent = player.avatar || '⭐';
      if (nm) nm.textContent = player.name || '小探险家';
      window.__currentPlayer = player;
      window.__starCarnivalDB = db;
    }

    // ===== Update Star Display (top-right) =====
    function updateStars() {
      const gems = progress.gems || 0;
      const stars = document.querySelectorAll('.ev-star');
      stars.forEach((s, i) => {
        if (i < gems) {
          s.classList.add('star-filled');
        } else {
          s.classList.remove('star-filled');
        }
      });
    }

    // ===== Update Animal Slots (bottom progress bar) =====
    function updateAnimalSlots() {
      const completed = progress[ISLAND_ID].completed;
      const slots = document.querySelectorAll('#ev-animal-slots .animal-slot');
      slots.forEach(slot => {
        const animalId = slot.dataset.animal;
        if (completed.includes(animalId)) {
          slot.style.opacity = '1';
          slot.style.filter = 'none';
        } else {
          slot.style.opacity = '0.3';
          slot.style.filter = 'grayscale(100%)';
        }
      });
      const countEl = document.getElementById('ev-rescue-count');
      if (countEl) countEl.textContent = '已解救 ' + completed.length + '/' + TOTAL_ANIMALS;
    }

    // ===== Update Companion Count =====
    function updateCompanionCount() {
      const el = document.getElementById('ev-companion-count');
      if (el) el.textContent = '· ' + computeTotalCompanions() + '/' + TOTAL_COMPANIONS + '伙伴';
    }

    // ===== Update Hotspot Visuals (completed state) =====
    // Preserve original labels
    const ORIGINAL_LABELS = {};
    ANIMALS.forEach(animal => {
      const btn = document.querySelector('[data-dom-id="' + animal.hotspotAttr + '"]');
      if (!btn) return;
      const label = btn.querySelector('.sw-label');
      if (label) ORIGINAL_LABELS[animal.id] = label.textContent;
    });

    function updateHotspots() {
      const completed = progress[ISLAND_ID].completed;
      ANIMALS.forEach(animal => {
        const btn = document.querySelector('[data-dom-id="' + animal.hotspotAttr + '"]');
        if (!btn) return;
        const label = btn.querySelector('.sw-label');
        const rippleContainer = btn.querySelector('.sw-ripple-container');
        // Remove any existing checkmark
        const existingCheck = btn.querySelector('.sw-check');
        if (existingCheck) existingCheck.remove();

        if (completed.includes(animal.id)) {
          btn.classList.add('completed');
          // Add checkmark badge
          if (rippleContainer) {
            const check = document.createElement('div');
            check.className = 'sw-check';
            check.textContent = '✓';
            rippleContainer.appendChild(check);
          }
          // Update label to show completed state
          if (label) {
            label.classList.add('sw-completed-label');
            label.textContent = '已解救';
          }
        } else {
          btn.classList.remove('completed');
          if (label) {
            label.classList.remove('sw-completed-label');
            label.textContent = ORIGINAL_LABELS[animal.id] || label.textContent;
          }
        }
      });
    }

    // ===== Hotspot Click Handlers =====
    ANIMALS.forEach(animal => {
      const btn = document.querySelector('[data-dom-id="' + animal.hotspotAttr + '"]');
      if (!btn) return;
      btn.addEventListener('click', () => {
        navigateWithFade(animal.page);
      });
    });

    // ===== Back Button =====
    const backBtn = document.querySelector('[data-dom-id="btn-back-to-map"]');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        navigateWithFade(WORLD_MAP);
      });
    }

    // ===== Initial UI Render =====
    updateStars();
    updateAnimalSlots();
    updateCompanionCount();
    updateHotspots();

    // ===== Check: All animals completed but gem not earned? Redirect to map for gem ceremony =====
    (function checkIslandComplete() {
      const islandProg = progress[ISLAND_ID];
      const allDone = ANIMALS.every(a => islandProg.completed.includes(a.id));
      if (allDone && !islandProg.gemEarned) {
        // Brief pause to show the island with all completed animals, then go to map
        setTimeout(() => {
          document.body.style.transition = 'opacity 0.4s';
          document.body.style.opacity = '0';
          setTimeout(() => {
            window.location.href = WORLD_MAP + '?islandComplete=' + ISLAND_ID;
          }, 400);
        }, 300);
      }
    })();
  </script>

  <script>
  // 页面自动朗读
  (function() {
    const AUTO_SPEAK_WELCOME = '欢迎来到回声谷！这里有神奇的回声，快来探索吧！';
    
    function trySpeakWelcome() {
      if (window.VoiceGuide && typeof window.VoiceGuide.speak === 'function') {
        const STORAGE_KEY = 'echo_valley_welcomed';
        if (!localStorage.getItem(STORAGE_KEY)) {
          setTimeout(function() {
            window.VoiceGuide.speak(AUTO_SPEAK_WELCOME);
            localStorage.setItem(STORAGE_KEY, 'true');
          }, 300);
        }
      } else {
        setTimeout(trySpeakWelcome, 200);
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', trySpeakWelcome);
    } else {
      trySpeakWelcome();
    }
  })();
  </script>


  <script>
  // 语音引导增强：点击文字朗读 + 关键提示自动朗读
  (function() {
    // 等待 VoiceGuide 就绪
    function waitForVoiceGuide(callback) {
      if (window.VoiceGuide) {
        callback();
      } else {
        setTimeout(function() { waitForVoiceGuide(callback); }, 100);
      }
    }
    
    waitForVoiceGuide(function() {
      // 给所有提示类元素添加点击朗读
      function addClickSpeak(selector) {
        var els = document.querySelectorAll(selector);
        els.forEach(function(el) {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function(e) {
            e.stopPropagation();
            var text = el.textContent || el.innerText;
            if (text && text.trim()) {
              window.VoiceGuide.speak(text.trim());
            }
          });
        });
      }
      
      // 常见的提示文字选择器
      var selectors = [
        '#hint-text',
        '#hint-banner',
        '#error-hint-text',
        '#mic-status',
        '#mic-hint',
        '#friction-hint',
        '.hint-text',
        '.tip-text',
        '#gem-title',
        '#gem-subtitle'
      ];
      
      selectors.forEach(function(sel) {
        addClickSpeak(sel);
      });
      
      // 自动朗读初始的 hint-text
      var initialHint = document.querySelector('#hint-text, .hint-text');
      if (initialHint && initialHint.textContent.trim()) {
        setTimeout(function() {
          window.VoiceGuide.speak(initialHint.textContent.trim());
        }, 300);
      }
    });
  })();
  </script>


  <script>
  // 引导手势动画系统
  window.GestureGuide = {
    STORAGE_KEY: 'starlight_gesture_seen',
    
    
    GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
    
    _enabled: true,
    
    // 检查手势指引是否启用
    isEnabled: function() {
      const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
      return v !== 'false';
    },
    
    // 设置手势指引启用状态
    setEnabled: function(enabled) {
      this._enabled = enabled;
      localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
    },
    
    // 检查是否已经看过某个手势
    hasSeen: function(id) {
      return false;
    },
    
    // 标记已看过
    markSeen: function(id) {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        seen[id] = true;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
      } catch(e) {}
    },
    
    // 移除手势
    remove: function(overlay) {
      if (overlay && overlay.parentNode) {
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.3s';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    },
    
    // === 点击手势 ===
    showTap: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'tap_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 手指 emoji
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-tap-anim';
      hand.textContent = '👆';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      // 涟漪
      var ripple = document.createElement('div');
      ripple.className = 'gesture-ripple gesture-ripple-anim';
      ripple.style.left = (rect.left + rect.width / 2) + 'px';
      ripple.style.top = (rect.top + rect.height / 2) + 'px';
      overlay.appendChild(ripple);
      
      document.body.appendChild(overlay);
      
      var self = this;
      var timer = setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      overlay._timer = timer;
      return overlay;
    },
    
    // === 拖拽手势 ===
    showDrag: function(fromEl, toEl, options) {
      var opts = options || {};
      var id = opts.id || 'drag_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 4000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var fromRect = fromEl.getBoundingClientRect();
      var toRect = toEl.getBoundingClientRect();
      
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand';
      hand.textContent = '👆';
      hand.style.fontSize = opts.size || '72px';
      hand.style.position = 'absolute';
      hand.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      hand.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      hand.style.opacity = '0';
      hand.style.transform = 'translate(-50%,-50%)';
      hand.style.transition = 'none';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      // 动画序列：出现→拖到目标→放下→消失
      var steps = [
        { t: 0,    opacity: 0,   x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1.3 },
        { t: 300,  opacity: 1, x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1 },
        { t: 1800, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 2200, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 0.85 },
        { t: 2500, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 3000, opacity: 0,   x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
      ];
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        // 找到当前所在的两个关键帧
        var prev = steps[0], next = steps[steps.length - 1];
        for (var i = 0; i < steps.length - 1; i++) {
          if (elapsed >= steps[i].t && elapsed < steps[i+1].t) {
            prev = steps[i]; next = steps[i+1]; break;
          }
        }
        if (elapsed >= steps[steps.length-1].t) {
          prev = next = steps[steps.length-1];
        }
        
        var progress = (next.t === prev.t) ? 1 : (elapsed - prev.t) / (next.t - prev.t);
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = prev.x + (next.x - prev.x) * ease;
        var curY = prev.y + (next.y - prev.y) * ease;
        var curOp = prev.opacity + (next.opacity - prev.opacity) * ease;
        var curScale = prev.scale + (next.scale - prev.scale) * ease;
        
        hand.style.left = curX + 'px';
        hand.style.top = curY + 'px';
        hand.style.opacity = curOp;
        hand.style.transform = 'translate(-50%,-50%) scale(' + curScale + ')';
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 双指摩擦手势 ===
    showRub: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'rub_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3500;
      var cycles = opts.cycles || 3;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 左手
      var handL = document.createElement('div');
      handL.className = 'gesture-hand';
      handL.textContent = '👆';
      handL.style.fontSize = '64px';
      handL.style.position = 'absolute';
      handL.style.top = (rect.top + rect.height / 2 - 10) + 'px';
      handL.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      handL.style.opacity = '0.9';
      handL.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handL);
      
      // 右手
      var handR = document.createElement('div');
      handR.className = 'gesture-hand';
      handR.textContent = '👆';
      handR.style.fontSize = '64px';
      handR.style.position = 'absolute';
      handR.style.top = (rect.top + rect.height / 2 + 10) + 'px';
      handR.style.left = (rect.left + rect.width / 2 + 20) + 'px';
      handR.style.opacity = '0.9';
      handR.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handR);
      
      document.body.appendChild(overlay);
      
      // 来回搓动
      var rubDuration = 600; // 每次来回 600ms
      var totalRubTime = rubDuration * cycles;
      var startTime = null;
      var fadeStart = totalRubTime + 500;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        if (elapsed < totalRubTime) {
          // 搓动阶段
          var phase = (elapsed % rubDuration) / rubDuration;
          var offset = Math.sin(phase * Math.PI * 2) * 26;
          handL.style.transform = 'translate(calc(-50% + ' + (-offset) + 'px), -50%)';
          handR.style.transform = 'translate(calc(-50% + ' + offset + 'px), -50%)';
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else if (elapsed < fadeStart) {
          // 搓完停留
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else {
          // 淡出
          var fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          var fadeOp = Math.max(0, 0.65 * (1 - fadeProgress));
          handL.style.opacity = fadeOp;
          handR.style.opacity = fadeOp;
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 按住手势 ===
    showPress: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'press_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-press-anim';
      hand.textContent = '👇';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      var self = this;
      setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      return overlay;
    },
    
    // === 喊叫手势 ===
    showShout: function(targetEl, options) {
      var opts = options || {};
      var id = opts.id || 'shout_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 嘴巴 emoji 靠近麦克风
      var mouth = document.createElement('div');
      mouth.className = 'gesture-hand';
      mouth.textContent = '📢';
      mouth.style.left = (rect.left + rect.width / 2) + 'px';
      mouth.style.top = (rect.top - 40) + 'px';
      mouth.style.fontSize = '64px';
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(mouth);
      
      // 声波效果
      for (var i = 1; i <= 3; i++) {
        var wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = (rect.left + rect.width / 2) + 'px';
        wave.style.top = (rect.top - 20) + 'px';
        wave.style.width = (20 + i * 15) + 'px';
        wave.style.height = (20 + i * 15) + 'px';
        wave.style.borderRadius = '50%';
        wave.style.border = '2px solid rgba(242,201,76,0.4)';
        wave.style.opacity = '0';
        wave.style.transform = 'translate(-50%,-50%)';
        wave.style.pointerEvents = 'none';
        wave._delay = i * 200;
        wave._index = i;
        overlay.appendChild(wave);
      }
      
      document.body.appendChild(overlay);
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = elapsed / duration;
        
        // 嘴巴淡入淡出
        if (progress < 0.15) {
          mouth.style.opacity = (progress / 0.15) * 0.7;
        } else if (progress < 0.8) {
          mouth.style.opacity = '1';
        } else {
          mouth.style.opacity = Math.max(0, 0.7 * (1 - (progress - 0.8) / 0.2));
        }
        
        // 声波扩散
        var children = overlay.children;
        for (var i = 1; i < children.length; i++) {
          var w = children[i];
          if (!w._delay) continue;
          var wElapsed = elapsed - w._delay;
          if (wElapsed > 0 && wElapsed < 1500) {
            var wProgress = (wElapsed % 800) / 800;
            w.style.opacity = Math.max(0, 0.4 * (1 - wProgress));
            var wScale = 1 + wProgress * 1.5;
            w.style.transform = 'translate(-50%,-50%) scale(' + wScale + ')';
          } else {
            w.style.opacity = '0';
          }
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    }
  };
  </script>


  <!-- ========== 语音旁白系统 ========== -->
  <button id="voice-settings-btn" class="voice-settings-btn" aria-label="语音设置">🔊</button>
  <div id="voice-settings-panel" class="voice-settings-panel">
    <div class="voice-settings-title">游戏设置</div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">语音引导</span>
      <button id="voice-guide-toggle" class="voice-toggle on" aria-label="语音引导开关"></button>
    </div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">手势指引</span>
      <button id="gesture-guide-toggle" class="voice-toggle on" aria-label="手势指引开关"></button>
    </div>
    <div class="voice-setting-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 8px; padding-top: 12px;">
      <span class="voice-setting-label">重置手势演示</span>
      <button id="reset-gesture-btn" style="background: rgba(255,200,60,0.3); border: 1px solid rgba(255,200,60,0.5); color: #FFC048; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">重置</button>
    </div>
    <div class="voice-setting-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 8px; padding-top: 12px;">
      <span class="voice-setting-label">重置游戏进度</span>
      <button id="reset-progress-btn" style="background: rgba(255,107,107,0.3); border: 1px solid rgba(255,107,107,0.5); color: #FF6B6B; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">清除</button>
    </div>
  </div>
  <script>
  (function() {
    const STORAGE_KEY = 'starlight_voice_guide';
    const synth = window.speechSynthesis;
    
    function isVoiceGuideEnabled() {
      const v = localStorage.getItem(STORAGE_KEY);
      return v !== 'false';
    }
    
    function setVoiceGuideEnabled(enabled) {
      localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
      updateBtnIcon();
      if (enabled) {
        speakGuide('语音引导已开启');
      }
    }
    
    function updateBtnIcon() {
      const btn = document.getElementById('voice-settings-btn');
      if (!btn) return;
      if (isVoiceGuideEnabled()) {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }
    
    let currentUtterance = null;
    
    function stopSpeak() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      currentUtterance = null;
    }
    
    function speakGuide(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      if (!text || !text.trim()) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = opts.rate || 0.9;
      utter.pitch = opts.pitch || 1.3;
      utter.volume = opts.volume || 1;
      
      const voices = synth.getVoices();
      const zhVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
      });
      if (zhVoice) utter.voice = zhVoice;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    function speakEn(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = opts.rate || 0.8;
      utter.pitch = opts.pitch || 1.2;
      utter.volume = opts.volume || 1;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('voice-settings-btn');
      const panel = document.getElementById('voice-settings-panel');
      const toggle = document.getElementById('voice-guide-toggle');
      const gestureToggle = document.getElementById('gesture-guide-toggle');
      const resetBtn = document.getElementById('reset-gesture-btn');
      
      updateBtnIcon();
      if (isVoiceGuideEnabled()) {
        if (toggle) toggle.classList.add('on');
      } else {
        if (toggle) toggle.classList.remove('on');
      }
      
      if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
        if (gestureToggle) gestureToggle.classList.add('on');
      } else {
        if (gestureToggle) gestureToggle.classList.remove('on');
      }
      
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (panel) panel.classList.toggle('show');
        });
      }
      
      document.addEventListener('click', function(e) {
        if (panel && !panel.contains(e.target) && e.target !== btn) {
          panel.classList.remove('show');
        }
      });
      
      if (toggle) {
        toggle.addEventListener('click', function() {
          const enabled = !isVoiceGuideEnabled();
          setVoiceGuideEnabled(enabled);
          if (enabled) {
            toggle.classList.add('on');
          } else {
            toggle.classList.remove('on');
          }
        });
      }
      
      if (gestureToggle) {
        gestureToggle.addEventListener('click', function() {
          const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
          localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
          if (!enabled) {
            gestureToggle.classList.add('on');
          } else {
            gestureToggle.classList.remove('on');
          }
          if (window.GestureGuide && window.GestureGuide.setEnabled) {
            window.GestureGuide.setEnabled(!enabled);
          }
        });
      }
      
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          try {
            localStorage.removeItem('starlight_gesture_seen');
            alert('手势演示已重置！刷新页面即可重新看到引导动画。');
          } catch(e) {}
        });
      }

      // === 重置游戏进度按钮 ===
      var resetProgressBtn = document.getElementById('reset-progress-btn');
      if (resetProgressBtn) {
        resetProgressBtn.addEventListener('click', function() {
          if (confirm('确定要清除所有游戏进度吗？此操作不可撤销！')) {
            var keys = Object.keys(localStorage);
            for (var i = keys.length - 1; i >= 0; i--) {
              var key = keys[i];
              if (key.indexOf('starCarnival') === 0 || 
                  key.indexOf('starlight_') === 0 || 
                  key === 'currentPlayerId') {
                localStorage.removeItem(key);
              }
            }
            alert('游戏进度已清除！页面即将刷新…');
            setTimeout(function() { window.location.reload(); }, 500);
          }
        });
      }
if (synth) {
        synth.getVoices();
        window.addEventListener('voiceschanged', function() {
          synth.getVoices();
        });
      }
    });
    
    window.VoiceGuide = {
      speak: speakGuide,
      speakEn: speakEn,
      stop: stopSpeak,
      isEnabled: isVoiceGuideEnabled
    };
  })();
  </script>


  <!-- ========== 小星星向导 ========== -->
  <div id="star-guide-container" class="star-guide-container">
    <div id="star-guide-balloon" class="star-guide-balloon"></div>
    <div id="star-guide" class="star-guide" title="小星星向导">⭐</div>
  </div>
  <script>
  // 小星星向导系统
  window.StarGuide = {
    container: null,
    star: null,
    balloon: null,
    currentStep: 0,
    idleTimer: null,
    idleTimeout: 3000,
    isFlying: false,
    targetGlow: null,
    
    shownSteps: [],
    // 每个页面的引导步骤配置
    steps: [],
    
    init: function(stepsConfig) {
      this.container = document.getElementById('star-guide-container');
      this.star = document.getElementById('star-guide');
      this.balloon = document.getElementById('star-guide-balloon');
      this.steps = stepsConfig || [];
      this.currentStep = 0;
      
      this.shownSteps = [];
      if (!this.container || !this.star || !this.balloon) return;
      
      var self = this;
      
      // 星星点击事件
      this.star.addEventListener('click', function() {
        self.showCurrentStep();
      });
      
      // 监听用户操作（重置空闲计时器）
      document.addEventListener('mousedown', function() { self.resetIdleTimer(); });
      document.addEventListener('touchstart', function() { self.resetIdleTimer(); });
      document.addEventListener('pointerdown', function() { self.resetIdleTimer(); });
      
      // 启动空闲检测
      this.startIdleTimer();
      
      // 页面加载完成后，延迟显示星星
      setTimeout(function() {
        self.container.classList.remove('hidden');
      }, 500);
    },
    
    startIdleTimer: function() {
      var self = this;
      this.idleTimer = setTimeout(function() {
        self.onIdle();
      }, this.idleTimeout);
    },
    
    resetIdleTimer: function() {
      if (this.idleTimer) {
        clearTimeout(this.idleTimer);
      }
      this.startIdleTimer();
      // 隐藏气球
      this.hideBalloon();
    },
    
    onIdle: function() {
      if (this.isFlying) return;
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      // 如果步骤需要等待某个条件，则检查
      if (step.condition && !step.condition()) {
        this.startIdleTimer();
        return;
      }

      // 如果本步骤已经展示过，跳过（避免语音重复覆盖教学）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) {
        this.startIdleTimer();
        return;
      }

      
      this.showCurrentStep();

    },
    
    showCurrentStep: function() {
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      var self = this;
      
      // 已展示过的步骤不再朗读（用户点星星时跳过）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) return;
      // 如果有目标元素，飞过去
      if (step.target) {
        var targetEl = typeof step.target === 'string' 
          ? document.querySelector(step.target) 
          : step.target;
        
        if (targetEl) {
          this.flyTo(targetEl, function() {
                        // 记录已展示的步骤，防止重复朗读
            var shownSteps = self.shownSteps || (self.shownSteps = []);
            if (shownSteps.indexOf(self.currentStep) === -1) {
              shownSteps.push(self.currentStep);
            }
            self.speak(step.speak || step.text || '看！那里有一个发光的圈圈，点一下试试！');
            self.showBalloon(step.text || '点一下试试！');
            self.highlightTarget(targetEl);
          });
        } else {
          // 找不到目标，直接显示提示
          this.speak(step.speak || step.text);
          this.showBalloon(step.text);
        }
      } else {
        // 没有目标，直接显示提示
        this.speak(step.speak || step.text);
        this.showBalloon(step.text);
      }
    },
    
    flyTo: function(targetEl, callback) {
      this.isFlying = true;
      
      var starRect = this.star.getBoundingClientRect();
      var targetRect = targetEl.getBoundingClientRect();
      
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      var endX = targetRect.left + targetRect.width / 2;
      var endY = targetRect.top + targetRect.height / 2 - 40;
      
      // 创建飞行中的星星克隆体
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      // 隐藏原星星
      this.container.classList.add('hidden');
      
      // 飞行动画
      var duration = 800;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        // 缓动函数
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 动画结束，移除飞行星星，显示原星星在目标位置
          document.body.removeChild(flyingStar);
          
          // 将原星星移到目标位置
          self.container.style.position = 'fixed';
          self.container.style.left = (endX - 30) + 'px';
          self.container.style.top = (endY - 30) + 'px';
          self.container.style.right = 'auto';
          self.container.style.bottom = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
          if (callback) callback();
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    returnToCorner: function() {
      if (this.isFlying) return;
      
      var self = this;
      
      // 创建飞行中的星星克隆体
      var starRect = this.star.getBoundingClientRect();
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      
      var endX = window.innerWidth - 54;
      var endY = window.innerHeight - 54;
      
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      this.container.classList.add('hidden');
      this.isFlying = true;
      
      var duration = 600;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.removeChild(flyingStar);
          
          self.container.style.position = 'fixed';
          self.container.style.right = '24px';
          self.container.style.bottom = '24px';
          self.container.style.left = 'auto';
          self.container.style.top = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    showBalloon: function(text) {
      if (!this.balloon) return;
      this.balloon.textContent = text;
      this.balloon.classList.add('show');
      
      // 3秒后自动隐藏
      setTimeout(function() {
        this.hideBalloon();
      }.bind(this), 3500);
    },
    
    hideBalloon: function() {
      if (!this.balloon) return;
      this.balloon.classList.remove('show');
    },
    
    highlightTarget: function(targetEl) {
      // 移除旧的光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
      }
      
      var rect = targetEl.getBoundingClientRect();
      this.targetGlow = document.createElement('div');
      this.targetGlow.className = 'star-guide-target-glow';
      this.targetGlow.style.left = (rect.left - 8) + 'px';
      this.targetGlow.style.top = (rect.top - 8) + 'px';
      this.targetGlow.style.width = (rect.width + 16) + 'px';
      this.targetGlow.style.height = (rect.height + 16) + 'px';
      
      document.body.appendChild(this.targetGlow);
      
      // 3秒后移除光环
      setTimeout(function() {
        if (this.targetGlow && this.targetGlow.parentNode) {
          this.targetGlow.parentNode.removeChild(this.targetGlow);
          this.targetGlow = null;
        }
      }.bind(this), 3500);
    },
    
    speak: function(text) {
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak(text);
      }
    },
    
    nextStep: function() {
      // 清除目标光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      
      this.hideBalloon();
      this.currentStep++;
      
      // 返回角落
      setTimeout(function() {
        this.returnToCorner();
        
        // 重新启动空闲检测
        setTimeout(function() {
          this.startIdleTimer();
        }.bind(this), 1000);
      }.bind(this), 500);
    },
    
    reset: function() {
      this.currentStep = 0;
      this.returnToCorner();
      this.hideBalloon();
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      this.startIdleTimer();
    }
  };
  </script>


  <script>
  // STAR_GUIDE_STEPS_echo_v2 - 小星星向导步骤配置
  (function() {
    function initStarGuide() {
      if (window.StarGuide) {
        window.StarGuide.init([
          
    { target: '[data-interactive], .interactive-btn', text: '点击开始探索回声谷！', speak: '点击开始探索回声谷！' }
    
        ]);
      } else {
        setTimeout(initStarGuide, 300);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStarGuide);
    } else {
      initStarGuide();
    }
  })();
  </script>
