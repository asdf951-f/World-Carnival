    <style id="theme-vars">
:root {
  --brand-color-primary: #3742FA;
  --brand-color-primary-light: #5352ED;
  --brand-state-success: #00B894;
  --brand-state-warning: #FFC048;
  --brand-state-error: #FF4757;
  --brand-bay-deep: #005B66;
  --brand-bay-water: #00838F;
  --brand-bay-sand: #FDE5B4;
  --brand-bay-coral: #FF6B6B;
  --brand-bay-cyan: #4ECDC4;
  --brand-bay-pink: #FF9FF3;
  --brand-bay-orange: #FF9F43;
  --brand-turtle-green: #2E7D32;
  --brand-turtle-shell: #6D4C41;
  --brand-coconut-brown: #5D4037;
  --brand-coconut-husk: #3E2723;
  --brand-font-display: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --brand-font-body: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
    
    /* === 语音引导设置面板 === */
    .voice-settings-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .voice-settings-btn:active { transform: scale(0.9); }
    .voice-settings-btn.muted { opacity: 0.5; }
    
    .voice-settings-panel {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 100px);
      right: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      z-index: 101;
      min-width: 200px;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      animation: panelIn 0.2s ease-out;
    }
    .voice-settings-panel.show { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .voice-settings-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .voice-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .voice-setting-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .voice-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .voice-toggle.on { background: #4ECDC4; }
    .voice-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
    }
    .voice-toggle.on::after { left: 22px; }

  
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    /* 点击手势 - 在目标位置脉冲 */
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim {
      animation: gestureTap 1.8s ease-in-out infinite;
    }
    /* 拖拽手势 - 从A拖到B */
    @keyframes gestureDragX {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      10% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      70% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); left: var(--drag-to); }
      80% { opacity: 0.8; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      90% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
    }
    /* 摩擦手势 - 两只手指来回搓 */
    @keyframes gestureRubLeft {
      0%, 100% { transform: translateX(-22px); }
      50% { transform: translateX(22px); }
    }
    @keyframes gestureRubRight {
      0%, 100% { transform: translateX(22px); }
      50% { transform: translateX(-22px); }
    }
    .gesture-rub-left {
      animation: gestureRubLeft 0.6s ease-in-out infinite;
    }
    .gesture-rub-right {
      animation: gestureRubRight 0.6s ease-in-out infinite;
    }
    /* 按住手势 - 手指按下不动 */
    @keyframes gesturePress {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
      20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }
    .gesture-press-anim {
      animation: gesturePress 2s ease-in-out infinite;
    }
    /* 点击涟漪效果 */
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim {
      animation: gestureRipple 1.8s ease-out infinite;
    }
    /* 滑动方向箭头 */
    @keyframes gestureSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(-40px); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    @keyframes gestureSlideLeft {
      0% { opacity: 0; transform: translateX(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }
      80% { opacity: 0.8; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }

  
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5));
      animation: starPulse 2s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .star-guide:hover {
      transform: scale(1.15);
    }
    .star-guide:active {
      transform: scale(0.95);
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7)); }
    }
    .star-guide-balloon {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      max-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s ease-out;
      pointer-events: none;
    }
    .star-guide-balloon.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .star-guide-balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 14px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.95);
      transform: rotate(45deg);
    }
    /* 飞行路径动画 */
    .star-guide-flying {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 44px;
      filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7));
    }
    @keyframes starFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 目标高亮光环 */
    .star-guide-target-glow {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #F2C94C;
      animation: targetGlow 1.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9997;
    }
    @keyframes targetGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

<body class="m-0 p-0 overflow-hidden min-h-screen no-select" style="background: #FDE5B4; font-family: var(--brand-font-body); overscroll-behavior: none; -webkit-tap-highlight-color: transparent;">

  <!-- ========== BACK BUTTON ========== -->
  <button data-dom-id="btn-back-to-map"
          class="fixed z-[60] inline-flex items-center justify-center"
          style="top: calc(env(safe-area-inset-top, 0px) + 56px); left: 12px; width: 40px; height: 40px; min-width: 40px; min-height: 40px; border-radius: 50%; background: rgba(253,229,180,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(93,64,55,0.3); color: #5D4037;"
          aria-label="返回泡泡湾">
    <i data-lucide="arrow-left" class="w-5 h-5"></i>
  </button>

  <!-- ========== TOP STATUS BAR ========== -->
  <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4"
          style="min-height: 48px; padding-top: env(safe-area-inset-top, 0px); background: rgba(253,229,180,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(93,64,55,0.15);">
    <div class="flex items-center gap-2">
      <div id="player-av" class="w-7 h-7 rounded-full flex items-center justify-center text-sm shrink-0"
           style="background: rgba(46,125,50,0.2); border: 1.5px solid rgba(46,125,50,0.4);">🧒</div>
      <span id="player-nm" class="font-bold whitespace-nowrap" style="font-size: 12px; font-family: var(--font-body); color: #5D4037; text-shadow: 0 1px 2px rgba(255,255,255,0.3); max-width: 60px; overflow: hidden; text-overflow: ellipsis;">小探险家</span>
      <span class="text-xs" style="color: rgba(93,64,55,0.4);">|</span>
      <span id="top-friend-count" class="text-xs font-semibold whitespace-nowrap" style="color: #5D4037;">朋友 ?/10</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="text-sm font-bold whitespace-nowrap" style="color: #5D4037; text-shadow: 0 0 10px rgba(46,125,50,0.4);">🐢 小海龟</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="text-base star-gem-empty">☆</span>
      <span class="text-base star-gem-empty">☆</span>
      <span class="text-base star-gem-empty">☆</span>
    </div>
  </header>

  <!-- ========== HINT BANNER ========== -->
  <div id="hint-banner" class="fixed z-40 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-500"
       style="top: calc(env(safe-area-inset-top, 0px) + 56px); background: rgba(253,229,180,0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(46,125,50,0.5); color: #2E7D32; text-shadow: 0 0 8px rgba(46,125,50,0.3); box-shadow: 0 0 20px rgba(46,125,50,0.15);">
    <span id="hint-text">沙滩上有一条奇怪的小脚印~</span>
  </div>

  <!-- ========== MAIN SCENE ========== -->
  <main id="main-scene" class="relative w-full h-screen overflow-hidden">
    <!-- 图片背景 -->
    <div class="scene-bg"></div>
    
    <!-- Sky (top portion) -->
    <div class="css-sky absolute inset-0" style="background: linear-gradient(180deg,
      #87CEEB 0%,
      #B3E5FC 15%,
      #E1F5FE 30%,

  <!-- ========== AUDIO & SPEECH ========== -->
  <script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, dur=0.3, type='sine', vol=0.12) {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function playChime(freq) { playTone(freq, 0.3, 'sine', 0.08); }
  function playSuccess() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playChime(f),i*120)); }
  function playPop() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime+0.12);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.18);
  }
  function playShellWobble() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(200, audioCtx.currentTime+0.3);
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.35);
  }
  function playCoconutPop() {
    // Big "pop" sound for coconut cracking open
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime+0.3);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.4);
    // Add noise burst
    setTimeout(() => {
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.15, audioCtx.currentTime);
      ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.15);
      noise.connect(ng); ng.connect(audioCtx.destination);
      noise.start();
    }, 50);
  }
  function playWind() {
    // Wind/blowing sound effect
    ensureAudio();
    const bufferSize = audioCtx.sampleRate * 0.8;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * 0.3;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 600;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0, audioCtx.currentTime);
    ng.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime+0.2);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.8);
    noise.connect(filter); filter.connect(ng); ng.connect(audioCtx.destination);
    noise.start(); noise.stop(audioCtx.currentTime+0.8);
  }
  function playCuteTurtle() {
    [500, 600, 800].forEach((f,i)=>setTimeout(()=>playTone(f,0.15,'sine',0.07),i*100));
  }
  function playThankYou() {
    [523, 659, 784, 1047, 1319].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'triangle',0.08),i*120));
  }
  function speak(text, lang='zh-CN', rate=0.8) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    }
  }
  </script>

  function getCurrentPlayerId() {

      const raw = localStorage.getItem('starCarnivalDB');
      if (raw) {
        const db = JSON.parse(raw);
        if (db.currentPlayerId) return db.currentPlayerId;
      }
    } catch(e){}
    return localStorage.getItem('currentPlayerId');
  }

  function getProgress() {
    const cid = getCurrentPlayerId();
    if (!cid) return null;
    const key = 'starCarnival_progress_' + cid;
    let prog = {};
    try { prog = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => {
      if (!prog[id]) prog[id] = { completed: [], gemEarned: false };
      if (!prog[id].completed) prog[id].completed = [];
    });
    if (typeof prog.gems !== 'number') prog.gems = 0;
    if (!prog.unlocked) prog.unlocked = ['echoValley'];
    return prog;
  }

  function saveProgress(prog) {
    const cid = getCurrentPlayerId();
    if (!cid) return;
    localStorage.setItem('starCarnival_progress_' + cid, JSON.stringify(prog));
  }

  function markAnimalCompleted() {
    const prog = getProgress();
    if (!prog) return;
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
      prog[ISLAND_ID].completed.push(ANIMAL_ID);
    }
    let g = 0;
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
    prog.gems = g;
    saveProgress(prog);
  }

  function navigateAfterRescue() {
    const prog = getProgress();
    if (!prog) {
      document.body.style.transition = 'opacity 0.3s';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = ISLAND_PAGE; }, 300);
      return;
    }
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
        prog[ISLAND_ID].completed.push(ANIMAL_ID);
      }
      let g = 0;
      ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
      prog.gems = g;
      
      // Unlock sticker for this animal
      if (!prog.unlockedStickers) prog.unlockedStickers = [];
      if (!prog.unlockedStickers.includes(ANIMAL_ID)) {
        prog.unlockedStickers.push(ANIMAL_ID);
      }
      
      saveProgress(prog);
      const allDone = ISLAND_ANIMALS.every(a => prog[ISLAND_ID].completed.includes(a));
    document.body.style.transition = 'opacity 0.3s';
    document.body.style.opacity = '0';
    setTimeout(() => {
      window.location.href = allDone ? (WORLD_MAP_PAGE + '?islandComplete=' + ISLAND_ID) : ISLAND_PAGE;
    }, 300);
  }

  function navigateBack() {
    document.body.style.transition = 'opacity 0.25s';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = ISLAND_PAGE; }, 250);
  }

  // Wire back button
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.querySelector('[data-dom-id="btn-back-to-map"]');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        navigateBack();
      });
    }
  });
  </script>

  <!-- ========== INTERACTION STATE MACHINE ========== -->
  <script>
  let stage = 'trail'; // trail -> wobble -> choice -> pinch/blow -> open -> peek -> speech -> crawl -> complete
  let pinchScale = 1;       // coconut shell scale (pinch mode)
  let startPinchScale = 1;  // scale at pinch start
  let initialPinchDist = 0;
  let isPinching = false;
  let blowActive = false;
  let micActive = false;
  let audioStream = null;
  let micAnalyser = null;
  let micDataArray = null;
  let micAnimFrame = null;
  let recognition = null;
  let volCheckInterval = null;
  let wobbleCount = 0;

  const crawlTrail = document.getElementById('crawl-trail');
  const coconutShellWrap = document.getElementById('coconut-shell-wrap');
  const coconutShell = document.getElementById('coconut-shell');
  const shellShadow = document.getElementById('shell-shadow');
  const turtleContainer = document.getElementById('turtle-container');
  const turtleBody = document.getElementById('turtle-body');
  const turtleBubble = document.getElementById('turtle-bubble');
  const bubbleText = document.getElementById('bubble-text');
  const choicePanel = document.getElementById('choice-panel');
  const pinchIndicator = document.getElementById('pinch-indicator');
  const blowPanel = document.getElementById('blow-panel');
  const pinchBtn = document.getElementById('pinch-btn');
  const blowBtn = document.getElementById('blow-btn');
  const micBtn = document.getElementById('mic-btn');
  const blowMeter = document.getElementById('blow-meter');
  const speechPrompt = document.getElementById('speech-prompt');
  const speechMicBtn = document.getElementById('speech-mic-btn');
  const speechBar = document.getElementById('speech-bar');
  const successOverlay = document.getElementById('success-overlay');
  const turtleSlot = document.getElementById('turtle-slot');
  const topFriendCount = document.getElementById('top-friend-count');
  const friendCount = document.getElementById('friend-count');
  const hintText = document.getElementById('hint-text');
  const mainScene = document.getElementById('main-scene');
  const trailSparkle = document.getElementById('trail-sparkle');

  // Set friend counts (turtle is 3rd friend after starfish? In bubble bay context)
  topFriendCount.textContent = '朋友 3/10';
  friendCount.textContent = '朋友 3/10';

  function setHint(text) {
    hintText.textContent = text;
    if (window.VoiceGuide && window.VoiceGuide.isEnabled && window.VoiceGuide.isEnabled()) {
      clearTimeout(window.voiceGuide_hintTimer);
      window.voiceGuide_hintTimer = setTimeout(function() {
        window.VoiceGuide.speak(text);
      }, 300);
    }
  }

  function showBubble(text, duration = 2000) {
    bubbleText.textContent = text;
    turtleBubble.style.transform = 'translateX(-50%) scale(1)';
    setTimeout(() => {
      turtleBubble.style.transform = 'translateX(-50%) scale(0)';
    }, duration);
  }

  // ===== STAGE 1: Click S-trail, coconut wobbles =====
  crawlTrail.addEventListener('click', () => {
    if (stage !== 'trail') return;
    stage = 'wobble';
    ensureAudio();
    playPop();

    // Trail fades
    crawlTrail.style.transition = 'opacity 0.5s';
    crawlTrail.style.opacity = '0';
    crawlTrail.style.pointerEvents = 'none';

    setHint('好像有东西在椰子壳下面...');

    // Coconut wobble animation
    wobbleShell(3);
  });

  function wobbleShell(times) {
    wobbleCount = 0;
    function wob() {
      wobbleCount++;
      playShellWobble();
      coconutShellWrap.style.animation = 'shellWobble 0.25s ease-in-out';
      setTimeout(() => {
        coconutShellWrap.style.animation = '';
        if (wobbleCount < times) {
          setTimeout(wob, 200);
        } else {
          // After wobbling, show choice panel
          setTimeout(() => {
            stage = 'choice';
            setHint('用什么方法打开椰子壳呢？');
            choicePanel.style.transform = 'translate(-50%, -50%) scale(1)';
            choicePanel.style.pointerEvents = 'auto';
          }, 400);
        }
      }, 250);
    }
    wob();
  }

  // ===== STAGE 2: Choose pinch or blow =====
  pinchBtn.addEventListener('click', () => {
    if (stage !== 'choice') return;
    startPinchMode();
  });
  blowBtn.addEventListener('click', () => {
    if (stage !== 'choice') return;
    startBlowMode();
  });

  function hideChoicePanel() {
    choicePanel.style.transform = 'translate(-50%, -50%) scale(0)';
    choicePanel.style.pointerEvents = 'none';
  }

  // ----- PINCH MODE -----
  function startPinchMode() {
    stage = 'pinch';
    hideChoicePanel();
    setHint('双指捏拢，把椰子壳捏小！');
    pinchIndicator.style.display = 'block';
    pinchScale = 1;
    // Listen for multi-touch
    mainScene.addEventListener('touchstart', onPinchStart, { passive: false });
    mainScene.addEventListener('touchmove', onPinchMove, { passive: false });
    mainScene.addEventListener('touchend', onPinchEnd);
    // Also support mouse wheel as desktop fallback
    mainScene.addEventListener('wheel', onWheelPinch, { passive: false });
    // Desktop: two-key pinch simulation (Q/W keys) - just for testing, not needed for real use
  }

  function onPinchStart(e) {
    if (stage !== 'pinch') return;
    if (e.touches.length >= 2) {
      e.preventDefault();
      isPinching = true;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialPinchDist = Math.sqrt(dx*dx + dy*dy);
      startPinchScale = pinchScale;
    }
  }

  function onPinchMove(e) {
    if (stage !== 'pinch' || !isPinching || e.touches.length < 2) return;
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (initialPinchDist > 0) {
      const ratio = dist / initialPinchDist;
      // Pinch inward = ratio < 1, shrink shell; outward = ratio > 1, grow back
      pinchScale = Math.max(0.15, Math.min(1, startPinchScale * ratio));
      updateShellScale();

      if (pinchScale <= 0.25) {
        // Coconut popped open!
        onCoconutOpen();
      }
    }
  }

  function onPinchEnd() {
    isPinching = false;
    initialPinchDist = 0;
  }

  function onWheelPinch(e) {
    if (stage !== 'pinch') return;
    e.preventDefault();
    // Wheel up = shrink (pinch)
    if (e.deltaY > 0) {
      pinchScale = Math.max(0.15, pinchScale - 0.04);
    } else {
      pinchScale = Math.min(1, pinchScale + 0.04);
    }
    updateShellScale();
    if (pinchScale <= 0.25) {
      onCoconutOpen();
    }
  }

  function updateShellScale() {
    coconutShellWrap.style.transform = `scale(${pinchScale})`;
    shellShadow.style.transform = `translateX(-50%) scale(${pinchScale * 0.8})`;
    shellShadow.style.opacity = pinchScale;
  }

  // ----- BLOW MODE -----
  function startBlowMode() {
    stage = 'blow';
    hideChoicePanel();
    setHint('点一下麦克风，然后用力吹！');
    blowPanel.style.display = 'flex';
    blowPanel.style.transform = 'translate(-50%, -50%) scale(1)';
    blowPanel.style.pointerEvents = 'auto';

    micBtn.addEventListener('click', startMicBlow, { once: false });
  }

  async function startMicBlow() {
    if (blowActive) return;
    try {
      ensureAudio();
      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = audioCtx.createMediaStreamSource(audioStream);
      micAnalyser = audioCtx.createAnalyser();
      micAnalyser.fftSize = 256;
      source.connect(micAnalyser);
      micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
      blowActive = true;
      micBtn.style.boxShadow = '0 0 40px rgba(0,131,143,0.8), inset 0 0 20px rgba(78,205,196,0.3)';
      playWind();
      setHint('呼呼呼——用力吹！');
      detectBlow();
    } catch (err) {
      // Fallback: tap button rapidly
      setHint('没有麦克风？连点按钮代替~');
      let taps = 0;
      const fallbackHandler = () => {
        if (stage !== 'blow') return;
        taps++;
        blowMeter.style.width = Math.min(100, taps * 12) + '%';
        playWind();
        if (taps >= 9) {
          micBtn.removeEventListener('click', fallbackHandler);
          onCoconutOpen();
        }
      };
      micBtn.addEventListener('click', fallbackHandler);
    }
  }

  function detectBlow() {
    if (!blowActive || !micAnalyser) return;
    micAnalyser.getByteFrequencyData(micDataArray);
    // Blowing creates wind noise concentrated in low frequencies.
    // Only check the low-frequency bins (first 1/4 of spectrum) for accurate blow detection.
    const lowBins = Math.max(8, Math.floor(micDataArray.length / 4));
    let lowSum = 0;
    for (let i = 0; i < lowBins; i++) lowSum += micDataArray[i];
    const lowAvg = lowSum / lowBins;
    // Also compute overall avg for visual meter
    let totalSum = 0;
    for (let i = 0; i < micDataArray.length; i++) totalSum += micDataArray[i];
    const totalAvg = totalSum / micDataArray.length;

    // Meter reflects low-freq blow intensity (more responsive)
    const level = Math.min(1, lowAvg / 100);
    blowMeter.style.width = (level * 100) + '%';

    // Trigger when low-freq average exceeds threshold (blowing into mic produces strong low-freq signal)
    if (lowAvg > 45) {
      onCoconutOpen();
      return;
    }
    micAnimFrame = requestAnimationFrame(detectBlow);
  }

  // ===== STAGE 3: Coconut opens, turtle peeks =====
  function onCoconutOpen() {
    if (stage === 'open' || stage === 'peek' || stage === 'speech' || stage === 'crawl' || stage === 'complete') return;
    stage = 'open';
    playCoconutPop();

    // Clean up listeners
    mainScene.removeEventListener('touchstart', onPinchStart);
    mainScene.removeEventListener('touchmove', onPinchMove);
    mainScene.removeEventListener('touchend', onPinchEnd);
    mainScene.removeEventListener('wheel', onWheelPinch);
    if (micAnimFrame) cancelAnimationFrame(micAnimFrame);
    if (audioStream) {
      audioStream.getTracks().forEach(t => t.stop());
      audioStream = null;
    }
    blowActive = false;

    // Hide panels
    pinchIndicator.style.display = 'none';
    blowPanel.style.transform = 'translate(-50%, -50%) scale(0)';
    blowPanel.style.display = 'none';

    // Coconut bounces/scales small then flips away
    coconutShellWrap.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s';
    coconutShellWrap.style.transform = 'scale(0.3) rotate(30deg) translateY(-30px)';
    setTimeout(() => {
      coconutShellWrap.style.transform = 'scale(0.1) rotate(90deg) translateY(-100px) translateX(100px)';
      coconutShellWrap.style.opacity = '0';
    }, 200);

    setHint('哇！椰子壳里有一只小海龟！');

    setTimeout(() => {
      // Turtle peeks out
      stage = 'peek';
      turtleContainer.style.opacity = '1';
      turtleContainer.style.transform = 'scale(1) translateY(0)';
      turtleContainer.style.pointerEvents = 'auto';
      playCuteTurtle();

      setTimeout(() => {
        // Show speech bubble
        turtleBody.style.animation = 'turtlePeek 0.5s ease-in-out 2';
        showBubble('🐢', 300);

        setTimeout(() => {
          stage = 'speech';
          setHint('对小海龟说"谢谢！"');
          showBubble('?', 2500);
          startSpeechRecognition();
        }, 1200);
      }, 600);
    }, 500);
  }

  // ===== STAGE 4: Say "Thank you" / "谢谢" =====
  function startSpeechRecognition() {
    speechPrompt.style.opacity = '1';
    speechPrompt.style.transform = 'translateX(-50%) scale(1)';
    speechPrompt.style.pointerEvents = 'auto';

    speechMicBtn.removeEventListener('click', activateSpeechMic);
    speechMicBtn.addEventListener('click', activateSpeechMic);
    setHint('点麦克风，对小海龟说"谢谢！"');
    if (window.VoiceGuide) {
      window.VoiceGuide.speak("点麦克风，对小海龟说谢谢！Thank you就是谢谢！");
    }
  }

  let recognitionRetryCount = 0;
  const MAX_RECOGNITION_RETRIES = 3;

  async function activateSpeechMic() {
    if (micActive) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    cleanupMicResources();

    if (SR) {
      try {
        recognition = new SR();
        recognition.lang = 'zh-CN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 5;
        recognition.continuous = false;

        recognition.onstart = () => {
          micActive = true;
          speechMicBtn.style.boxShadow = '0 0 30px rgba(46,125,50,0.7)';
          ensureAudio();
          audioStream = recognition.stream;
          if (audioStream) {
            const source = audioCtx.createMediaStreamSource(audioStream);
            micAnalyser = audioCtx.createAnalyser();
            micAnalyser.fftSize = 256;
            source.connect(micAnalyser);
            micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
            detectSpeechVolume();
          }
        };

        recognition.onresult = (event) => {
          recognitionRetryCount = 0;
          let said = '';
          let confidence = 0;
          for (let i = 0; i < event.results[0].length; i++) {
            said += event.results[0][i].transcript.toLowerCase();
            confidence = Math.max(confidence, event.results[0][i].confidence);
          }
          checkSpeechResult(said, confidence);
        };
        recognition.onerror = (event) => {
          cleanupMicResources();
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            setHint('请允许使用麦克风~');
            if (window.VoiceGuide) {
              window.VoiceGuide.speak("请允许使用麦克风哦！");
            }
          } else if (event.error === 'no-speech' || event.error === 'aborted') {
            setHint('没听到声音，点麦克风再试试~');
            showBubble('?', 300);
          } else {
            setHint('点麦克风，再试试~');
          }
        };
        recognition.onend = () => {
          cleanupMicResources();
        };
        recognition.start();
      } catch (e) {
        recognitionRetryCount = 0;
        setupVolumeFallback();
      }
    } else {
      recognitionRetryCount = 0;
      setupVolumeFallback();
    }
  }

  function cleanupMicResources() {
    micActive = false;
    speechMicBtn.style.boxShadow = '';
    if (audioStream) {
      audioStream.getTracks().forEach(t => t.stop());
      audioStream = null;
    }
    if (micAnimFrame) {
      cancelAnimationFrame(micAnimFrame);
      micAnimFrame = null;
    }
    if (recognition) {
      try { recognition.abort(); } catch(e){}
      recognition = null;
    }
    micAnalyser = null;
    micDataArray = null;
  }

  function detectSpeechVolume() {
    if (!micActive || !micAnalyser) return;
    micAnalyser.getByteFrequencyData(micDataArray);
    let sum = 0;
    for (let i = 0; i < micDataArray.length; i++) sum += micDataArray[i];
    const avg = sum / micDataArray.length;
    const level = Math.min(1, avg / 80);
    speechBar.style.width = (level * 100) + '%';
    micAnimFrame = requestAnimationFrame(detectSpeechVolume);
  }

  function setupVolumeFallback() {
    if (volCheckInterval) { clearInterval(volCheckInterval); volCheckInterval = null; }
    if (!micActive || !micAnalyser) {
      setHint('点麦克风，大声说"谢谢！"');
      return;
    }
    let sustainedCount = 0;
    volCheckInterval = setInterval(() => {
      if (stage !== 'speech') { clearInterval(volCheckInterval); volCheckInterval = null; return; }
      if (!micDataArray) return;
      let sum = 0;
      for (let i = 0; i < micDataArray.length; i++) sum += micDataArray[i];
      const avg = sum / micDataArray.length;
      const level = Math.min(1, avg / 80);
      speechBar.style.width = (level * 100) + '%';
      if (avg > 85) {
        sustainedCount++;
        if (sustainedCount >= 8) {
          clearInterval(volCheckInterval);
          volCheckInterval = null;
          onThankYouSuccess('good');
        }
      } else {
        sustainedCount = Math.max(0, sustainedCount - 1);
      }
    }, 100);
  }

  function checkSpeechResult(said, confidence) {
    const clean = said.replace(/\s+/g, '').toLowerCase();
    if (clean.includes('谢谢') || clean.includes('thank') || clean.includes('thanks') || clean.includes('xiexie')) {
      if (confidence >= 0.7) {
        onThankYouSuccess('perfect');
      } else {
        onThankYouSuccess('good');
      }
    } else if (said.length > 1) {
      setHint('再说一次~说"谢谢！"');
      showBubble('?', 300);
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("再跟我说一遍哦~");
      }
    }
  }

  function onThankYouSuccess(level) {
    stage = 'crawl';
    playThankYou();
    cleanupMicResources();

    speechPrompt.style.opacity = '0';
    speechPrompt.style.transform = 'translateX(-50%) scale(0.7)';
    speechPrompt.style.pointerEvents = 'none';

    if (level === 'perfect') {
      setHint('✨ 说得太棒了！星光奖励！');
      showBubble('谢谢！🌟', 500);
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("谢谢！说得太棒了！");
      }
    } else {
      showBubble('谢谢！', 500);
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("谢谢！");
      }
    }
    turtleBody.style.animation = 'turtleNod 0.6s ease-in-out 2';

    setTimeout(() => {
      setHint('小海龟慢慢爬向大海啦~');
      // Turtle crawls upward toward the ocean (upper area in background image)
      turtleContainer.style.transition = 'left 3.5s ease-in-out, bottom 2.5s ease-in-out, transform 1s, opacity 1s';
      turtleContainer.style.left = '30%';
      turtleContainer.style.bottom = '68%';
      turtleContainer.style.transform = 'scale(0.7) rotate(10deg)';

      // Crawling animation - little bounces
      let crawlStep = 0;
      const crawlInterval = setInterval(() => {
        crawlStep++;
        turtleBody.style.transform = `translateY(${crawlStep % 2 === 0 ? 0 : -4}px) rotate(${crawlStep % 2 === 0 ? 0 : -5}deg)`;
        if (crawlStep > 14) {
          clearInterval(crawlInterval);
          // Turtle reaches ocean, dives in
          setTimeout(() => {
            turtleContainer.style.opacity = '0';
            turtleContainer.style.transform = 'scale(0.5) translateY(20px)';
            onTurtleHome();
          }, 500);
        }
      }, 200);
    }, 2000);
  }

  function onTurtleHome() {
    stage = 'complete';
    playSuccess();
    showSuccess();
    spawnConfetti();
  }

  function showSuccess() {
    // Fill turtle slot
    turtleSlot.style.background = 'rgba(46,125,50,0.15)';
    turtleSlot.style.border = '2px solid rgba(46,125,50,0.5)';
    turtleSlot.style.boxShadow = '0 0 16px rgba(46,125,50,0.4)';
    const slotSpan = turtleSlot.querySelector('span');
    slotSpan.style.opacity = '1';
    slotSpan.style.filter = 'drop-shadow(0 0 8px rgba(46,125,50,0.7))';

    // Friend count
    topFriendCount.textContent = '朋友 4/10';
    friendCount.textContent = '朋友 4/10';

    // Fill a star
    const emptyStars = document.querySelectorAll('.star-gem-empty');
    if (emptyStars[0]) {
      emptyStars[0].textContent = '★';
      emptyStars[0].style.color = '#2E7D32';
      emptyStars[0].className = 'star-gem-filled';
      emptyStars[0].style.textShadow = '0 0 8px rgba(46,125,50,0.8), 0 0 16px rgba(46,125,50,0.5)';
    }

    successOverlay.style.opacity = '1';
    // STARLIGHT_SUCCESS_FEEDBACK
    setTimeout(function() {
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("太棒了！小海龟安全回家了！你真厉害！");
      }
      setTimeout(function() {
        var btn = document.getElementById('btn-continue-adventure');
        if (btn && window.GestureGuide) {
          window.GestureGuide.showTap(btn, { id: 'bubble-bay-turtle_continue', duration: 4000, once: false });
        }
      }, 1500);
    }, 500);
    successOverlay.style.pointerEvents = 'auto';

    // Wire continue button (once)
    const continueBtn = document.getElementById('btn-continue-adventure');
    if (continueBtn && !continueBtn._wired) {
      continueBtn._wired = true;
      continueBtn.addEventListener('click', () => {
        continueBtn.style.transform = 'scale(0.95)';
        setTimeout(() => navigateAfterRescue(), 120);
      });
      continueBtn.addEventListener('touchstart', () => {
        continueBtn.style.transform = 'scale(0.95)';
      }, { passive: true });
    }
  }

  // Confetti

  <script>
  // 引导手势动画系统
  window.GestureGuide = {
    STORAGE_KEY: 'starlight_gesture_seen',
    
    
    GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
    
    _enabled: true,
    
    // 检查手势指引是否启用
    isEnabled: function() {
      const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
      return v !== 'false';
    },
    
    // 设置手势指引启用状态
    setEnabled: function(enabled) {
      this._enabled = enabled;
      localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
    },
    
    // 检查是否已经看过某个手势
    hasSeen: function(id) { {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        return seen[id] === true;
      } catch(e) { return false; }
    },
    
    // 标记已看过
    markSeen: function(id) {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        seen[id] = true;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
      } catch(e) {}
    },
    
    // 移除手势
    remove: function(overlay) {
      if (overlay && overlay.parentNode) {
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.3s';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    },
    
    // === 点击手势 ===
    showTap: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'tap_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 手指 emoji
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-tap-anim';
      hand.textContent = '👆';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      // 涟漪
      var ripple = document.createElement('div');
      ripple.className = 'gesture-ripple gesture-ripple-anim';
      ripple.style.left = (rect.left + rect.width / 2) + 'px';
      ripple.style.top = (rect.top + rect.height / 2) + 'px';
      overlay.appendChild(ripple);
      
      document.body.appendChild(overlay);
      
      var self = this;
      var timer = setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      overlay._timer = timer;
      return overlay;
    },
    
    // === 拖拽手势 ===
    showDrag: function(fromEl, toEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'drag_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 4000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var fromRect = fromEl.getBoundingClientRect();
      var toRect = toEl.getBoundingClientRect();
      
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand';
      hand.textContent = '👆';
      hand.style.fontSize = opts.size || '72px';
      hand.style.position = 'absolute';
      hand.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      hand.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      hand.style.opacity = '0';
      hand.style.transform = 'translate(-50%,-50%)';
      hand.style.transition = 'none';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      // 动画序列：出现→拖到目标→放下→消失
      var steps = [
        { t: 0,    opacity: 0,   x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1.3 },
        { t: 300,  opacity: 1, x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1 },
        { t: 1800, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 2200, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 0.85 },
        { t: 2500, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 3000, opacity: 0,   x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
      ];
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        // 找到当前所在的两个关键帧
        var prev = steps[0], next = steps[steps.length - 1];
        for (var i = 0; i < steps.length - 1; i++) {
          if (elapsed >= steps[i].t && elapsed < steps[i+1].t) {
            prev = steps[i]; next = steps[i+1]; break;
          }
        }
        if (elapsed >= steps[steps.length-1].t) {
          prev = next = steps[steps.length-1];
        }
        
        var progress = (next.t === prev.t) ? 1 : (elapsed - prev.t) / (next.t - prev.t);
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = prev.x + (next.x - prev.x) * ease;
        var curY = prev.y + (next.y - prev.y) * ease;
        var curOp = prev.opacity + (next.opacity - prev.opacity) * ease;
        var curScale = prev.scale + (next.scale - prev.scale) * ease;
        
        hand.style.left = curX + 'px';
        hand.style.top = curY + 'px';
        hand.style.opacity = curOp;
        hand.style.transform = 'translate(-50%,-50%) scale(' + curScale + ')';
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 双指摩擦手势 ===
    showRub: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'rub_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3500;
      var cycles = opts.cycles || 3;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 左手
      var handL = document.createElement('div');
      handL.className = 'gesture-hand';
      handL.textContent = '👆';
      handL.style.fontSize = '64px';
      handL.style.position = 'absolute';
      handL.style.top = (rect.top + rect.height / 2 - 10) + 'px';
      handL.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      handL.style.opacity = '0.9';
      handL.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handL);
      
      // 右手
      var handR = document.createElement('div');
      handR.className = 'gesture-hand';
      handR.textContent = '👆';
      handR.style.fontSize = '64px';
      handR.style.position = 'absolute';
      handR.style.top = (rect.top + rect.height / 2 + 10) + 'px';
      handR.style.left = (rect.left + rect.width / 2 + 20) + 'px';
      handR.style.opacity = '0.9';
      handR.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handR);
      
      document.body.appendChild(overlay);
      
      // 来回搓动
      var rubDuration = 600; // 每次来回 600ms
      var totalRubTime = rubDuration * cycles;
      var startTime = null;
      var fadeStart = totalRubTime + 500;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        if (elapsed < totalRubTime) {
          // 搓动阶段
          var phase = (elapsed % rubDuration) / rubDuration;
          var offset = Math.sin(phase * Math.PI * 2) * 26;
          handL.style.transform = 'translate(calc(-50% + ' + (-offset) + 'px), -50%)';
          handR.style.transform = 'translate(calc(-50% + ' + offset + 'px), -50%)';
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else if (elapsed < fadeStart) {
          // 搓完停留
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else {
          // 淡出
          var fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          var fadeOp = Math.max(0, 0.65 * (1 - fadeProgress));
          handL.style.opacity = fadeOp;
          handR.style.opacity = fadeOp;
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 按住手势 ===
    showPress: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'press_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-press-anim';
      hand.textContent = '👇';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      var self = this;
      setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      return overlay;
    },
    
    // === 喊叫手势 ===
    showShout: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'shout_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 嘴巴 emoji 靠近麦克风
      var mouth = document.createElement('div');
      mouth.className = 'gesture-hand';
      mouth.textContent = '📢';
      mouth.style.left = (rect.left + rect.width / 2) + 'px';
      mouth.style.top = (rect.top - 40) + 'px';
      mouth.style.fontSize = '64px';
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(mouth);
      
      // 声波效果
      for (var i = 1; i <= 3; i++) {
        var wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = (rect.left + rect.width / 2) + 'px';
        wave.style.top = (rect.top - 20) + 'px';
        wave.style.width = (20 + i * 15) + 'px';
        wave.style.height = (20 + i * 15) + 'px';
        wave.style.borderRadius = '50%';
        wave.style.border = '2px solid rgba(242,201,76,0.4)';
        wave.style.opacity = '0';
        wave.style.transform = 'translate(-50%,-50%)';
        wave.style.pointerEvents = 'none';
        wave._delay = i * 200;
        wave._index = i;
        overlay.appendChild(wave);
      }
      
      document.body.appendChild(overlay);
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = elapsed / duration;
        
        // 嘴巴淡入淡出
        if (progress < 0.15) {
          mouth.style.opacity = (progress / 0.15) * 0.7;
        } else if (progress < 0.8) {
          mouth.style.opacity = '1';
        } else {
          mouth.style.opacity = Math.max(0, 0.7 * (1 - (progress - 0.8) / 0.2));
        }
        
        // 声波扩散
        var children = overlay.children;
        for (var i = 1; i < children.length; i++) {
          var w = children[i];
          if (!w._delay) continue;
          var wElapsed = elapsed - w._delay;
          if (wElapsed > 0 && wElapsed < 1500) {
            var wProgress = (wElapsed % 800) / 800;
            w.style.opacity = Math.max(0, 0.4 * (1 - wProgress));
            var wScale = 1 + wProgress * 1.5;
            w.style.transform = 'translate(-50%,-50%) scale(' + wScale + ')';
          } else {
            w.style.opacity = '0';
          }
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    }
  };
  </script>

    }
    
    function setVoiceGuideEnabled(enabled) {
      localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
      updateBtnIcon();
      if (enabled) {
        speakGuide('语音引导已开启');
      }
    }
    
    function updateBtnIcon() {
      const btn = document.getElementById('voice-settings-btn');
      if (!btn) return;
      if (isVoiceGuideEnabled()) {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }
    
    let currentUtterance = null;
    
    function stopSpeak() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      currentUtterance = null;
    }
    
    function speakGuide(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      if (!text || !text.trim()) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = opts.rate || 0.9;
      utter.pitch = opts.pitch || 1.3;
      utter.volume = opts.volume || 1;
      
      const voices = synth.getVoices();
      const zhVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
      });
      if (zhVoice) utter.voice = zhVoice;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    function speakEn(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = opts.rate || 0.8;
      utter.pitch = opts.pitch || 1.2;
      utter.volume = opts.volume || 1;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('voice-settings-btn');
      const panel = document.getElementById('voice-settings-panel');
      const toggle = document.getElementById('voice-guide-toggle');
      const gestureToggle = document.getElementById('gesture-guide-toggle');
      const resetBtn = document.getElementById('reset-gesture-btn');
      
      updateBtnIcon();
      if (isVoiceGuideEnabled()) {
        if (toggle) toggle.classList.add('on');
      } else {
        if (toggle) toggle.classList.remove('on');
      }
      
      if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
        if (gestureToggle) gestureToggle.classList.add('on');
      } else {
        if (gestureToggle) gestureToggle.classList.remove('on');
      }
      
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (panel) panel.classList.toggle('show');
        });
      }
      
      document.addEventListener('click', function(e) {
        if (panel && !panel.contains(e.target) && e.target !== btn) {
          panel.classList.remove('show');
        }
      });
      
      if (toggle) {
        toggle.addEventListener('click', function() {
          const enabled = !isVoiceGuideEnabled();
          setVoiceGuideEnabled(enabled);
          if (enabled) {
            toggle.classList.add('on');
          } else {
            toggle.classList.remove('on');
          }
        });
      }
      
      if (gestureToggle) {
        gestureToggle.addEventListener('click', function() {
          const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
          localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
          if (!enabled) {
            gestureToggle.classList.add('on');
          } else {
            gestureToggle.classList.remove('on');
          }
          if (window.GestureGuide && window.GestureGuide.setEnabled) {
            window.GestureGuide.setEnabled(!enabled);
          }
        });
      }
      
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          try {
            localStorage.removeItem('starlight_gesture_seen');
            alert('手势演示已重置！刷新页面即可重新看到引导动画。');
          } catch(e) {}
        });
      }
      
      if (synth) {
        synth.getVoices();
        window.addEventListener('voiceschanged', function() {
          synth.getVoices();
        });
      }
    });
    
    window.VoiceGuide = {
      speak: speakGuide,
      speakEn: speakEn,
      stop: stopSpeak,
      isEnabled: isVoiceGuideEnabled
    };
  })();
  </script>


  <!-- ========== 小星星向导 ========== -->
  <div id="star-guide-container" class="star-guide-container">
    <div id="star-guide-balloon" class="star-guide-balloon"></div>
    <div id="star-guide" class="star-guide" title="小星星向导">⭐</div>
  </div>
  <script>
  // 小星星向导系统
  window.StarGuide = {
    container: null,
    star: null,
    balloon: null,
    currentStep: 0,
    idleTimer: null,
    idleTimeout: 3000,
    isFlying: false,
    targetGlow: null,
    
    shownSteps: [],
    // 每个页面的引导步骤配置
    steps: [],
    
    init: function(stepsConfig) {
      this.container = document.getElementById('star-guide-container');
      this.star = document.getElementById('star-guide');
      this.balloon = document.getElementById('star-guide-balloon');
      this.steps = stepsConfig || [];
      this.currentStep = 0;
      
      this.shownSteps = [];
      if (!this.container || !this.star || !this.balloon) return;
      
      var self = this;
      
      // 星星点击事件
      this.star.addEventListener('click', function() {
        self.showCurrentStep();
      });
      
      // 监听用户操作（重置空闲计时器）
      document.addEventListener('mousedown', function() { self.resetIdleTimer(); });
      document.addEventListener('touchstart', function() { self.resetIdleTimer(); });
      document.addEventListener('pointerdown', function() { self.resetIdleTimer(); });
      
      // 启动空闲检测
      this.startIdleTimer();
      
      // 页面加载完成后，延迟显示星星
      setTimeout(function() {
        self.container.classList.remove('hidden');
      }, 500);
    },
    
    startIdleTimer: function() {
      var self = this;
      this.idleTimer = setTimeout(function() {
        self.onIdle();
      }, this.idleTimeout);
    },
    
    resetIdleTimer: function() {
      if (this.idleTimer) {
        clearTimeout(this.idleTimer);
      }
      this.startIdleTimer();
      // 隐藏气球
      this.hideBalloon();
    },
    
    onIdle: function() {
      if (this.isFlying) return;
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      // 如果步骤需要等待某个条件，则检查
      if (step.condition && !step.condition()) {
        this.startIdleTimer();
        return;
      }

      // 如果本步骤已经展示过，跳过（避免语音重复覆盖教学）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) {
        this.startIdleTimer();
        return;
      }

      
      this.showCurrentStep();

    },
    
    showCurrentStep: function() {
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      var self = this;
      
      // 已展示过的步骤不再朗读（用户点星星时跳过）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) return;
      // 如果有目标元素，飞过去
      if (step.target) {
        var targetEl = typeof step.target === 'string' 
          ? document.querySelector(step.target) 
          : step.target;
        
        if (targetEl) {
          this.flyTo(targetEl, function() {
                        // 记录已展示的步骤，防止重复朗读
            var shownSteps = self.shownSteps || (self.shownSteps = []);
            if (shownSteps.indexOf(self.currentStep) === -1) {
              shownSteps.push(self.currentStep);
            }
            self.speak(step.speak || step.text || '看！那里有一个发光的圈圈，点一下试试！');
            self.showBalloon(step.text || '点一下试试！');
            self.highlightTarget(targetEl);
          });
        } else {
          // 找不到目标，直接显示提示
          this.speak(step.speak || step.text);
          this.showBalloon(step.text);
        }
      } else {
        // 没有目标，直接显示提示
        this.speak(step.speak || step.text);
        this.showBalloon(step.text);
      }
    },
    
    flyTo: function(targetEl, callback) {
      this.isFlying = true;
      
      var self = this;
      var starRect = this.star.getBoundingClientRect();
      var targetRect = targetEl.getBoundingClientRect();
      
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      var endX = targetRect.left + targetRect.width / 2;
      var endY = targetRect.top + targetRect.height / 2 - 40;
      
      // 创建飞行中的星星克隆体
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      // 隐藏原星星
      this.container.classList.add('hidden');
      
      // 飞行动画
      var duration = 800;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        // 缓动函数
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 动画结束，移除飞行星星，显示原星星在目标位置
          document.body.removeChild(flyingStar);
          
          // 将原星星移到目标位置
          self.container.style.position = 'fixed';
          self.container.style.left = (endX - 30) + 'px';
          self.container.style.top = (endY - 30) + 'px';
          self.container.style.right = 'auto';
          self.container.style.bottom = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
          if (callback) callback();
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    returnToCorner: function() {
      if (this.isFlying) return;
      
      var self = this;
      
      // 创建飞行中的星星克隆体
      var starRect = this.star.getBoundingClientRect();
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      
      var endX = window.innerWidth - 54;
      var endY = window.innerHeight - 54;
      
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      this.container.classList.add('hidden');
      this.isFlying = true;
      
      var duration = 600;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.removeChild(flyingStar);
          
          self.container.style.position = 'fixed';
          self.container.style.right = '24px';
          self.container.style.bottom = '24px';
          self.container.style.left = 'auto';
          self.container.style.top = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    showBalloon: function(text) {
      if (!this.balloon) return;
      this.balloon.textContent = text;
      this.balloon.classList.add('show');
      
      // 3秒后自动隐藏
      setTimeout(function() {
        this.hideBalloon();
      }.bind(this), 3500);
    },
    
    hideBalloon: function() {
      if (!this.balloon) return;
      this.balloon.classList.remove('show');
    },
    
    highlightTarget: function(targetEl) {
      // 移除旧的光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
      }
      
      var rect = targetEl.getBoundingClientRect();
      this.targetGlow = document.createElement('div');
      this.targetGlow.className = 'star-guide-target-glow';
      this.targetGlow.style.left = (rect.left - 8) + 'px';
      this.targetGlow.style.top = (rect.top - 8) + 'px';
      this.targetGlow.style.width = (rect.width + 16) + 'px';
      this.targetGlow.style.height = (rect.height + 16) + 'px';
      
      document.body.appendChild(this.targetGlow);
      
      // 3秒后移除光环
      setTimeout(function() {
        if (this.targetGlow && this.targetGlow.parentNode) {
          this.targetGlow.parentNode.removeChild(this.targetGlow);
          this.targetGlow = null;
        }
      }.bind(this), 3500);
    },
    
    speak: function(text) {
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak(text);
      }
    },
    
    nextStep: function() {
      // 清除目标光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      
      this.hideBalloon();
      this.currentStep++;
      
      // 返回角落
      setTimeout(function() {
        this.returnToCorner();
        
        // 重新启动空闲检测
        setTimeout(function() {
          this.startIdleTimer();
        }.bind(this), 1000);
      }.bind(this), 500);
    },
    
    reset: function() {
      this.currentStep = 0;
      this.returnToCorner();
      this.hideBalloon();
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      this.startIdleTimer();
    }
  };
  </script>
