    <style id="theme-vars">
:root {
  --brand-color-primary: #3742FA;
  --brand-color-primary-light: #5352ED;
  --brand-state-success: #00B894;
  --brand-state-warning: #FFC048;
  --brand-state-error: #FF4757;
  --brand-bay-deep: #005B66;
  --brand-bay-water: #00838F;
  --brand-bay-sand: #FDE5B4;
  --brand-bay-coral: #FF6B6B;
  --brand-bay-cyan: #4ECDC4;
  --brand-bay-pink: #FF9FF3;
  --brand-bay-orange: #FF9F43;
  --brand-starfish-orange: #FF7F50;
  --brand-starfish-coral: #FF6347;
  --brand-tide-blue: #1E90FF;
  --brand-tide-deep: #0B4F8A;
  --brand-shell-pink: #FFD1DC;
  --brand-rock-gray: #546E7A;
  --brand-font-display: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --brand-font-body: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
    
    /* === 语音引导设置面板 === */
    .voice-settings-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .voice-settings-btn:active { transform: scale(0.9); }
    .voice-settings-btn.muted { opacity: 0.5; }
    
    .voice-settings-panel {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 100px);
      right: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      z-index: 101;
      min-width: 200px;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      animation: panelIn 0.2s ease-out;
    }
    .voice-settings-panel.show { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .voice-settings-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .voice-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .voice-setting-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .voice-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .voice-toggle.on { background: #4ECDC4; }
    .voice-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
    }
    .voice-toggle.on::after { left: 22px; }

  
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    /* 点击手势 - 在目标位置脉冲 */
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim {
      animation: gestureTap 1.8s ease-in-out infinite;
    }
    /* 拖拽手势 - 从A拖到B */
    @keyframes gestureDragX {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      10% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      70% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); left: var(--drag-to); }
      80% { opacity: 0.8; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      90% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
    }
    /* 摩擦手势 - 两只手指来回搓 */
    @keyframes gestureRubLeft {
      0%, 100% { transform: translateX(-22px); }
      50% { transform: translateX(22px); }
    }
    @keyframes gestureRubRight {
      0%, 100% { transform: translateX(22px); }
      50% { transform: translateX(-22px); }
    }
    .gesture-rub-left {
      animation: gestureRubLeft 0.6s ease-in-out infinite;
    }
    .gesture-rub-right {
      animation: gestureRubRight 0.6s ease-in-out infinite;
    }
    /* 按住手势 - 手指按下不动 */
    @keyframes gesturePress {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
      20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }
    .gesture-press-anim {
      animation: gesturePress 2s ease-in-out infinite;
    }
    /* 点击涟漪效果 */
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim {
      animation: gestureRipple 1.8s ease-out infinite;
    }
    /* 滑动方向箭头 */
    @keyframes gestureSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(-40px); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    @keyframes gestureSlideLeft {
      0% { opacity: 0; transform: translateX(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }
      80% { opacity: 0.8; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }

  
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5));
      animation: starPulse 2s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .star-guide:hover {
      transform: scale(1.15);
    }
    .star-guide:active {
      transform: scale(0.95);
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7)); }
    }
    .star-guide-balloon {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      max-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s ease-out;
      pointer-events: none;
    }
    .star-guide-balloon.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .star-guide-balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 14px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.95);
      transform: rotate(45deg);
    }
    /* 飞行路径动画 */
    .star-guide-flying {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 44px;
      filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7));
    }
    @keyframes starFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 目标高亮光环 */
    .star-guide-target-glow {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #F2C94C;
      animation: targetGlow 1.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9997;
    }
    @keyframes targetGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

<body class="m-0 p-0 overflow-hidden min-h-screen no-select" style="background: #1a5f7a; font-family: var(--brand-font-body); overscroll-behavior: none; -webkit-tap-highlight-color: transparent;">

  <!-- ========== BACK BUTTON ========== -->
  <button data-dom-id="btn-back-to-map"
          class="fixed z-[60] inline-flex items-center justify-center"
          style="top: calc(env(safe-area-inset-top, 0px) + 56px); left: 12px; width: 40px; height: 40px; min-width: 40px; min-height: 40px; border-radius: 50%; background: rgba(0,91,102,0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(78,205,196,0.3); color: #E0F7FA;"
          aria-label="返回泡泡湾">
    <i data-lucide="arrow-left" class="w-5 h-5"></i>
  </button>

  <!-- ========== TOP STATUS BAR ========== -->
  <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4"
          style="min-height: 48px; padding-top: env(safe-area-inset-top, 0px); background: rgba(0,91,102,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(78,205,196,0.2);">
    <div class="flex items-center gap-2">
      <div id="player-av" class="w-7 h-7 rounded-full flex items-center justify-center text-sm shrink-0"
           style="background: rgba(255,127,80,0.2); border: 1.5px solid rgba(255,127,80,0.4);">🧒</div>
      <span id="player-nm" class="text-white font-bold whitespace-nowrap" style="font-size: 12px; font-family: var(--font-body); text-shadow: 0 1px 3px rgba(0,0,0,0.3); max-width: 60px; overflow: hidden; text-overflow: ellipsis;">小探险家</span>
      <span class="text-white/40 text-xs">|</span>
      <span id="top-friend-count" class="text-xs font-semibold whitespace-nowrap" style="color: #FFFFFF;">朋友 2/10</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="text-sm font-bold whitespace-nowrap" style="color: #FFFFFF; text-shadow: 0 0 10px rgba(255,127,80,0.5);">⭐ 海星</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="text-base star-gem-empty">☆</span>
      <span class="text-base star-gem-empty">☆</span>
      <span class="text-base star-gem-empty">☆</span>
    </div>
  </header>

  <!-- ========== HINT BANNER ========== -->
  <div id="hint-banner" class="fixed z-40 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-500"
       style="top: calc(env(safe-area-inset-top, 0px) + 56px); background: rgba(0,91,102,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,192,72,0.5); color: #FFC048; text-shadow: 0 0 8px rgba(255,192,72,0.5); box-shadow: 0 0 20px rgba(255,192,72,0.2);">
    <span id="hint-text">潮汐池里闪闪发亮的贝壳~点一下看看？</span>
  </div>

  <!-- ========== MAIN SCENE ========== -->
  <main class="relative w-full h-screen overflow-hidden">
    <!-- Image background -->
    <div class="scene-bg"></div>

    <!-- Sky gradient (hidden - using image) -->
    <div class="sky-gradient absolute inset-0" style="background: linear-gradient(180deg,
      #87CEEB 0%,
      #B3E5FC 20%,
      #E0F7FA 35%,
      #4ECDC4 55%,
      #00838F 75%,
      #005B66 100%);
    "></div>

    <!-- Sunlight rays (hidden) -->
    <div class="sunlight-rays absolute inset-0 pointer-events-none" style="background:
      linear-gradient(135deg, rgba(255,243,196,0.25) 0%, transparent 40%),
      radial-gradient(ellipse at 30% 10%, rgba(255,243,196,0.3) 0%, transparent 50%);
    "></div>

    <!-- Far rocks in background (hidden) -->
    <div class="far-rocks absolute pointer-events-none" style="top: 25%; left: 0; right: 0; height: 15%;">
      <div style="position: absolute; left: 5%; bottom: 0; width: 30%; height: 100%; background: linear-gradient(180deg, #546E7A, #37474F); border-radius: 50% 50% 0 0 / 80% 80% 0 0; opacity: 0.6;"></div>
      <div style="position: absolute; right: 0%; bottom: 0; width: 40%; height: 120%; background: linear-gradient(180deg, #455A64, #263238); border-radius: 60% 40% 0 0 / 90% 70% 0 0; opacity: 0.7;"></div>
    </div>

    <!-- Water surface with gentle waves (hidden decorative parts only) -->
    <div id="water-surface" class="absolute pointer-events-none" style="left: 0; right: 0; top: 40%; bottom: 0; transition: top 0.3s; opacity: 0;">
      <!-- Water body -->
      <div class="water-css-decor absolute inset-0" style="background: linear-gradient(180deg,
        rgba(30,144,255,0.5) 0%,
        rgba(0,131,143,0.7) 30%,
        rgba(0,91,102,0.9) 100%);
      "></div>
      <!-- Wave edge at top of water -->
      <div class="absolute w-full" style="top: -8px; height: 16px;">
        <svg viewBox="0 0 400 20" preserveAspectRatio="none" style="width:100%; height:100%;">
          <path d="M0,10 Q25,0 50,10 T100,10 T150,10 T200,10 T250,10 T300,10 T350,10 T400,10 V20 H0 Z" fill="rgba(30,144,255,0.5)"/>
        </svg>
      </div>
      <!-- Caustic light patterns -->
      <div class="absolute inset-0" style="background:
        radial-gradient(ellipse 200px 100px at 30% 20%, rgba(255,255,255,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 150px 80px at 70% 40%, rgba(255,255,255,0.1) 0%, transparent 70%),
        radial-gradient(ellipse 180px 90px at 50% 70%, rgba(255,255,255,0.12) 0%, transparent 70%);
      "></div>
      <!-- Bubbles rising -->
      <div class="absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="bubble" style="left: 20%; --bd:0s; --bs:8px;"></div>
        <div class="bubble" style="left: 40%; --bd:2s; --bs:6px;"></div>
        <div class="bubble" style="left: 60%; --bd:1s; --bs:10px;"></div>
        <div class="bubble" style="left: 75%; --bd:3s; --bs:5px;"></div>
        <div class="bubble" style="left: 85%; --bd:1.5s; --bs:7px;"></div>
      </div>
    </div>

    <!-- Tide pool sand/rocky bottom (hidden - using image background) -->
    <div class="sand-css-decor absolute pointer-events-none" style="left: 0; right: 0; bottom: 0; height: 40%;">
      <!-- Sand -->
      <div class="absolute inset-0" style="background: linear-gradient(180deg, #FDE5B4 0%, #F5D08A 50%, #E0B870 100%);"></div>
      <!-- Sand texture dots -->
      <div class="absolute inset-0" style="opacity:0.3; background-image: radial-gradient(circle, #8B6914 1px, transparent 1px); background-size: 8px 8px;"></div>
      <!-- Rocks scattered -->
      <div style="position: absolute; right: 5%; bottom: 30%; width: 60px; height: 40px; background: linear-gradient(135deg, #78909C, #455A64); border-radius: 40% 60% 50% 50%; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.3);"></div>
      <div style="position: absolute; left: 60%; bottom: 15%; width: 40px; height: 28px; background: linear-gradient(135deg, #607D8B, #37474F); border-radius: 50% 40% 60% 50%; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.3);"></div>
      <!-- Seaweed on right -->
      <div class="seaweed" style="right: 8%; bottom: 35%; --sw-h: 80px; --sw-c: #2E7D32;"></div>
      <div class="seaweed" style="right: 12%; bottom: 32%; --sw-h: 60px; --sw-c: #388E3C;"></div>
    </div>

    <!-- ===== BIG ROCK (left side, hides starfish) - positioned over rock area in background image ===== -->
    <div id="big-rock" class="absolute z-10" style="left: 3%; bottom: 25%; pointer-events: none; transition: bottom 0.3s ease-out, transform 0.3s; opacity: 0.85;">
      <div style="position: relative; width: 150px; height: 120px; transform: scale(0.85);">
        <!-- Main rock body -->
        <div style="position: absolute; inset: 0; background: linear-gradient(145deg, #78909C 0%, #546E7A 30%, #37474F 70%, #263238 100%); border-radius: 45% 55% 40% 60% / 50% 45% 55% 50%; box-shadow: inset -6px -8px 16px rgba(0,0,0,0.4), inset 4px 4px 12px rgba(255,255,255,0.1), 6px 8px 20px rgba(0,0,0,0.5);"></div>
        <!-- Rock bumps -->
        <div style="position: absolute; top: 10%; left: 15%; width: 40px; height: 30px; background: linear-gradient(145deg, #90A4AE, #607D8B); border-radius: 50%; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.3);"></div>
        <div style="position: absolute; top: 30%; right: 10%; width: 30px; height: 22px; background: linear-gradient(145deg, #78909C, #455A64); border-radius: 50%; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3);"></div>
        <!-- Moss patches -->
        <div style="position: absolute; top: 5%; left: 30%; width: 50px; height: 18px; background: radial-gradient(ellipse, rgba(76,175,80,0.6), transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 15%; left: 10%; width: 40px; height: 14px; background: radial-gradient(ellipse, rgba(102,187,106,0.5), transparent 70%); border-radius: 50%;"></div>
        <!-- Barnacles -->
        <div style="position: absolute; top: 25%; left: 50%; width: 12px; height: 10px; background: #FFF8E1; border-radius: 50% 50% 40% 40%; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.2);"></div>
        <div style="position: absolute; top: 50%; left: 60%; width: 8px; height: 7px; background: #FFF9C4; border-radius: 50% 50% 40% 40%;"></div>
        <!-- Small shell stuck on rock -->
        <div style="position: absolute; bottom: 20%; right: 15%; font-size: 18px; transform: rotate(-20deg); filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.3));">🐚</div>
      </div>
    </div>

    <!-- ===== STARFISH (hidden under rock initially) - positioned under rock in background image ===== -->
    <div id="starfish-container" class="absolute z-[5]" style="left: 6%; bottom: 27%; pointer-events: none; opacity: 0; transform: scale(0.5); transition: opacity 0.6s, transform 0.6s;">
      <div id="starfish-body" style="font-size: 90px; line-height: 1; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.4));">⭐</div>
      <!-- Number side (hidden initially, revealed after rock floats) -->
      <div id="starfish-numbers" class="absolute" style="top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; pointer-events: auto;">

  <!-- ========== AUDIO & SPEECH ========== -->
  <script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, dur=0.3, type='sine', vol=0.12) {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function playChime(freq) { playTone(freq, 0.3, 'sine', 0.08); }
  function playSuccess() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playChime(f),i*120)); }
  function playSparkle() { [1200,1600,2000,2400].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'sine',0.06),i*50)); }
  function playPop() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(600, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime+0.15);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.2);
  }
  function playWaterDrop() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(800, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime+0.2);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.25);
  }
  function playRumble() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(60, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(100, audioCtx.currentTime+0.8);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.9);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.9);
  }
  function playFloat() {
    [400, 500, 600, 800].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'sine',0.06),i*80));
  }
  function speak(text, lang='en-US', rate=0.8) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }
  }
  function playNumberTone(num) {
    const freqs = {1: [523,659], 2: [659,784], 3: [784,1047]};
    (freqs[num] || [523,659]).forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'triangle',0.1),i*100));
  }
  </script>

  <!-- ========== SHARED NAVIGATION & PROGRESS HELPERS ========== -->
  <script>
  const ISLAND_ID = 'bubbleBay';
  const ISLAND_PAGE = 'bubble-bay-v2.html';
  const WORLD_MAP = 'world-map-v2.html';
  const WORLD_MAP_PAGE = 'world-map-v2.html';
  const TOTAL_ANIMALS = 4;
  const ANIMAL_ID = 'starfish';
  const ISLAND_ANIMALS = ['starfish', 'clownfish', 'octopus', 'turtle'];

  function getCurrentPlayerId() {
    try {
      const raw = localStorage.getItem('starCarnivalDB');
      if (raw) {
        const db = JSON.parse(raw);
        if (db.currentPlayerId) return db.currentPlayerId;
      }
    } catch(e){}
    return localStorage.getItem('currentPlayerId');
  }

  function getProgress() {
    const cid = getCurrentPlayerId();
    if (!cid) return null;
    const key = 'starCarnival_progress_' + cid;
    let prog = {};
    try { prog = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => {
      if (!prog[id]) prog[id] = { completed: [], gemEarned: false };
      if (!prog[id].completed) prog[id].completed = [];
    });
    if (typeof prog.gems !== 'number') prog.gems = 0;
    if (!prog.unlocked) prog.unlocked = ['echoValley'];
    return prog;
  }

  function saveProgress(prog) {
    const cid = getCurrentPlayerId();
    if (!cid) return;
    localStorage.setItem('starCarnival_progress_' + cid, JSON.stringify(prog));
  }

  function markAnimalCompleted() {
    const prog = getProgress();
    if (!prog) return;
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
      prog[ISLAND_ID].completed.push(ANIMAL_ID);
    }
    let g = 0;
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
    prog.gems = g;
    saveProgress(prog);
  }

  function navigateAfterRescue() {
    const prog = getProgress();
    if (!prog) {
      document.body.style.transition = 'opacity 0.3s';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = ISLAND_PAGE; }, 300);
      return;
    }
    if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
      prog[ISLAND_ID].completed.push(ANIMAL_ID);
    }
    let g = 0;
    ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
    prog.gems = g;
    saveProgress(prog);
    const allDone = ISLAND_ANIMALS.every(a => prog[ISLAND_ID].completed.includes(a));
    document.body.style.transition = 'opacity 0.3s';
    document.body.style.opacity = '0';
    setTimeout(() => {
      window.location.href = allDone ? (WORLD_MAP_PAGE + '?islandComplete=' + ISLAND_ID) : ISLAND_PAGE;
    }, 300);
  }

  function navigateBack() {
    document.body.style.transition = 'opacity 0.25s';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = ISLAND_PAGE; }, 250);
  }

  // Wire back button
  document.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.querySelector('[data-dom-id="btn-back-to-map"]');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        navigateBack();
      });
    }
  });
  </script>

  <!-- ========== INTERACTION STATE MACHINE ========== -->
  <script>
  let stage = 'shell-click'; // shell-click -> rumble -> slider -> floating -> numbers -> complete
  const TARGET_WATER_PCT = 0.85; // need to fill to 85%
  let waterLevel = 0;      // actual displayed level (0-1), with damping
  let targetLevel = 0;     // where the slider is set
  let isDraggingSlider = false;
  let sliderStartY = 0;
  let sliderStartPct = 0;
  let dampingRafId = null;

  const shellString = document.getElementById('shell-string');
  const bigRock = document.getElementById('big-rock');
  const starfishContainer = document.getElementById('starfish-container');
  const starfishBody = document.getElementById('starfish-body');
  const starfishNumbers = document.getElementById('starfish-numbers');
  const tideRuler = document.getElementById('tide-ruler');
  const waterLine = document.getElementById('water-line');
  const waterSurface = document.getElementById('water-surface');
  const sliderWrap = document.getElementById('slider-wrap');
  const sliderThumb = document.getElementById('slider-thumb');
  const sliderFill = document.getElementById('slider-fill');
  const sliderWave = document.getElementById('slider-wave');
  const sliderHint = document.getElementById('slider-hint');
  const sliderHitArea = document.getElementById('slider-hitarea');
  const successOverlay = document.getElementById('success-overlay');
  const starfishSlot = document.getElementById('starfish-slot');
  const friendCount = document.getElementById('friend-count');
  const hintText = document.getElementById('hint-text');

  const SLIDER_TRACK_HEIGHT = 300;

  function setHint(text) {
    hintText.textContent = text;
    if (window.VoiceGuide && window.VoiceGuide.isEnabled && window.VoiceGuide.isEnabled()) {
      clearTimeout(window.voiceGuide_hintTimer);
      window.voiceGuide_hintTimer = setTimeout(function() {
        window.VoiceGuide.speak(text);
      }, 300);
    }
  }

  // ===== STAGE 1: Click shell string to trigger rumble =====
  shellString.addEventListener('click', () => {
    if (stage !== 'shell-click') return;
    stage = 'rumble';
    ensureAudio();
    playPop();
    playSparkle();

    // Shell string fades
    shellString.style.transition = 'opacity 0.5s, transform 0.5s';
    shellString.style.opacity = '0';
    shellString.style.transform = 'scale(0.5)';
    shellString.style.pointerEvents = 'none';
    // Also hide all children
    shellString.querySelectorAll('div, span').forEach(child => {
      child.style.transition = 'opacity 0.3s';
      child.style.opacity = '0';
    });

    setHint('轰隆隆...石头在震动！');

    // Rock shakes (rumble animation)
    bigRock.style.animation = 'rockShake 0.3s ease-in-out 3';
    playRumble();

    setTimeout(() => {
      bigRock.style.animation = '';
      // Show tide ruler
      tideRuler.style.opacity = '1';
      tideRuler.style.transform = 'scaleX(1)';
      playChime(600);
      setHint('哇！发现了一个水位刻度尺！');

      setTimeout(() => {
        stage = 'slider';
        // Show slider
        sliderWrap.style.transform = 'translate(-50%, -50%) scale(1)';
        sliderWrap.style.pointerEvents = 'auto';
        setHint('向上拖动滑块，让潮水涨起来~');
        startDampingLoop();
      }, 300);
    }, 1000);
  });

  // ===== STAGE 2: Slider drag with damping =====
  function getEventY(e) {
    if (e.touches && e.touches[0]) return e.touches[0].clientY;
    return e.clientY;
  }

  function onSliderStart(e) {
    if (stage !== 'slider' && stage !== 'floating') return;
    e.preventDefault();
    isDraggingSlider = true;
    const currentY = getEventY(e);
    // Get track bounding rect to calculate direct jump position
    const trackRect = document.getElementById('slider-track').getBoundingClientRect();
    // If touch is on the track area (not just thumb), jump directly to that position
    const relY = currentY - trackRect.top;
    const pct = 1 - Math.max(0, Math.min(1, relY / trackRect.height));
    targetLevel = pct;
    sliderStartY = currentY;
    sliderStartPct = targetLevel;
    updateSliderVisuals(targetLevel);
    sliderHitArea.style.cursor = 'grabbing';
    sliderThumb.style.boxShadow = '0 8px 28px rgba(0,131,143,0.7), inset 0 -4px 8px rgba(0,0,0,0.2)';
  }

  function onSliderMove(e) {
    if (!isDraggingSlider) return;
    e.preventDefault();
    const currentY = getEventY(e);
    const dy = sliderStartY - currentY; // positive = moved up
    const deltaPct = dy / SLIDER_TRACK_HEIGHT;
    let newPct = sliderStartPct + deltaPct;
    newPct = Math.max(0, Math.min(1, newPct));
    targetLevel = newPct;
    updateSliderVisuals(newPct);
  }

  function onSliderEnd() {
    if (!isDraggingSlider) return;
    isDraggingSlider = false;
    sliderHitArea.style.cursor = 'grab';
    sliderThumb.style.boxShadow = '0 6px 20px rgba(0,131,143,0.5), inset 0 -4px 8px rgba(0,0,0,0.2)';
  }

  function updateSliderVisuals(pct) {
    const topPct = (1 - pct) * 100;
    sliderThumb.style.bottom = (pct * 100) + '%';
    sliderFill.style.height = (pct * 100) + '%';
    sliderWave.style.bottom = (pct * 100) + '%';
    // Hide hint as slider moves up
    if (pct > 0.1) {
      sliderHint.style.opacity = Math.max(0, 1 - pct * 2);
    }
    // Update ruler water line
    const rulerTop = 100 - (pct * 100);
    waterLine.style.top = rulerTop + '%';
  }

  function startDampingLoop() {
    if (dampingRafId) cancelAnimationFrame(dampingRafId);
    function damp() {
      // Ease water level toward target (damping effect)
      waterLevel += (targetLevel - waterLevel) * 0.08;
      if (Math.abs(waterLevel - targetLevel) < 0.001) waterLevel = targetLevel;

      // Move water surface up as water level rises
      // Water top moves from 40% (initial) down to ~15% (higher water)
      const waterTop = 40 - waterLevel * 25;
      waterSurface.style.top = waterTop + '%';

      // Rock floats up with water level
      const rockBottom = 22 + waterLevel * 18; // rises from 22% to 40%
      bigRock.style.bottom = rockBottom + '%';

      // Occasional water drop sound
      if (isDraggingSlider && Math.random() < 0.05) playWaterDrop();

      // Check if target reached
      if (waterLevel >= TARGET_WATER_PCT - 0.02 && stage === 'slider') {
        stage = 'floating';
        onWaterFull();
        // Keep damping going so water fills smoothly to 100%
      }

      // Stop damping once water fully rises to target (1)
      if (stage === 'floating' && waterLevel >= 0.99) {
        cancelAnimationFrame(dampingRafId);
        dampingRafId = null;
        return;
      }

      dampingRafId = requestAnimationFrame(damp);
    }
    damp();
  }

  function onWaterFull() {
    setHint('潮水涨起来啦！石头浮起来了！');
    // Smoothly complete water fill
    targetLevel = 1;
    playFloat();
    playSuccess();

    // Rock floats all the way up and tips slightly
    bigRock.style.transition = 'bottom 1s ease-out, transform 1s ease-out, opacity 0.8s';
    bigRock.style.bottom = '55%';
    bigRock.style.transform = 'rotate(15deg) translateX(30px)';

    setTimeout(() => {
      // Reveal starfish
      starfishContainer.style.opacity = '1';
      starfishContainer.style.transform = 'scale(1)';
      starfishContainer.style.pointerEvents = 'auto';
      playSparkle();
      setHint('找到小海星啦！点一下翻过来~');

      // Hide slider
      sliderWrap.style.transform = 'translate(-50%, -50%) scale(0)';
      sliderWrap.style.pointerEvents = 'none';
      tideRuler.style.opacity = '0';

      // Click starfish to flip
      starfishBody.style.cursor = 'pointer';
      starfishBody.style.pointerEvents = 'auto';
      starfishBody.addEventListener('click', flipStarfish, { once: false });
    }, 300);
  }

  function flipStarfish() {
    stage = 'numbers';
    // Flip animation
    starfishBody.style.transition = 'transform 0.6s';
    starfishBody.style.transform = 'rotateY(180deg)';
    playPop();

    setTimeout(() => {
      // Replace star with number-side
      starfishBody.style.display = 'none';
      starfishNumbers.style.display = 'block';
      // Show spin animation
      starfishContainer.style.animation = 'starfishSpin 2s ease-in-out 1';
      setHint('按顺序点数字 1 → 2 → 3！');
      playChime(800);
    }, 300);
  }

  // ===== STAGE 3: Click numbers 1-2-3 in order =====
  let currentNum = 1;
  const numWords = {1: 'One!', 2: 'Two!', 3: 'Three!'};
  document.querySelectorAll('.num-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (stage !== 'numbers') return;
      const num = parseInt(btn.dataset.numValue);
      if (num !== currentNum) {
        // Wrong order - shake button
        btn.style.animation = 'btnShake 0.3s ease-in-out';
        playBuzz();
        setTimeout(() => { btn.style.animation = ''; }, 300);
        return;
      }
      // Correct!
      btn.style.background = 'linear-gradient(145deg, #FFF, #F0F0F0)';
      btn.style.color = '#005B66';
      btn.style.transform = btn.style.transform + ' scale(1.2)';
      btn.style.boxShadow = '0 0 24px rgba(255,255,255,0.8)';
      btn.style.pointerEvents = 'none';
      speak(numWords[num], 'en-US', 0.7);
      playNumberTone(num);

      // Little starfish spin hop
      starfishContainer.style.animation = 'none';
      void starfishContainer.offsetWidth;
      starfishContainer.style.animation = `starfishHop 0.4s ease-out`;

      currentNum++;
      if (currentNum > 3) {
        setTimeout(() => onAllNumbersComplete(), 500);
      } else {
        setTimeout(() => {
          setHint(`真棒！下一个数字 ${currentNum}`);
        }, 1200);
      }
    });
  });

  function playBuzz() {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(200, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(150, audioCtx.currentTime+0.15);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.2);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.2);
  }

  function onAllNumbersComplete() {
    stage = 'complete';
    setHint('海星转圈圈啦！');
    playSuccess();

    // Big spin
    starfishContainer.style.animation = 'starfishVictorySpin 1.5s ease-in-out';

    setTimeout(() => {
      showSuccess();
      spawnConfetti();
    }, 1200);
  }

  function showSuccess() {
    // Fill starfish slot
    starfishSlot.style.background = 'rgba(78,205,196,0.15)';
    starfishSlot.style.border = '2px solid rgba(78,205,196,0.5)';
    starfishSlot.style.boxShadow = '0 0 16px rgba(78,205,196,0.4)';
    const slotSpan = starfishSlot.querySelector('span');
    slotSpan.style.opacity = '1';
    slotSpan.style.filter = 'drop-shadow(0 0 8px rgba(78,205,196,0.8))';

    // Friend count
    const topFriendCount = document.getElementById('top-friend-count');
    if (topFriendCount) topFriendCount.textContent = '朋友 3/10';
    friendCount.textContent = '朋友 3/10';

    // Fill a star
    const emptyStars = document.querySelectorAll('.star-gem-empty');
    if (emptyStars[0]) {
      emptyStars[0].textContent = '★';
      emptyStars[0].style.color = '#4ECDC4';
      emptyStars[0].className = 'star-gem-filled';
      emptyStars[0].style.textShadow = '0 0 8px rgba(78,205,196,0.8), 0 0 16px rgba(78,205,196,0.5)';
    }

    successOverlay.style.opacity = '1';
    // STARLIGHT_SUCCESS_FEEDBACK
    setTimeout(function() {
      if (window.VoiceGuide) {
        window.VoiceGuide.speak("太棒了！你成功拯救了海星！继续探索下一个小伙伴吧！");
      }
      setTimeout(function() {
        var btn = document.getElementById('btn-continue-adventure');
        if (btn && window.GestureGuide) {
          window.GestureGuide.showTap(btn, { id: 'bubble-bay-v3_continue', duration: 4000, once: false });
        }
      }, 1500);
    }, 500);
    successOverlay.style.pointerEvents = 'auto';

    // Wire continue button (once)
    const continueBtn = document.getElementById('btn-continue-adventure');
    if (continueBtn && !continueBtn._wired) {
      continueBtn._wired = true;
      continueBtn.addEventListener('click', () => {
        continueBtn.style.transform = 'scale(0.95)';
        setTimeout(() => navigateAfterRescue(), 120);
      });
      continueBtn.addEventListener('touchstart', () => {
        continueBtn.style.transform = 'scale(0.95)';
      }, { passive: true });
    }
  }

  // Attach slider listeners to entire hit area (not just thumb)
  sliderHitArea.addEventListener('mousedown', onSliderStart);
  sliderHitArea.addEventListener('touchstart', onSliderStart, { passive: false });
  document.addEventListener('mousemove', onSliderMove);
  document.addEventListener('touchmove', onSliderMove, { passive: false });
  document.addEventListener('mouseup', onSliderEnd);
  document.addEventListener('touchend', onSliderEnd);
  document.addEventListener('touchcancel', onSliderEnd);

  // Confetti
  function spawnConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#FFC048', '#4ECDC4', '#FF6B6B', '#FF9FF3', '#1E90FF', '#FF9F43'];
    const emojis = ['💧', '⭐', '🐚', '✨', '💦', '🌟'];
    for (let i = 0; i < 35; i++) {
      const c = document.createElement('div');
      const isEmoji = Math.random() > 0.4;
      c.style.cssText = `position: fixed; left: ${Math.random()*100}%; top: -30px; font-size: ${isEmoji ? 18+Math.random()*14 : 8+Math.random()*8}px; ${isEmoji ? '' : 'width:'+ (6+Math.random()*8) + 'px;height:' + (6+Math.random()*8) + 'px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';border-radius:' + (Math.random()>0.5?'50%':'3px') + ';'}; pointer-events: none; z-index: 50;`;
      c.textContent = isEmoji ? emojis[Math.floor(Math.random()*emojis.length)] : '';
      container.appendChild(c);
      const dur = 2 + Math.random()*2.5;
      const xDrift = (Math.random()-0.5)*250;
      c.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${xDrift}px, 100vh) rotate(${Math.random()*720}deg)`, opacity: 0 }
      ], { duration: dur*1000, easing: 'cubic-bezier(0.25,0.46,0.45,0.94)' });
      setTimeout(() => c.remove(), dur*1000);
    }
  }
  </script>

  <script>
  // 引导手势动画系统
  window.GestureGuide = {
    STORAGE_KEY: 'starlight_gesture_seen',
    
    
    GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
    
    _enabled: true,
    
    // 检查手势指引是否启用
    isEnabled: function() {
      const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
      return v !== 'false';
    },
    
    // 设置手势指引启用状态
    setEnabled: function(enabled) {
      this._enabled = enabled;
      localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
    },
    
    // 检查是否已经看过某个手势
    hasSeen: function(id) { {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        return seen[id] === true;
      } catch(e) { return false; }
    },
    
    // 标记已看过
    markSeen: function(id) {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        seen[id] = true;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
      } catch(e) {}
    },
    
    // 移除手势
    remove: function(overlay) {
      if (overlay && overlay.parentNode) {
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.3s';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    },
    
    // === 点击手势 ===
    showTap: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'tap_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 手指 emoji
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-tap-anim';
      hand.textContent = '👆';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      // 涟漪
      var ripple = document.createElement('div');
      ripple.className = 'gesture-ripple gesture-ripple-anim';
      ripple.style.left = (rect.left + rect.width / 2) + 'px';
      ripple.style.top = (rect.top + rect.height / 2) + 'px';
      overlay.appendChild(ripple);
      
      document.body.appendChild(overlay);
      
      var self = this;
      var timer = setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      overlay._timer = timer;
      return overlay;
    },
    
    // === 拖拽手势 ===
    showDrag: function(fromEl, toEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'drag_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 4000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var fromRect = fromEl.getBoundingClientRect();
      var toRect = toEl.getBoundingClientRect();
      
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand';
      hand.textContent = '👆';
      hand.style.fontSize = opts.size || '72px';
      hand.style.position = 'absolute';
      hand.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      hand.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      hand.style.opacity = '0';
      hand.style.transform = 'translate(-50%,-50%)';
      hand.style.transition = 'none';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      // 动画序列：出现→拖到目标→放下→消失
      var steps = [
        { t: 0,    opacity: 0,   x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1.3 },
        { t: 300,  opacity: 1, x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1 },
        { t: 1800, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 2200, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 0.85 },
        { t: 2500, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 3000, opacity: 0,   x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
      ];
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        // 找到当前所在的两个关键帧
        var prev = steps[0], next = steps[steps.length - 1];
        for (var i = 0; i < steps.length - 1; i++) {
          if (elapsed >= steps[i].t && elapsed < steps[i+1].t) {
            prev = steps[i]; next = steps[i+1]; break;
          }
        }
        if (elapsed >= steps[steps.length-1].t) {
          prev = next = steps[steps.length-1];
        }
        
        var progress = (next.t === prev.t) ? 1 : (elapsed - prev.t) / (next.t - prev.t);
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = prev.x + (next.x - prev.x) * ease;
        var curY = prev.y + (next.y - prev.y) * ease;
        var curOp = prev.opacity + (next.opacity - prev.opacity) * ease;
        var curScale = prev.scale + (next.scale - prev.scale) * ease;
        
        hand.style.left = curX + 'px';
        hand.style.top = curY + 'px';
        hand.style.opacity = curOp;
        hand.style.transform = 'translate(-50%,-50%) scale(' + curScale + ')';
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 双指摩擦手势 ===
    showRub: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'rub_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3500;
      var cycles = opts.cycles || 3;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 左手
      var handL = document.createElement('div');
      handL.className = 'gesture-hand';
      handL.textContent = '👆';
      handL.style.fontSize = '64px';
      handL.style.position = 'absolute';
      handL.style.top = (rect.top + rect.height / 2 - 10) + 'px';
      handL.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      handL.style.opacity = '0.9';
      handL.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handL);
      
      // 右手
      var handR = document.createElement('div');
      handR.className = 'gesture-hand';
      handR.textContent = '👆';
      handR.style.fontSize = '64px';
      handR.style.position = 'absolute';
      handR.style.top = (rect.top + rect.height / 2 + 10) + 'px';
      handR.style.left = (rect.left + rect.width / 2 + 20) + 'px';
      handR.style.opacity = '0.9';
      handR.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handR);
      
      document.body.appendChild(overlay);
      
      // 来回搓动
      var rubDuration = 600; // 每次来回 600ms
      var totalRubTime = rubDuration * cycles;
      var startTime = null;
      var fadeStart = totalRubTime + 500;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        if (elapsed < totalRubTime) {
          // 搓动阶段
          var phase = (elapsed % rubDuration) / rubDuration;
          var offset = Math.sin(phase * Math.PI * 2) * 26;
          handL.style.transform = 'translate(calc(-50% + ' + (-offset) + 'px), -50%)';
          handR.style.transform = 'translate(calc(-50% + ' + offset + 'px), -50%)';
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else if (elapsed < fadeStart) {
          // 搓完停留
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else {
          // 淡出
          var fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          var fadeOp = Math.max(0, 0.65 * (1 - fadeProgress));
          handL.style.opacity = fadeOp;
          handR.style.opacity = fadeOp;
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 按住手势 ===
    showPress: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'press_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-press-anim';
      hand.textContent = '👇';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      var self = this;
      setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      return overlay;
    },
    
    // === 喊叫手势 ===
    showShout: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'shout_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 嘴巴 emoji 靠近麦克风
      var mouth = document.createElement('div');
      mouth.className = 'gesture-hand';
      mouth.textContent = '📢';
      mouth.style.left = (rect.left + rect.width / 2) + 'px';
      mouth.style.top = (rect.top - 40) + 'px';
      mouth.style.fontSize = '64px';
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(mouth);
      
      // 声波效果
      for (var i = 1; i <= 3; i++) {
        var wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = (rect.left + rect.width / 2) + 'px';
        wave.style.top = (rect.top - 20) + 'px';
        wave.style.width = (20 + i * 15) + 'px';
        wave.style.height = (20 + i * 15) + 'px';
        wave.style.borderRadius = '50%';
        wave.style.border = '2px solid rgba(242,201,76,0.4)';
        wave.style.opacity = '0';
        wave.style.transform = 'translate(-50%,-50%)';
        wave.style.pointerEvents = 'none';
        wave._delay = i * 200;
        wave._index = i;
        overlay.appendChild(wave);
      }
      
      document.body.appendChild(overlay);
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = elapsed / duration;
        
        // 嘴巴淡入淡出
        if (progress < 0.15) {
          mouth.style.opacity = (progress / 0.15) * 0.7;
        } else if (progress < 0.8) {
          mouth.style.opacity = '1';
        } else {
          mouth.style.opacity = Math.max(0, 0.7 * (1 - (progress - 0.8) / 0.2));
        }
        
        // 声波扩散
        var children = overlay.children;
        for (var i = 1; i < children.length; i++) {
          var w = children[i];
          if (!w._delay) continue;
          var wElapsed = elapsed - w._delay;
          if (wElapsed > 0 && wElapsed < 1500) {
            var wProgress = (wElapsed % 800) / 800;
            w.style.opacity = Math.max(0, 0.4 * (1 - wProgress));
            var wScale = 1 + wProgress * 1.5;
            w.style.transform = 'translate(-50%,-50%) scale(' + wScale + ')';
          } else {
            w.style.opacity = '0';
          }
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    }
  };
  </script>

      <button id="reset-gesture-btn" style="background: rgba(255,200,60,0.3); border: 1px solid rgba(255,200,60,0.5); color: #FFC048; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">重置</button>
    </div>

  <script>
  (function() {
    const STORAGE_KEY = 'starlight_voice_guide';
    const synth = window.speechSynthesis;
    
    function isVoiceGuideEnabled() {
      const v = localStorage.getItem(STORAGE_KEY);
      return v !== 'false';
    }
    
    function setVoiceGuideEnabled(enabled) {
      localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
      updateBtnIcon();
      if (enabled) {
        speakGuide('语音引导已开启');
      }
    }
    
    function updateBtnIcon() {
      const btn = document.getElementById('voice-settings-btn');
      if (!btn) return;
      if (isVoiceGuideEnabled()) {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }
    
    let currentUtterance = null;
    
    function stopSpeak() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      currentUtterance = null;
    }
    
    function speakGuide(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      if (!text || !text.trim()) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = opts.rate || 0.9;
      utter.pitch = opts.pitch || 1.3;
      utter.volume = opts.volume || 1;
      
      const voices = synth.getVoices();
      const zhVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
      });
      if (zhVoice) utter.voice = zhVoice;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    function speakEn(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = opts.rate || 0.8;
      utter.pitch = opts.pitch || 1.2;
      utter.volume = opts.volume || 1;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('voice-settings-btn');
      const panel = document.getElementById('voice-settings-panel');
      const toggle = document.getElementById('voice-guide-toggle');
      const gestureToggle = document.getElementById('gesture-guide-toggle');
      const resetBtn = document.getElementById('reset-gesture-btn');
      
      updateBtnIcon();
      if (isVoiceGuideEnabled()) {
        if (toggle) toggle.classList.add('on');
      } else {
        if (toggle) toggle.classList.remove('on');
      }
      
      if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
        if (gestureToggle) gestureToggle.classList.add('on');
      } else {
        if (gestureToggle) gestureToggle.classList.remove('on');
      }
      
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (panel) panel.classList.toggle('show');
        });
      }
      
      document.addEventListener('click', function(e) {
        if (panel && !panel.contains(e.target) && e.target !== btn) {
          panel.classList.remove('show');
        }
      });
      
      if (toggle) {
        toggle.addEventListener('click', function() {
          const enabled = !isVoiceGuideEnabled();
          setVoiceGuideEnabled(enabled);
          if (enabled) {
            toggle.classList.add('on');
          } else {
            toggle.classList.remove('on');
          }
        });
      }
      
      if (gestureToggle) {
        gestureToggle.addEventListener('click', function() {
          const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
          localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
          if (!enabled) {
            gestureToggle.classList.add('on');
          } else {
            gestureToggle.classList.remove('on');
          }
          if (window.GestureGuide && window.GestureGuide.setEnabled) {
            window.GestureGuide.setEnabled(!enabled);
          }
        });
      }
      
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          try {
            localStorage.removeItem('starlight_gesture_seen');
            alert('手势演示已重置！刷新页面即可重新看到引导动画。');
          } catch(e) {}
        });
      }
      
      if (synth) {
        synth.getVoices();
        window.addEventListener('voiceschanged', function() {
          synth.getVoices();
        });
      }
    });
    
    window.VoiceGuide = {
      speak: speakGuide,
      speakEn: speakEn,
      stop: stopSpeak,
      isEnabled: isVoiceGuideEnabled
    };
  })();
  </script>


  <!-- ========== 小星星向导 ========== -->
  <div id="star-guide-container" class="star-guide-container">
    <div id="star-guide-balloon" class="star-guide-balloon"></div>
    <div id="star-guide" class="star-guide" title="小星星向导">⭐</div>
  </div>
  <script>
  // 小星星向导系统
  window.StarGuide = {
    container: null,
    star: null,
    balloon: null,
    currentStep: 0,
    idleTimer: null,
    idleTimeout: 3000,
    isFlying: false,
    targetGlow: null,
    
    shownSteps: [],
    // 每个页面的引导步骤配置
    steps: [],
    
    init: function(stepsConfig) {
      this.container = document.getElementById('star-guide-container');
      this.star = document.getElementById('star-guide');
      this.balloon = document.getElementById('star-guide-balloon');
      this.steps = stepsConfig || [];
      this.currentStep = 0;
      
      this.shownSteps = [];
      if (!this.container || !this.star || !this.balloon) return;
      
      var self = this;
      
      // 星星点击事件
      this.star.addEventListener('click', function() {
        self.showCurrentStep();
      });
      
      // 监听用户操作（重置空闲计时器）
      document.addEventListener('mousedown', function() { self.resetIdleTimer(); });
      document.addEventListener('touchstart', function() { self.resetIdleTimer(); });
      document.addEventListener('pointerdown', function() { self.resetIdleTimer(); });
      
      // 启动空闲检测
      this.startIdleTimer();
      
      // 页面加载完成后，延迟显示星星
      setTimeout(function() {
        self.container.classList.remove('hidden');
      }, 500);
    },
    
    startIdleTimer: function() {
      var self = this;
      this.idleTimer = setTimeout(function() {
        self.onIdle();
      }, this.idleTimeout);
    },
    
    resetIdleTimer: function() {
      if (this.idleTimer) {
        clearTimeout(this.idleTimer);
      }
      this.startIdleTimer();
      // 隐藏气球
      this.hideBalloon();
    },
    
    onIdle: function() {
      if (this.isFlying) return;
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      // 如果步骤需要等待某个条件，则检查
      if (step.condition && !step.condition()) {
        this.startIdleTimer();
        return;
      }

      // 如果本步骤已经展示过，跳过（避免语音重复覆盖教学）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) {
        this.startIdleTimer();
        return;
      }

      this.showCurrentStep();

    },
    
    showCurrentStep: function() {
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      var self = this;
      
      // 已展示过的步骤不再朗读（用户点星星时跳过）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) return;
      // 如果有目标元素，飞过去
      if (step.target) {
        var targetEl = typeof step.target === 'string' 
          ? document.querySelector(step.target) 
          : step.target;
        
        if (targetEl) {
          this.flyTo(targetEl, function() {
                        // 记录已展示的步骤，防止重复朗读
            var shownSteps = self.shownSteps || (self.shownSteps = []);
            if (shownSteps.indexOf(self.currentStep) === -1) {
              shownSteps.push(self.currentStep);
            }
            self.speak(step.speak || step.text || '看！那里有一个发光的圈圈，点一下试试！');
            self.showBalloon(step.text || '点一下试试！');
            self.highlightTarget(targetEl);
          });
        } else {
          // 找不到目标，直接显示提示
          this.speak(step.speak || step.text);
          this.showBalloon(step.text);
        }
      } else {
        // 没有目标，直接显示提示
        this.speak(step.speak || step.text);
        this.showBalloon(step.text);
      }
    },
    
    flyTo: function(targetEl, callback) {
      this.isFlying = true;
      
      var self = this;
      var starRect = this.star.getBoundingClientRect();
      var targetRect = targetEl.getBoundingClientRect();
      
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      var endX = targetRect.left + targetRect.width / 2;
      var endY = targetRect.top + targetRect.height / 2 - 40;
      
      // 创建飞行中的星星克隆体
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      // 隐藏原星星
      this.container.classList.add('hidden');
      
      // 飞行动画
      var duration = 800;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        // 缓动函数
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 动画结束，移除飞行星星，显示原星星在目标位置
          document.body.removeChild(flyingStar);
          
          // 将原星星移到目标位置
          self.container.style.position = 'fixed';
          self.container.style.left = (endX - 30) + 'px';
          self.container.style.top = (endY - 30) + 'px';
          self.container.style.right = 'auto';
          self.container.style.bottom = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
          if (callback) callback();
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    returnToCorner: function() {
      if (this.isFlying) return;
      
      var self = this;
      
      // 创建飞行中的星星克隆体
      var starRect = this.star.getBoundingClientRect();
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      
      var endX = window.innerWidth - 54;
      var endY = window.innerHeight - 54;
      
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      this.container.classList.add('hidden');
      this.isFlying = true;
      
      var duration = 600;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.removeChild(flyingStar);
          
          self.container.style.position = 'fixed';
          self.container.style.right = '24px';
          self.container.style.bottom = '24px';
          self.container.style.left = 'auto';
          self.container.style.top = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    showBalloon: function(text) {
      if (!this.balloon) return;
      this.balloon.textContent = text;
      this.balloon.classList.add('show');
      
      // 3秒后自动隐藏
      setTimeout(function() {
        this.hideBalloon();
      }.bind(this), 3500);
    },
    
    hideBalloon: function() {
      if (!this.balloon) return;
      this.balloon.classList.remove('show');
    },
    
    highlightTarget: function(targetEl) {
      // 移除旧的光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
      }
      
      var rect = targetEl.getBoundingClientRect();
      this.targetGlow = document.createElement('div');
      this.targetGlow.className = 'star-guide-target-glow';
      this.targetGlow.style.left = (rect.left - 8) + 'px';
      this.targetGlow.style.top = (rect.top - 8) + 'px';
      this.targetGlow.style.width = (rect.width + 16) + 'px';
      this.targetGlow.style.height = (rect.height + 16) + 'px';
      
      document.body.appendChild(this.targetGlow);
      
      // 3秒后移除光环
      setTimeout(function() {
        if (this.targetGlow && this.targetGlow.parentNode) {
          this.targetGlow.parentNode.removeChild(this.targetGlow);
          this.targetGlow = null;
        }
      }.bind(this), 3500);
    },
    
    speak: function(text) {
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak(text);
      }
    },
    
    nextStep: function() {
      // 清除目标光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      
      this.hideBalloon();
      this.currentStep++;
      
      // 返回角落
      setTimeout(function() {
        this.returnToCorner();
        
        // 重新启动空闲检测
        setTimeout(function() {
          this.startIdleTimer();
        }.bind(this), 1000);
      }.bind(this), 500);
    },
    
    reset: function() {
      this.currentStep = 0;
      this.returnToCorner();
      this.hideBalloon();
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      this.startIdleTimer();
    }
  };
  </script>
