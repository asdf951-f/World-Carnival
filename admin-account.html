<script>
  var _profile = null;
  var _pendingAvatar = null;

  function showToast(msg, isError) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    if (isError) toast.style.background = 'var(--accent-muted)';
    document.body.appendChild(toast);
    requestAnimationFrame(function() { toast.classList.add('show'); });
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { toast.remove(); }, 300);
    }, 2500);
  }

  function formatDateTime(iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
  }

  function getInitial(name) {
    if (!name) return 'A';
    var ch = name.charAt(0);
    return ch.toUpperCase();
  }

  function renderAvatar(profile) {
    var letter = document.getElementById('avatar-letter');
    var img = document.getElementById('avatar-img');
    var displaySrc = _pendingAvatar || profile.avatar || '';
    if (displaySrc) {
      img.src = displaySrc;
      img.classList.remove('hidden');
      letter.classList.add('hidden');
    } else {
      img.classList.add('hidden');
      letter.classList.remove('hidden');
      letter.textContent = getInitial(profile.nickname || profile.username);
    }
  }

  async function loadProfile() {
    try {
      var result = await OperatorAuth.api.get('/api/auth/me');
      if (result && result.success && result.data) {
        _profile = result.data;
        document.getElementById('info-username').value = _profile.username || '';
        document.getElementById('info-phone').value = _profile.phoneMasked || '未绑定';
        document.getElementById('info-email').value = _profile.email || 'admin@cda.com';
        document.getElementById('info-role').value = _profile.roleLabel || '运营人员';
        renderAvatar(_profile);
      } else {
        showToast('加载账号信息失败', true);
      }
    } catch (e) {
      console.error(e);
      showToast('加载账号信息失败', true);
    }
  }

  async function loadLoginHistory() {
    var tbody = document.getElementById('login-history-body');
    try {
      var result = await OperatorAuth.api.get('/api/auth/login-history?limit=5');
      if (result && result.success && result.data && Array.isArray(result.data.items)) {
        var items = result.data.items;
        if (items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-sm" style="color:var(--text-card-foreground);">暂无登录记录</td></tr>';
          return;
        }
        tbody.innerHTML = items.map(function(item) {
          var statusHtml;
          if (item.isCurrent) {
            statusHtml = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium" style="background:var(--accent-primary);color:var(--accent-primary-foreground);"><i data-lucide="check-circle-2" class="w-3 h-3"></i>当前</span>';
          } else if (item.status === 'success') {
            statusHtml = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium" style="background:var(--swatch-beige);color:var(--text-foreground);"><i data-lucide="check" class="w-3 h-3" style="color:var(--accent-primary);"></i>成功</span>';
          } else {
            statusHtml = '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-xs font-medium" style="background:var(--swatch-rose);color:var(--accent-muted);"><i data-lucide="x" class="w-3 h-3"></i>失败</span>';
          }
          return '<tr class="stagger-item">' +
            '<td style="color:var(--text-foreground);">' + formatDateTime(item.time) + '</td>' +
            '<td style="color:var(--text-card-foreground);font-family:monospace;">' + (item.ip || '-') + '</td>' +
            '<td style="color:var(--text-foreground);">' + (item.device || '-') + '</td>' +
            '<td>' + statusHtml + '</td>' +
          '</tr>';
        }).join('');
        if (window.lucide) lucide.createIcons();
      } else {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-sm" style="color:var(--text-card-foreground);">加载失败</td></tr>';
      }
    } catch (e) {
      console.error(e);
      tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-sm" style="color:var(--text-card-foreground);">加载失败</td></tr>';
    }
  }

  function handleAvatarUpload(event) {
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      showToast('图片大小不能超过 2MB', true);
      event.target.value = '';
      return;
    }
    if (!/^image\/(jpeg|png)$/.test(file.type)) {
      showToast('仅支持 JPG、PNG 格式', true);
      event.target.value = '';
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      _pendingAvatar = e.target.result;
      renderAvatar(_profile || {});
    };
    reader.readAsDataURL(file);
  }

  async function saveProfile() {
    if (!_pendingAvatar) {
      showToast('没有需要保存的修改');
      return;
    }
    try {
      var result = await OperatorAuth.api.put('/api/auth/profile', { avatar: _pendingAvatar });
      if (result && result.success) {
        _profile = result.data;
        _pendingAvatar = null;
        renderAvatar(_profile);
        showToast('头像更新成功');
      } else {
        showToast((result && result.message) || '保存失败', true);
      }
    } catch (e) {
      console.error(e);
      showToast('保存失败', true);
    }
  }

  async function changePassword() {
    var oldPwd = document.getElementById('old-password').value;
    var newPwd = document.getElementById('new-password').value;
    var confirmPwd = document.getElementById('confirm-password').value;

    if (!oldPwd) { showToast('请输入当前密码', true); return; }
    if (!newPwd) { showToast('请输入新密码', true); return; }
    if (newPwd.length < 8 || newPwd.length > 20) { showToast('新密码长度需为8-20位', true); return; }
    if (!/[a-zA-Z]/.test(newPwd) || !/[0-9]/.test(newPwd)) { showToast('新密码需包含字母和数字', true); return; }
    if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', true); return; }

    try {
      var result = await OperatorAuth.api.put('/api/auth/password', {
        oldPassword: oldPwd,
        newPassword: newPwd
      });
      if (result && result.success) {
        document.getElementById('old-password').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('confirm-password').value = '';
        showToast('密码修改成功，请重新登录');
        setTimeout(function() { OperatorAuth.logout(); }, 1500);
      } else {
        showToast((result && result.message) || '密码修改失败', true);
      }
    } catch (e) {
      console.error(e);
      showToast('密码修改失败', true);
    }
  }

  loadProfile();
  loadLoginHistory();
  lucide.createIcons();
</script>
<script src="shared-motion.js" defer></script>
</body>
</html>
