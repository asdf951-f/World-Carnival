<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>词语翻翻乐</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --star-gold: #FDCB6E;
  --star-purple: #6C5CE7;
  --star-blue: #45A29E;
  --star-green: #4ECDC4;
  --star-light: #C5C6C7;
  --star-dark: #0B0C10;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', 'PingFang SC', sans-serif;
  background: radial-gradient(ellipse at top, #1a1a3e 0%, #0B0C10 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
}

.stars-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}
.back-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
.header-title {
  font-size: 18px;
  font-weight: 800;
  text-shadow: 0 0 20px rgba(253,203,110,0.5);
}

.main-content {
  padding: calc(env(safe-area-inset-top, 0px) + 70px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-width: 420px;
  margin: 0 auto;
}

/* 难度选择 */
.difficulty-section {
  margin-bottom: 24px;
}
.difficulty-title {
  text-align: center;
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 12px;
}
.difficulty-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
}
.diff-btn {
  padding: 10px 20px;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}
.diff-btn.active {
  background: linear-gradient(135deg, var(--star-purple), var(--star-gold));
  border-color: transparent;
  box-shadow: 0 0 20px rgba(108,92,231,0.4);
}
.diff-btn:active { transform: scale(0.95); }

/* 游戏信息 */
.game-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.1);
}
.info-item {
  text-align: center;
}
.info-label {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  display: block;
}
.info-value {
  font-size: 20px;
  font-weight: 800;
  color: var(--star-gold);
}

/* 卡片网格 */
.card-grid {
  display: grid;
  gap: 10px;
  margin-bottom: 24px;
}
.card-grid.easy { grid-template-columns: repeat(4, 1fr); }
.card-grid.medium { grid-template-columns: repeat(4, 1fr); }
.card-grid.hard { grid-template-columns: repeat(4, 1fr); }

/* 卡片样式 */
.card {
  aspect-ratio: 1;
  perspective: 1000px;
  cursor: pointer;
}
.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.card.flipped .card-inner {
  transform: rotateY(180deg);
}
.card.matched .card-inner {
  transform: rotateY(180deg);
  animation: matchPulse 0.5s ease-in-out;
}
@keyframes matchPulse {
  0%, 100% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.1); }
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-front {
  background: linear-gradient(135deg, rgba(108,92,231,0.3) 0%, rgba(162,155,254,0.2) 100%);
  border: 3px solid rgba(108,92,231,0.5);
}
.card-front::before {
  content: '?';
  font-size: 32px;
  font-weight: 800;
  color: rgba(255,255,255,0.6);
}

.card-back {
  background: rgba(255,255,255,0.1);
  border: 3px solid rgba(253,203,110,0.6);
  transform: rotateY(180deg);
  box-shadow: 0 0 20px rgba(253,203,110,0.2);
}

.card-emoji {
  font-size: 36px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.card-back.matched {
  border-color: #4ECDC4;
  box-shadow: 0 0 30px rgba(78,205,196,0.4);
}

/* 成功弹窗 */
.success-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.success-overlay.show {
  display: flex;
  animation: fadeIn 0.3s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.success-card {
  background: linear-gradient(135deg, rgba(108,92,231,0.9) 0%, rgba(253,203,110,0.9) 100%);
  border-radius: 24px;
  padding: 32px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.success-emoji {
  font-size: 64px;
  margin-bottom: 16px;
  animation: bounce 0.6s ease-in-out;
}
@keyframes bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.success-title {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 8px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.success-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 20px;
}

.success-sticker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.2);
  padding: 8px 16px;
  border-radius: 20px;
  margin-bottom: 20px;
}
.success-sticker .emoji {
  font-size: 24px;
}
.success-sticker .text {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}

.success-buttons {
  display: flex;
  gap: 12px;
}
.success-btn {
  flex: 1;
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}
.success-btn.primary {
  background: #fff;
  color: var(--star-purple);
}
.success-btn.secondary {
  background: rgba(255,255,255,0.2);
  color: #fff;
}
.success-btn:active { transform: scale(0.95); }

/* 语音设置 */
.voice-settings-btn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  cursor: pointer;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
.voice-settings-btn:active { transform: scale(0.9); }
.voice-settings-btn.muted { opacity: 0.5; }

.voice-settings-panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 114px);
  right: 12px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 16px;
  z-index: 101;
  min-width: 200px;
  border: 1px solid rgba(255,255,255,0.15);
  display: none;
}
.voice-settings-panel.show { display: block; animation: panelIn 0.2s ease-out; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.voice-settings-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}
.voice-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.voice-setting-label {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}
.voice-toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  padding: 0;
}
.voice-toggle.on { background: #4ECDC4; }
.voice-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.2s;
}
.voice-toggle.on::after { left: 22px; }

/* 贴纸奖励动画 */
.sticker-reward {
  position: fixed;
  font-size: 48px;
  pointer-events: none;
  z-index: 300;
  animation: stickerFly 1.5s ease-out forwards;
}
@keyframes stickerFly {
  0% { opacity: 1; transform: scale(0.5) translateY(0); }
  30% { opacity: 1; transform: scale(1.2) translateY(-50px); }
  100% { opacity: 0; transform: scale(1) translateY(-200px); }
}
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim { animation: gestureTap 1.8s ease-in-out infinite; }
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim { animation: gestureRipple 1.8s ease-out infinite; }
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px; height: 60px;
      background: radial-gradient(circle at 30% 30%, #FFF4B8, #FFD700);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: starBounce 2s ease-in-out infinite;
      position: relative;
    }
    .star-guide::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,215,0,0.4);
      animation: starRotate 8s linear infinite;
    }
    @keyframes starBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes starRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .star-guide-bubble {
      position: absolute;
      bottom: 70px;
      right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 220px;
      white-space: normal;
      line-height: 1.4;
    }
    .star-guide-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .star-guide-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 20px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(0,0,0,0.85);
    }
  </style>
</head>
<body>
  <div class="stars-bg" id="stars-bg"></div>
  
  <header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h1 class="header-title">🃏 词语翻翻乐</h1>
    <div></div>
  </header>
  
  <main class="main-content">
    <div class="difficulty-section">
      <div class="difficulty-title">选择难度</div>
      <div class="difficulty-buttons">
        <button class="diff-btn active" data-level="easy" onclick="selectDifficulty('easy')">简单 (4对)</button>
        <button class="diff-btn" data-level="medium" onclick="selectDifficulty('medium')">中等 (6对)</button>
        <button class="diff-btn" data-level="hard" onclick="selectDifficulty('hard')">困难 (8对)</button>
      </div>
    </div>
    
    <div class="game-info">
      <div class="info-item">
        <span class="info-label">步数</span>
        <span class="info-value" id="step-count">0</span>
      </div>
      <div class="info-item">
        <span class="info-label">配对</span>
        <span class="info-value" id="match-count">0</span>
      </div>
      <div class="info-item">
        <span class="info-label">时间</span>
        <span class="info-value" id="time-count">00:00</span>
      </div>
    </div>
    
    <div class="card-grid easy" id="card-grid">
    </div>
  </main>
  
  <div class="success-overlay" id="success-overlay">
    <div class="success-card">
      <div class="success-emoji">🎉</div>
      <div class="success-title">太棒了！</div>
      <div class="success-desc">你完成了词语翻翻乐！</div>
      <div class="success-sticker" id="success-sticker">
        <span class="emoji">✨</span>
        <span class="text">获得新贴纸！</span>
      </div>
      <div class="success-buttons">
        <button class="success-btn secondary" onclick="goBack()">返回</button>
        <button class="success-btn primary" onclick="restartGame()">再玩一次</button>
      </div>
    </div>
  </div>

  <!-- 语音设置 -->
  <button class="voice-settings-btn" id="voice-settings-btn" onclick="toggleVoiceSettings()">🔊</button>
  <div class="voice-settings-panel" id="voice-settings-panel">
    <div class="voice-settings-title">游戏设置</div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">语音引导</span>
      <button class="voice-toggle on" id="voice-toggle" onclick="toggleVoiceGuide()"></button>
    </div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">手势指引</span>
      <button class="voice-toggle on" id="gesture-toggle" onclick="toggleGestureGuide()"></button>
    </div>
    <div class="voice-setting-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 8px; padding-top: 12px;">
      <span class="voice-setting-label">重置手势演示</span>
      <button id="reset-gesture-btn" style="background: rgba(255,200,60,0.3); border: 1px solid rgba(255,200,60,0.5); color: #FFC048; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;" onclick="resetGesture()">重置</button>
    </div>
  </div>

  <script>
// ========== VoiceGuide 系统 ==========
(function() {
  const STORAGE_KEY = 'starlight_voice_guide';
  const synth = window.speechSynthesis || null;

  function isVoiceGuideEnabled() {
    const v = localStorage.getItem(STORAGE_KEY);
    return v !== 'false';
  }

  function setVoiceGuideEnabled(enabled) {
    localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
    updateBtnIcon();
    if (enabled) {
      speakGuide('语音引导已开启');
    }
  }

  function updateBtnIcon() {
    const btn = document.getElementById('voice-settings-btn');
    if (!btn) return;
    if (isVoiceGuideEnabled()) {
      btn.textContent = '🔊';
      btn.classList.remove('muted');
    } else {
      btn.textContent = '🔇';
      btn.classList.add('muted');
    }
  }

  let currentUtterance = null;

  function stopSpeak() {
    if (synth && synth.speaking) {
      synth.cancel();
    }
    currentUtterance = null;
  }

  function speakGuide(text, options) {
    if (!isVoiceGuideEnabled()) return;
    if (!synth) return;
    if (!text || !text.trim()) return;

    stopSpeak();

    const opts = options || {};
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = opts.rate || 0.9;
    utter.pitch = opts.pitch || 1.3;
    utter.volume = opts.volume || 1;

    const voices = synth.getVoices();
    const zhVoice = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
    });
    if (zhVoice) utter.voice = zhVoice;

    currentUtterance = utter;
    synth.speak(utter);
  }

  function speakEn(text, options) {
    if (!isVoiceGuideEnabled()) return;
    if (!synth) return;
    if (!text || !text.trim()) return;

    stopSpeak();

    const opts = options || {};
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = opts.rate || 0.8;
    utter.pitch = opts.pitch || 1.2;
    utter.volume = opts.volume || 1;

    currentUtterance = utter;
    synth.speak(utter);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('voice-settings-btn');
    const panel = document.getElementById('voice-settings-panel');
    const toggle = document.getElementById('voice-toggle');
    const gestureToggle = document.getElementById('gesture-toggle');

    updateBtnIcon();
    if (isVoiceGuideEnabled()) {
      if (toggle) toggle.classList.add('on');
    } else {
      if (toggle) toggle.classList.remove('on');
    }

    if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
      if (gestureToggle) gestureToggle.classList.add('on');
    } else {
      if (gestureToggle) gestureToggle.classList.remove('on');
    }

    if (btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (panel) panel.classList.toggle('show');
      });
    }

    document.addEventListener('click', function(e) {
      if (panel && !panel.contains(e.target) && e.target !== btn) {
        panel.classList.remove('show');
      }
    });

    if (synth) {
      synth.getVoices();
      window.addEventListener('voiceschanged', function() {
        synth.getVoices();
      });
    }
  });

  window.VoiceGuide = {
    speak: speakGuide,
    speakEn: speakEn,
    stop: stopSpeak,
    isEnabled: isVoiceGuideEnabled
  };
})();

// 全局语音设置函数
function toggleVoiceSettings() {
  const panel = document.getElementById('voice-settings-panel');
  if (panel) panel.classList.toggle('show');
}

function toggleVoiceGuide() {
  const toggle = document.getElementById('voice-toggle');
  const btn = document.getElementById('voice-settings-btn');
  const currentEnabled = window.VoiceGuide && window.VoiceGuide.isEnabled && window.VoiceGuide.isEnabled();
  const newEnabled = !currentEnabled;
  
  localStorage.setItem('starlight_voice_guide', newEnabled ? 'true' : 'false');
  
  if (toggle) {
    if (newEnabled) {
      toggle.classList.add('on');
    } else {
      toggle.classList.remove('on');
    }
  }
  
  if (btn) {
    btn.textContent = newEnabled ? '🔊' : '🔇';
    btn.classList.toggle('muted', !newEnabled);
  }
  
  if (newEnabled && window.VoiceGuide && window.VoiceGuide.speak) {
    window.VoiceGuide.speak('语音引导已开启');
  } else if (window.VoiceGuide && window.VoiceGuide.stop) {
    window.VoiceGuide.stop();
  }
}

function toggleGestureGuide() {
  const toggle = document.getElementById('gesture-toggle');
  const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
  localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
  if (toggle) toggle.classList.toggle('on', !enabled);
  if (window.GestureGuide && window.GestureGuide.setEnabled) {
    window.GestureGuide.setEnabled(!enabled);
  }
  if (!enabled && window.VoiceGuide && window.VoiceGuide.speak) {
    window.VoiceGuide.speak('手势指引已关闭');
  } else if (window.VoiceGuide && window.VoiceGuide.speak) {
    window.VoiceGuide.speak('手势指引已开启');
  }
}

function resetGesture() {
  try {
    localStorage.removeItem('starlight_gesture_seen');
    if (window.VoiceGuide && window.VoiceGuide.speak) {
      window.VoiceGuide.speak('手势演示已重置');
    }
    alert('手势演示已重置！刷新页面即可重新看到引导动画。');
  } catch(e) {}
}

  { id: 'frog', emoji: '🐸', word: '青蛙', pinyin: 'qīng wā' },
  { id: 'parrot', emoji: '🦜', word: '鹦鹉', pinyin: 'yīng wǔ' },

const DIFFICULTY_CONFIG = {
  easy: { pairs: 4, gridClass: 'easy' },
  medium: { pairs: 6, gridClass: 'medium' },
  hard: { pairs: 8, gridClass: 'hard' },
};

const ANIMAL_CHEERS = [
  '太棒了！',
  '你真聪明！',
  '做得好！',
  '哇！',
  '继续加油！',
  '完美！',
];

const REWARD_STICKERS = [
  { id: 'star1', emoji: '⭐', name: '闪亮星星' },
  { id: 'star2', emoji: '✨', name: '梦幻星光' },
  { id: 'star3', emoji: '🌟', name: '金色星星' },
  { id: 'crown', emoji: '👑', name: '皇冠' },
  { id: 'rainbow', emoji: '🌈', name: '彩虹' },
  { id: 'heart', emoji: '💖', name: '爱心' },
];

let currentDifficulty = 'easy';
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let steps = 0;
let isProcessing = false;
let timerInterval = null;
let seconds = 0;

function initStars() {
  const container = document.getElementById('stars-bg');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = Math.random() * 3 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.animationDelay = Math.random() * 2 + 's';
    star.style.animationDuration = (Math.random() * 2 + 1) + 's';
    container.appendChild(star);
  }
}

function speak(text) {
  if (window.VoiceGuide) {
    window.VoiceGuide.speak(text);
  } else {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1.1;
    speechSynthesis.speak(utterance);
  }
}

function selectDifficulty(level) {
  currentDifficulty = level;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.level === level));
  restartGame();
}

function restartGame() {
  stopTimer();
  const grid = document.getElementById('card-grid');
  grid.className = `card-grid ${DIFFICULTY_CONFIG[currentDifficulty].gridClass}`;
  grid.innerHTML = '';
  
  const pairs = DIFFICULTY_CONFIG[currentDifficulty].pairs;
  const selectedVocab = VOCABULARY.slice(0, pairs);
  
  cards = [];
  selectedVocab.forEach(v => {
    cards.push({ ...v, uid: v.id + '_a' });
    cards.push({ ...v, uid: v.id + '_b' });
  });
  
  cards = shuffleArray(cards);
  
  cards.forEach((card, index) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.uid = card.uid;
    cardEl.dataset.id = card.id;
    cardEl.style.animationDelay = `${index * 0.05}s`;
    cardEl.onclick = () => flipCard(cardEl);
    
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front"></div>
        <div class="card-face card-back">
          <div class="card-emoji">${card.emoji}</div>
        </div>
      </div>
    `;
    grid.appendChild(cardEl);
  });
  
  flippedCards = [];
  matchedPairs = 0;
  steps = 0;
  seconds = 0;
  isProcessing = false;
  
  updateUI();
  startTimer();
  
  const overlay = document.getElementById('success-overlay');
  overlay.classList.remove('show');
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function flipCard(cardEl) {
  if (isProcessing) return;
  if (cardEl.classList.contains('flipped')) return;
  if (cardEl.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;
  
  cardEl.classList.add('flipped');
  flippedCards.push(cardEl);
  
  if (flippedCards.length === 2) {
    steps++;
    updateUI();
    checkMatch();
  }
}

function checkMatch() {
  isProcessing = true;
  
  const [first, second] = flippedCards;
  const firstId = first.dataset.id;
  const secondId = second.dataset.id;
  
  if (firstId === secondId) {
    setTimeout(() => {
      first.classList.add('matched');
      second.classList.add('matched');
      first.querySelector('.card-back').classList.add('matched');
      second.querySelector('.card-back').classList.add('matched');
      
      const vocab = VOCABULARY.find(v => v.id === firstId);
      if (vocab) {
        speak(vocab.word + '，' + vocab.pinyin);
      }
      
      const cheer = ANIMAL_CHEERS[Math.floor(Math.random() * ANIMAL_CHEERS.length)];
      setTimeout(() => speak(cheer), 800);
      
      showStickerReward();
      
      matchedPairs++;
      updateUI();
      flippedCards = [];
      isProcessing = false;
      
      if (matchedPairs === DIFFICULTY_CONFIG[currentDifficulty].pairs) {
        setTimeout(() => gameComplete(), 1500);
      }
    }, 600);
  } else {
    setTimeout(() => {
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      flippedCards = [];
      isProcessing = false;
    }, 1000);
  }
}

function showStickerReward() {
  const reward = REWARD_STICKERS[Math.floor(Math.random() * REWARD_STICKERS.length)];
  const rewardEl = document.createElement('div');
  rewardEl.className = 'sticker-reward';
  rewardEl.textContent = reward.emoji;
  rewardEl.style.left = '50%';
  rewardEl.style.top = '50%';
  document.body.appendChild(rewardEl);
  
  setTimeout(() => {
    rewardEl.remove();
    saveRewardSticker(reward);
  }, 1500);
}

function saveRewardSticker(reward) {
  try {
    const dbKey = 'starCarnivalDB';
    const raw = localStorage.getItem(dbKey);
    if (!raw) return;
    const db = JSON.parse(raw);
    const cid = db.currentPlayerId;
    if (!cid) return;
    
    const progKey = 'starCarnival_progress_' + cid;
    const progRaw = localStorage.getItem(progKey);
    let prog = progRaw ? JSON.parse(progRaw) : {};
    
    if (!prog.unlockedStickers) prog.unlockedStickers = [];
    if (!prog.unlockedStickers.includes(reward.id)) {
      prog.unlockedStickers.push(reward.id);
      localStorage.setItem(progKey, JSON.stringify(prog));
    }
  } catch(e) {}
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    updateUI();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateUI() {
  document.getElementById('step-count').textContent = steps;
  document.getElementById('match-count').textContent = matchedPairs + '/' + DIFFICULTY_CONFIG[currentDifficulty].pairs;
  
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  document.getElementById('time-count').textContent = 
    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function gameComplete() {
  stopTimer();
  
  const reward = REWARD_STICKERS[Math.floor(Math.random() * REWARD_STICKERS.length)];
  const stickerEl = document.getElementById('success-sticker');
  stickerEl.innerHTML = `<span class="emoji">${reward.emoji}</span><span class="text">获得${reward.name}！</span>`;
  
  saveRewardSticker(reward);
  
  speak('恭喜你！完成了词语翻翻乐！');
  
  const overlay = document.getElementById('success-overlay');
  overlay.classList.add('show');
}

function goBack() {
  stopTimer();
  window.location.href = 'starlight-finale-v2.html';
}

window.addEventListener('load', () => {
  initStars();
  restartGame();
});

<script>
// 引导手势动画系统
window.GestureGuide = {
  STORAGE_KEY: 'starlight_gesture_seen',
  GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
  
  _enabled: true,
  
  isEnabled: function() {
    const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
    return v !== 'false';
  },
  
  setEnabled: function(enabled) {
    this._enabled = enabled;
    localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
  },
  
  hasSeen: function(id) {
    try {
      var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
      return seen[id] === true;
    } catch(e) { return false; }
  },
  markSeen: function(id) {
    try {
      var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
      seen[id] = true;
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
    } catch(e) {}
  },
  remove: function(overlay) {
    if (overlay && overlay.parentNode) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.3s';
      setTimeout(function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 300);
    }
  },
  showTap: function(targetEl, options) {
    if (!this.isEnabled()) return null;
    
    var opts = options || {};
    var id = opts.id || 'tap_' + Date.now();
    var once = opts.once !== false;
    var duration = opts.duration || 3000;
    if (once && this.hasSeen(id)) return null;
    var rect = targetEl.getBoundingClientRect();
    var overlay = document.createElement('div');
    overlay.className = 'gesture-overlay';
    var hand = document.createElement('div');
    hand.className = 'gesture-hand gesture-tap-anim';
    hand.textContent = '👆';
    hand.style.left = (rect.left + rect.width / 2) + 'px';
    hand.style.top = (rect.top + rect.height / 2) + 'px';
    hand.style.fontSize = opts.size || '80px';
    overlay.appendChild(hand);
    var ripple = document.createElement('div');
    ripple.className = 'gesture-ripple gesture-ripple-anim';
    ripple.style.left = (rect.left + rect.width / 2) + 'px';
    ripple.style.top = (rect.top + rect.height / 2) + 'px';
    overlay.appendChild(ripple);
    document.body.appendChild(overlay);
    var self = this;
    var timer = setTimeout(function() {
      self.remove(overlay);
      if (once) self.markSeen(id);
    }, duration);
    overlay._timer = timer;
    return overlay;
  }
};
</script>

<script>
// 小星星向导
window.StarGuide = {
  container: null,
  star: null,
  bubble: null,
  steps: [],
  currentStep: 0,
  idleTimer: null,
  init: function(steps) {
    this.steps = steps || [];
    this.currentStep = 0;
    this.createDOM();
    this.startIdleWatch();
  },
  createDOM: function() {
    if (this.container) return;
    this.container = document.createElement('div');
    this.container.className = 'star-guide-container hidden';
    this.container.id = 'star-guide';
    this.star = document.createElement('div');
    this.star.className = 'star-guide';
    this.star.textContent = '⭐';
    this.bubble = document.createElement('div');
    this.bubble.className = 'star-guide-bubble';
    this.container.appendChild(this.bubble);
    this.container.appendChild(this.star);
    document.body.appendChild(this.container);
  },
  show: function(text, targetSelector) {
    if (!this.container) this.createDOM();
    this.container.classList.remove('hidden');
    this.bubble.textContent = text;
    this.bubble.classList.add('show');
    if (targetSelector) {
      var target = document.querySelector(targetSelector);
      if (target) {
        var rect = target.getBoundingClientRect();
        this.container.style.position = 'fixed';
        this.container.style.bottom = 'auto';
        this.container.style.right = 'auto';
        this.container.style.left = (rect.left + rect.width/2 - 30) + 'px';
        this.container.style.top = (rect.top + rect.height + 12) + 'px';
      }
    } else {
      this.container.style.position = 'fixed';
      this.container.style.bottom = '24px';
      this.container.style.right = '24px';
      this.container.style.left = 'auto';
      this.container.style.top = 'auto';
    }
    clearTimeout(this._hideTimer);
    this._hideTimer = setTimeout(() => { this.hide(); }, 5000);
  },
  hide: function() {
    if (!this.container) return;
    this.bubble.classList.remove('show');
    this.container.classList.add('hidden');
  },
  startIdleWatch: function() {
    var self = this;
    var lastActivity = Date.now();
    function onActivity() { lastActivity = Date.now(); }
    document.addEventListener('click', onActivity);
    document.addEventListener('touchstart', onActivity);
    document.addEventListener('pointerdown', onActivity);
    function checkIdle() {
      if (Date.now() - lastActivity > 3000 && self.currentStep < self.steps.length) {
        var step = self.steps[self.currentStep];
        if (!step.condition || step.condition()) {
          self.show(step.text, step.target);
          if (step.speak && window.VoiceGuide) window.VoiceGuide.speak(step.speak);
          self.nextStep();
        }
      }
    }
    self.idleTimer = setInterval(checkIdle, 1000);
  },
  nextStep: function() {
    this.currentStep++;
    this.hide();
  }
};

// 页面专属StarGuide配置
(function() {
  function initStarGuide() {
    if (window.StarGuide) {
      window.StarGuide.init([
        { target: '.diff-btn', text: '选择一个难度，开始词语翻翻乐吧！', speak: '选择一个难度，开始词语翻翻乐吧！' }
      ]);
    } else {
      setTimeout(initStarGuide, 300);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(initStarGuide, 500); });
  } else {
    setTimeout(initStarGuide, 500);
  }
})();

// 页面专属手势引导
(function() {
  function waitAndShow() {
    if (window.GestureGuide) {
      var btn = document.querySelector('.diff-btn');
      if (btn) {
        setTimeout(function() {
          GestureGuide.showTap(btn, { id: 'memory_diff_btn', duration: 4000 });
        }, 300);
      }
    } else {
      setTimeout(waitAndShow, 200);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(waitAndShow, 500); });
  } else {
    setTimeout(waitAndShow, 500);
  }
})();
</script>
