/* 星空背景 */
.stars-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

/* 导航栏 */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}
.back-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
.header-title {
  font-size: 18px;
  font-weight: 800;
  text-shadow: 0 0 20px rgba(253,203,110,0.5);
}
.sticker-count {
  font-size: 14px;
  font-weight: 600;
  color: var(--star-gold);
  background: rgba(253,203,110,0.15);
  padding: 4px 12px;
  border-radius: 999px;
}

/* 内容区域 */
.main-content {
  padding: calc(env(safe-area-inset-top, 0px) + 70px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-width: 420px;
  margin: 0 auto;
}

/* 成就徽章 */
.achievement-badge {
  text-align: center;
  margin-bottom: 24px;
}
.achievement-badge.unlocked {
  animation: badgeGlow 2s ease-in-out infinite;
}
@keyframes badgeGlow {
  0%, 100% { filter: drop-shadow(0 0 10px rgba(253,203,110,0.5)); }
  50% { filter: drop-shadow(0 0 30px rgba(253,203,110,0.8)); }
}
.badge-icon {
  font-size: 80px;
  margin-bottom: 8px;
}
.badge-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--star-gold);
  margin-bottom: 4px;
}
.badge-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}

/* 贴纸网格 */
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

/* 贴纸卡片 */
.sticker-card {
  aspect-ratio: 1;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.sticker-card:hover {
  transform: translateY(-4px);
  border-color: rgba(253,203,110,0.5);
}
.sticker-card:active {
  transform: scale(0.95);
}
.sticker-card.locked {
  opacity: 0.4;
  cursor: not-allowed;
}
.sticker-card.locked:hover {
  transform: none;
}

/* 星光边框 */
.sticker-card.unlocked {
  border-color: var(--star-gold);
  box-shadow: 0 0 20px rgba(253,203,110,0.3), inset 0 0 30px rgba(253,203,110,0.1);
}
.sticker-card.unlocked::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: linear-gradient(45deg, transparent 30%, rgba(253,203,110,0.3) 50%, transparent 70%);
  animation: borderShine 3s linear infinite;
}
@keyframes borderShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* 贴纸内容 */
.sticker-emoji {
  font-size: 56px;
  margin-bottom: 8px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  transition: transform 0.3s;
}
.sticker-card.unlocked:active .sticker-emoji {
  transform: scale(1.2) rotate(10deg);
}
.sticker-name {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
}
.sticker-card.locked .sticker-emoji {
  font-size: 40px;
  opacity: 0.3;
}
.sticker-card.locked .sticker-name {
  color: rgba(255,255,255,0.3);
}

/* 锁定图标 */
.lock-icon {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 16px;
  opacity: 0.5;
}

/* 星星装饰 */
.card-star {
  position: absolute;
  font-size: 12px;
  opacity: 0.6;
  animation: floatStar 3s ease-in-out infinite;
}
@keyframes floatStar {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* 语音设置按钮 */
.voice-settings-btn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  cursor: pointer;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
}
.voice-settings-btn.muted { opacity: 0.5; }

.voice-settings-panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 114px);
  right: 12px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 16px;
  z-index: 101;
  min-width: 200px;
  border: 1px solid rgba(255,255,255,0.15);
  display: none;
}
.voice-settings-panel.show { display: block; }
.voice-settings-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}
.voice-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.voice-setting-label {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}
.voice-toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  padding: 0;
}
.voice-toggle.on { background: #4ECDC4; }
.voice-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.2s;
}
.voice-toggle.on::after { left: 22px; }
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim { animation: gestureTap 1.8s ease-in-out infinite; }
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim { animation: gestureRipple 1.8s ease-out infinite; }
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px; height: 60px;
      background: radial-gradient(circle at 30% 30%, #FFF4B8, #FFD700);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: starBounce 2s ease-in-out infinite;
      position: relative;
    }
    .star-guide::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,215,0,0.4);
      animation: starRotate 8s linear infinite;
    }
    @keyframes starBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes starRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .star-guide-bubble {
      position: absolute;
      bottom: 70px;
      right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 220px;
      white-space: normal;
      line-height: 1.4;
    }
    .star-guide-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .star-guide-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 20px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(0,0,0,0.85);
    }
  </style>

      if (Q.locked) return;
      if (Q.queue.length === 0) { Q.current = null; return; }
      Q.queue.sort(function(a,b){ return b.priority - a.priority; });
      var item = Q.queue.shift();
      Q.current = item; Q.locked = true;
      var done = false;
      var finish = function() {
        if (done) return; done = true; Q.locked = false; setTimeout(Q._drain, 120);
      };
      var usedVG = false;
      try {
        if (window.VoiceGuide && typeof window.VoiceGuide.speak === 'function'
            && (!window.VoiceGuide.isEnabled || window.VoiceGuide.isEnabled())) {
          window.VoiceGuide.speak(item.text, { lang: item.lang, rate: item.rate, onEnd: finish });
          usedVG = true;
        }
      } catch(e) { usedVG = false; }
      if (!usedVG) {
        try {
          if (!('speechSynthesis' in window)) { finish(); return; }
          var synth = window.speechSynthesis; synth.cancel();
          var u = new SpeechSynthesisUtterance(item.text);
          u.lang = item.lang; u.rate = item.rate;
          u.onend = finish; u.onerror = finish; synth.speak(u);
        } catch(e) { finish(); }
      }
      setTimeout(finish, 12000);
    }
  };
  window.__VoiceQueueV9 = Q; window.VoiceQueueV9 = Q;
  try {
    if (window.VoiceGuide && window.VoiceGuide.speak) {
      var origSpeak = window.VoiceGuide.speak.bind(window.VoiceGuide);
      var lastSpeakText = '', lastSpeakAt = 0;
      window.VoiceGuide.speak = function(text, opts) {
        var now = Date.now();
        if (text === lastSpeakText && now - lastSpeakAt < 1500) return;
        lastSpeakText = text; lastSpeakAt = now;
        return Q.push(text, opts);
      };
    }
  } catch(e) {}
})();
</script>

<script>
// 引导手势动画系统
window.GestureGuide = {
  STORAGE_KEY: 'starlight_gesture_seen',
  GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',

  _enabled: true,

  isEnabled: function() {
    var v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
    return v !== 'false';
  },

  setEnabled: function(enabled) {
    this._enabled = enabled;
    localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
  },

  hasSeen: function(id) {
      if (!this.isEnabled()) return;

    try {
      var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
      return seen[id] === true;
    } catch(e) { return false; }
  },
  markSeen: function(id) {
      if (!this.isEnabled()) return;

    try {
      var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
      seen[id] = true;
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
    } catch(e) {}
  },
  remove: function(overlay) {
      if (!this.isEnabled()) return;

    if (overlay && overlay.parentNode) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.3s';
      setTimeout(function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 300);
    }
  },
  showTap: function(targetEl, options) {
    if (!this.isEnabled()) return null;

    var opts = options || {};
    var id = opts.id || 'tap_' + Date.now();
    var once = opts.once !== false;
    var duration = opts.duration || 3000;
    if (once && this.hasSeen(id)) return null;
    var rect = targetEl.getBoundingClientRect();
    var overlay = document.createElement('div');
    overlay.className = 'gesture-overlay';
    var hand = document.createElement('div');
    hand.className = 'gesture-hand gesture-tap-anim';
    hand.textContent = '👆';
    hand.style.left = (rect.left + rect.width / 2) + 'px';
    hand.style.top = (rect.top + rect.height / 2) + 'px';
    hand.style.fontSize = opts.size || '80px';
    overlay.appendChild(hand);
    var ripple = document.createElement('div');
    ripple.className = 'gesture-ripple gesture-ripple-anim';
    ripple.style.left = (rect.left + rect.width / 2) + 'px';
    ripple.style.top = (rect.top + rect.height / 2) + 'px';
    overlay.appendChild(ripple);
    document.body.appendChild(overlay);
    var self = this;
    var timer = setTimeout(function() {
      self.remove(overlay);
      if (once) self.markSeen(id);
    }, duration);
    overlay._timer = timer;
    return overlay;
  }
};
</script>

  idleTimer: null,
  init: function(steps) {
    this.steps = steps || [];
    this.currentStep = 0;
    this.createDOM();
    this.startIdleWatch();
  },
  createDOM: function() {
    if (this.container) return;
    this.container = document.createElement('div');
    this.container.className = 'star-guide-container hidden';
    this.container.id = 'star-guide';
    this.star = document.createElement('div');
    this.star.className = 'star-guide';
    this.star.textContent = '⭐';
    this.bubble = document.createElement('div');
    this.bubble.className = 'star-guide-bubble';
    this.container.appendChild(this.bubble);
    this.container.appendChild(this.star);
    document.body.appendChild(this.container);
  },
  show: function(text, targetSelector) {
    if (!this.container) this.createDOM();
    this.container.classList.remove('hidden');
    this.bubble.textContent = text;
    this.bubble.classList.add('show');
    if (targetSelector) {
      var target = document.querySelector(targetSelector);
      if (target) {
        var rect = target.getBoundingClientRect();
        this.container.style.position = 'fixed';
        this.container.style.bottom = 'auto';
        this.container.style.right = 'auto';
        this.container.style.left = (rect.left + rect.width/2 - 30) + 'px';
        this.container.style.top = (rect.top + rect.height + 12) + 'px';
      }
    } else {
      this.container.style.position = 'fixed';
      this.container.style.bottom = '24px';
      this.container.style.right = '24px';
      this.container.style.left = 'auto';
      this.container.style.top = 'auto';
    }
    clearTimeout(this._hideTimer);
    this._hideTimer = setTimeout(() => { this.hide(); }, 5000);
  },
  hide: function() {
    if (!this.container) return;
    this.bubble.classList.remove('show');
    this.container.classList.add('hidden');
  },
  startIdleWatch: function() {
    var self = this;
    var lastActivity = Date.now();
    function onActivity() { lastActivity = Date.now(); }
    document.addEventListener('click', onActivity);
    document.addEventListener('touchstart', onActivity);
    document.addEventListener('pointerdown', onActivity);
    function checkIdle() {
      if (Date.now() - lastActivity > 3000 && self.currentStep < self.steps.length) {
        var step = self.steps[self.currentStep];
        if (!step.condition || step.condition()) {
          self.show(step.text, step.target);
          if (step.speak && window.VoiceGuide) window.VoiceGuide.speak(step.speak);
        }
      }
    }
    self.idleTimer = setInterval(checkIdle, 1000);
  },
  nextStep: function() {
    this.currentStep++;
    this.hide();
  }
};

// 页面专属StarGuide配置
(function() {
  function initStarGuide() {
    if (window.StarGuide) {
      window.StarGuide.init([
        { target: '.sticker-item', text: '点击贴纸，看看动物朋友会说什么！', speak: '点击贴纸，看看动物朋友会说什么！' }
      ]);
    } else {
      setTimeout(initStarGuide, 300);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(initStarGuide, 500); });
  } else {
    setTimeout(initStarGuide, 500);
  }
})();

// 页面专属手势引导
(function() {
  function waitAndShow() {
    if (window.GestureGuide) {
      var btn = document.querySelector('.sticker-item');
      if (btn) {
        setTimeout(function() {
          GestureGuide.showTap(btn, { id: 'sticker_book_item', duration: 4000 });
        }, 300);
      }
    } else {
      setTimeout(waitAndShow, 200);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(waitAndShow, 500); });
  } else {
    setTimeout(waitAndShow, 500);
  }
})();
</script>
