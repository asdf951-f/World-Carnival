<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>回声谷 - 小青蛙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style id="theme-vars">
    :root {
      --ev-deep: #1A2E35;
      --ev-mist: #D4E9E2;
      --ev-rock: #4A5D5E;
      --ev-gold: #F2C94C;
      --ev-glass: rgba(255,255,255,0.15);
      --ev-water-deep: #1B4F5C;
      --ev-water-mid: #2D7A8A;
      --ev-water-light: #5BB8C4;
      --ev-waterfall: rgba(200,230,240,0.35);
      --ev-frog-green: #66BB6A;
      --font-body: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Nunito", sans-serif;
      --font-display: "ZCOOL KuaiLe", "Nunito", "Noto Sans SC", sans-serif;
    }
  
    /* === 语音引导设置面板 === */
    .voice-settings-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 56px);
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .voice-settings-btn:active { transform: scale(0.9); }
    .voice-settings-btn.muted { opacity: 0.5; }
    
    .voice-settings-panel {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 100px);
      right: 12px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      z-index: 101;
      min-width: 200px;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      animation: panelIn 0.2s ease-out;
    }
    .voice-settings-panel.show { display: block; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .voice-settings-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .voice-setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .voice-setting-label {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .voice-toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }
    .voice-toggle.on { background: #4ECDC4; }
    .voice-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
    }
    .voice-toggle.on::after { left: 22px; }

  
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    /* 点击手势 - 在目标位置脉冲 */
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim {
      animation: gestureTap 1.8s ease-in-out infinite;
    }
    /* 拖拽手势 - 从A拖到B */
    @keyframes gestureDragX {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      10% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      70% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); left: var(--drag-to); }
      80% { opacity: 0.8; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      90% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-to); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); left: var(--drag-from); }
    }
    /* 摩擦手势 - 两只手指来回搓 */
    @keyframes gestureRubLeft {
      0%, 100% { transform: translateX(-22px); }
      50% { transform: translateX(22px); }
    }
    @keyframes gestureRubRight {
      0%, 100% { transform: translateX(22px); }
      50% { transform: translateX(-22px); }
    }
    .gesture-rub-left {
      animation: gestureRubLeft 0.6s ease-in-out infinite;
    }
    .gesture-rub-right {
      animation: gestureRubRight 0.6s ease-in-out infinite;
    }
    /* 按住手势 - 手指按下不动 */
    @keyframes gesturePress {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); }
      20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(0.9); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.95); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    }
    .gesture-press-anim {
      animation: gesturePress 2s ease-in-out infinite;
    }
    /* 点击涟漪效果 */
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim {
      animation: gestureRipple 1.8s ease-out infinite;
    }
    /* 滑动方向箭头 */
    @keyframes gestureSlideUp {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(-40px); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
    @keyframes gestureSlideLeft {
      0% { opacity: 0; transform: translateX(20px); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }
      80% { opacity: 0.8; transform: translateX(-40px); }
      100% { opacity: 0; transform: translateX(-60px); }
    }

  
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      cursor: pointer;
      filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5));
      animation: starPulse 2s ease-in-out infinite;
      pointer-events: auto;
      transition: transform 0.2s;
    }
    .star-guide:hover {
      transform: scale(1.15);
    }
    .star-guide:active {
      transform: scale(0.95);
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(242,201,76,0.5)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7)); }
    }
    .star-guide-balloon {
      position: absolute;
      bottom: 50px;
      right: 0;
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      max-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s ease-out;
      pointer-events: none;
    }
    .star-guide-balloon.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .star-guide-balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 14px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.95);
      transform: rotate(45deg);
    }
    /* 飞行路径动画 */
    .star-guide-flying {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-size: 44px;
      filter: drop-shadow(0 6px 20px rgba(242,201,76,0.7));
    }
    @keyframes starFly {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* 目标高亮光环 */
    .star-guide-target-glow {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #F2C94C;
      animation: targetGlow 1.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 9997;
    }
    @keyframes targetGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

  </style>

    .scene-bg::after { content:''; position:absolute; inset:0; background: rgba(0,20,25,0.08); pointer-events: none; }

    /* ===== Trees silhouettes (hidden - using image background) ===== */
    .tree { display: none; }

    /* ===== Waterfall CSS elements (hidden - using image background, but keep curtain for interaction) ===== */
    .waterfall-rock, .waterfall-stream, .waterfall-mist { display: none; }

    /* ===== Frog behind waterfall on river ===== */
    .frog-container { position: absolute; right: 18%; bottom: 28%; width: 120px; height: 120px; z-index: 5; transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .frog-container.hidden-frog { opacity: 0.75; }
    .frog-container.jump-out { animation: frogJump 0.9s cubic-bezier(0.34,1.8,0.64,1) forwards; }
    @keyframes frogJump {
      0% { transform: translate(0,0) scale(1); }
      30% { transform: translate(-60px,-40px) scale(1.15); }
      60% { transform: translate(-100px,-20px) scale(1.2); }
      100% { transform: translate(-130px,10px) scale(1.25); }
    }
    .frog-body { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 90px; filter: drop-shadow(0 6px 15px rgba(0,0,0,0.5)); }
    .water-curtain-overlay { position: absolute; inset: -10% -20%; background: linear-gradient(90deg, transparent 30%, rgba(220,240,245,0.18) 60%, rgba(200,235,245,0.25) 100%); pointer-events: none; border-radius: 40%; }
    .wf-drip { position: absolute; width: 3px; height: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent); border-radius: 2px; animation: drip 1.2s linear infinite; }
    @keyframes drip { 0% { transform: translateY(-20px); opacity: 0; } 20% { opacity: 0.7; } 100% { transform: translateY(80px); opacity: 0; } }

    /* Frog eyes (blinking via eyelid overlay) */
    .frog-body { position: relative; }
    .frog-eyelid { position: absolute; top: 12px; width: 20px; height: 20px; border-radius: 50%; background: #4A8B3F; opacity: 0; transition: opacity 0.08s; z-index: 3; pointer-events: none; }
    .frog-eyelid.left { left: 22px; }
    .frog-eyelid.right { right: 22px; }
    .frog-blink .frog-eyelid { opacity: 1; }
    .frog-smile { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 30px; height: 15px; border-bottom: 3px solid #2D4A30; border-radius: 0 0 50% 50%; opacity: 0; transition: opacity 0.3s; z-index: 3; }
    .frog-happy .frog-smile { opacity: 1; }

    /* ===== Water surface & ripples (transparent - using image background) ===== */
    .water-surface { position: absolute; bottom: 0; left: 0; right: 0; height: 55%; background: transparent; overflow: hidden; z-index: 3; }
    .water-surface::before { display: none; }
    .wave-hint { position: absolute; top: 15%; left: 0; right: 0; text-align: center; color: rgba(212,233,226,0.7); font-size: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); animation: textFloat 2s ease-in-out infinite; pointer-events: none; z-index: 4; }
    @keyframes textFloat { 0%,100% { transform: translateY(0); opacity: 0.7; } 50% { transform: translateY(-4px); opacity: 1; } }

    .ripple-hotspot { position: absolute; width: 60px; height: 60px; transform: translate(-50%, -50%); cursor: pointer; z-index: 6; }
    .ripple-hotspot::before { content:''; position:absolute; inset:0; border-radius:50%; border: 2px solid rgba(253,202,110,0.6); animation: ripplePulse 2s ease-out infinite; }
    .ripple-hotspot::after { content:''; position:absolute; inset:15px; border-radius:50%; background: radial-gradient(circle, rgba(253,202,110,0.3), transparent 70%); }
    .ripple-hotspot .pulse-2 { position:absolute; inset:0; border-radius:50%; border: 2px solid rgba(253,202,110,0.4); animation: ripplePulse 2s ease-out infinite; animation-delay: 0.7s; }
    @keyframes ripplePulse { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }

    .expanding-ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(220,240,245,0.8); pointer-events: none; z-index: 5; animation: rippleExpand 1s ease-out forwards; }
    @keyframes rippleExpand { 0% { width: 0; height: 0; opacity: 0.9; } 100% { width: 120px; height: 40px; opacity: 0; margin-left: -60px; margin-top: -20px; } }

    /* ===== Speech bubbles (呱呱呱) ===== */
    .croak-bubble { position: absolute; background: #fff; color: var(--ev-deep); padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 20px; white-space: nowrap; z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,0.3); animation: bubblePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity: 0; }
    .croak-bubble::after { content:''; position: absolute; bottom: -8px; left: 20px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid #fff; }
    @keyframes bubblePop { 0% { transform: scale(0) translateY(10px); opacity: 0; } 50% { transform: scale(1.15) translateY(-5px); opacity: 1; } 100% { transform: scale(1) translateY(-15px); opacity: 1; } }

    @keyframes starGet { 0% { transform: scale(0.5); } 50% { transform: scale(1.5) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }

    /* ===== Back button ===== */

    .back-btn:active { transform: scale(0.9); }

    /* ===== Hint text top ===== */

    /* ===== Slider puzzle panel ===== */
    .puzzle-panel { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(120%); width: 92%; max-width: 360px; padding: 20px; border-radius: 28px; background: linear-gradient(165deg, rgba(36,58,66,0.95), rgba(20,38,45,0.95)); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(212,233,226,0.15); box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 25; transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; opacity: 0; }

    /* Step dots */
    .step-dots { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); transition: all 0.3s; }
    .step-dot.active { background: var(--ev-gold); border-color: var(--ev-gold); color: #3D2800; box-shadow: 0 0 16px rgba(242,201,76,0.6); transform: scale(1.1); }
    .step-dot.done { background: var(--ev-frog-green); border-color: var(--ev-frog-green); color: #fff; }

    /* Vertical sliders */
    .sliders-row { display: flex; align-items: flex-end; justify-content: center; gap: 18px; margin-bottom: 8px; min-height: 210px; padding: 10px 0; }
    .slider-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .v-slider { position: relative; width: 64px; height: 180px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); overflow: hidden; touch-action: none; cursor: pointer; }
    .v-slider.next-up { border-color: var(--ev-gold); box-shadow: 0 0 20px rgba(242,201,76,0.3); animation: nextGlow 1.2s ease-in-out infinite; }
    @keyframes nextGlow { 0%,100% { box-shadow: 0 0 12px rgba(242,201,76,0.3); } 50% { box-shadow: 0 0 24px rgba(242,201,76,0.6); } }

    .mic-btn:active { transform: scale(0.92); }
    .mic-btn.recording { background: linear-gradient(145deg, #FF7675, #E55353); box-shadow: 0 6px 20px rgba(255,118,117,0.5); animation: micRec 0.6s ease-in-out infinite; }
    @keyframes micRec { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .mic-ring { position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--ev-gold); animation: ringPulse 1.5s ease-out infinite; pointer-events: none; }
    .mic-ring.r2 { animation-delay: 0.5s; }
    @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 0; } }
    .croak-counter { display: flex; gap: 10px; margin-top: 10px; }
    .croak-dot { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.3s; }
    .croak-dot.got { background: linear-gradient(145deg, #66BB6A, #4A9E4E); border-color: #66BB6A; animation: dotPop 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 0 16px rgba(102,187,106,0.5); }
    @keyframes dotPop { 0% { transform: scale(0.4); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* ===== Success overlay ===== */
    .success-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(10,20,25,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .success-overlay.show { opacity: 1; pointer-events: auto; }
    .success-card { background: linear-gradient(165deg, #243A42, #1A2E35); padding: 30px 26px; border-radius: 32px; border: 2px solid var(--ev-gold); box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 60px rgba(242,201,76,0.2); text-align: center; max-width: 320px; width: 90%; transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .success-overlay.show .success-card { transform: scale(1); }
    .success-emoji { font-size: 72px; margin-bottom: 8px; animation: bigSpin 1s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes bigSpin { 0% { transform: scale(0) rotate(-180deg); } 100% { transform: scale(1) rotate(0); } }
    .success-title { font-size: 26px; font-weight: 700; color: var(--ev-gold); margin-bottom: 6px; text-shadow: 0 0 20px rgba(242,201,76,0.4); }
    .success-sub { font-size: 14px; color: rgba(212,233,226,0.8); margin-bottom: 20px; }
    .success-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 999px; background: linear-gradient(135deg, var(--ev-gold), #FF9F43); color: #3D2800; font-size: 16px; font-weight: 700; box-shadow: 0 6px 20px rgba(242,201,76,0.4); transition: transform 0.15s; }
    .success-btn:active { transform: scale(0.95); }

    /* Confetti */
    .confetti-piece { position: absolute; width: 10px; height: 14px; border-radius: 2px; top: -20px; animation: confFall 2.5s ease-in forwards; }
    @keyframes confFall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    /* ===== Frog intro glow after discovery ===== */
    .frog-glow { position: absolute; inset: -20%; border-radius: 50%; background: radial-gradient(circle, rgba(253,202,110,0.4), transparent 60%); animation: glowPulse 1.5s ease-in-out; pointer-events: none; opacity: 0; z-index: 1; }
    @keyframes glowPulse { 0% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1.5); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>

  <!-- ========== GAME LOGIC ========== -->
  <script>
  (function() {
    // ===== Load current player =====
    let currentPlayer = { name: '小探险家', avatar: '⭐' };
    try {
      const raw = localStorage.getItem('starCarnivalDB');
      if (raw) {
        const db = JSON.parse(raw);
        const cid = db.currentPlayerId || localStorage.getItem('currentPlayerId');
        if (cid && db.players) {
          const p = db.players.find(x => x.id === cid);
          if (p) currentPlayer = p;
        }
      }
    } catch(e) {}
    document.getElementById('sbar-av').textContent = currentPlayer.avatar;
    document.getElementById('sbar-nm').textContent = currentPlayer.name;

    // ===== Progress / Navigation constants =====
    const ISLAND_ID = 'echoValley';
    const ISLAND_PAGE = 'echo-valley-v2.html';
    const WORLD_MAP = 'world-map-v2.html';
    const WORLD_MAP_PAGE = 'world-map-v2.html';
    const TOTAL_ANIMALS = 3;
    const ANIMAL_ID = 'frog';
    const ISLAND_ANIMALS = ['frog', 'owl', 'parrot'];

    function getCurrentPlayerId() {
      try {
        const raw = localStorage.getItem('starCarnivalDB');
        if (raw) {
          const db = JSON.parse(raw);
          if (db.currentPlayerId) return db.currentPlayerId;
        }
      } catch(e){}
      return localStorage.getItem('currentPlayerId');
    }

    function getProgress() {
      const cid = getCurrentPlayerId();
      if (!cid) return null;
      const key = 'starCarnival_progress_' + cid;
      let prog = {};
      try { prog = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}
      ['echoValley','bubbleBay','shadowJungle'].forEach(id => {
        if (!prog[id]) prog[id] = { completed: [], gemEarned: false };
        if (!prog[id].completed) prog[id].completed = [];
      });
      if (typeof prog.gems !== 'number') prog.gems = 0;
      if (!prog.unlocked) prog.unlocked = ['echoValley'];
      return prog;
    }

    function saveProgress(prog) {
      const cid = getCurrentPlayerId();
      if (!cid) return;
      localStorage.setItem('starCarnival_progress_' + cid, JSON.stringify(prog));
    }

    function markAnimalCompleted() {
      const prog = getProgress();
      if (!prog) return;
      if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
        prog[ISLAND_ID].completed.push(ANIMAL_ID);
      }
      let g = 0;
      ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
      prog.gems = g;
      saveProgress(prog);
    }

    function navigateAfterRescue() {
      const prog = getProgress();
      if (!prog) {
        document.body.style.transition = 'opacity 0.3s';
        document.body.style.opacity = '0';
        setTimeout(() => { window.location.href = ISLAND_PAGE; }, 300);
        return;
      }
      if (!prog[ISLAND_ID].completed.includes(ANIMAL_ID)) {
        prog[ISLAND_ID].completed.push(ANIMAL_ID);
      }
      let g = 0;
      ['echoValley','bubbleBay','shadowJungle'].forEach(id => { if (prog[id].gemEarned) g++; });
      prog.gems = g;
      
      // Unlock sticker for this animal
      if (!prog.unlockedStickers) prog.unlockedStickers = [];
      if (!prog.unlockedStickers.includes(ANIMAL_ID)) {
        prog.unlockedStickers.push(ANIMAL_ID);
      }
      
      saveProgress(prog);
      const allDone = ISLAND_ANIMALS.every(a => prog[ISLAND_ID].completed.includes(a));
      document.body.style.transition = 'opacity 0.3s';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = allDone ? (WORLD_MAP_PAGE + '?islandComplete=' + ISLAND_ID) : ISLAND_PAGE;
      }, 300);
    }

    function navigateBack() {
      document.body.style.transition = 'opacity 0.25s';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = ISLAND_PAGE; }, 250);
    }

    // ===== Elements =====
    const frog = document.getElementById('frog');
    const frogBody = document.getElementById('frog-body');
    const frogGlow = document.getElementById('frog-glow');
    const frogSmile = document.getElementById('frog-smile');
    const curtain = document.getElementById('curtain');
    const waterSurface = document.getElementById('water-surface');
    const gameHint = document.getElementById('game-hint');
    const puzzlePanel = document.getElementById('puzzle-panel');
    const slidersRow = document.getElementById('sliders-row');
    const stepDots = document.querySelectorAll('.step-dot');
    const micSection = document.getElementById('mic-section');
    const micBtn = document.getElementById('mic-btn');
    const croakDots = document.querySelectorAll('.croak-dot');
    const successOverlay = document.getElementById('success-overlay');
    const successBtn = document.getElementById('success-btn');
    const backBtn = document.querySelector('.back-btn');
    const hintEl = gameHint.querySelector('span');

    // ===== Audio =====
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, dur=0.25, type='sine', vol=0.12) {
      ensureAudio();
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }
    function croakSound(pitch='low') {
      // Frog croak: rapid pitch drop
      ensureAudio();
      if (!audioCtx) return;
      const base = pitch === 'high' ? 320 : pitch === 'mid' ? 220 : 150;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(base * 1.4, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(base * 0.7, audioCtx.currentTime + 0.18);
      g.gain.setValueAtTime(0.10, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.25);
    }
    function chime(freqs) {
      ensureAudio(); if (!audioCtx) return;
      freqs.forEach((f,i) => setTimeout(() => playTone(f, 0.4, 'sine', 0.08), i*100));
    }
    function playRippleSound() {
      ensureAudio(); if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(800, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+0.3);
    }
    function playSuccess() {
      chime([523, 659, 784, 1047]);
    }

    // ===== Game state =====
    const TOTAL_RIPPLES = 4;
    let ripplesClicked = 0;
    let frogDiscovered = false;
    let blinkCount = 0;
    const SEQUENCE = ['low','high','low']; // correct pitch order
    let currentStep = 0;
    let sliderPhase = 'idle'; // idle, active, done
    let micCroaks = 0;
    let isRecording = false;
    let micStream = null;
    let micAnalyser = null;
    let micRAF = null;
    let peakDetected = false;
    let peakCooldown = 0;

    // ===== Ripple interaction =====
    document.querySelectorAll('.ripple-hotspot').forEach(h => {
      h.addEventListener('click', (e) => {
        if (frogDiscovered) return;
        e.stopPropagation();
        ensureAudio();
        playRippleSound();
        ripplesClicked++;

        // Create expanding ripple
        const rect = waterSurface.getBoundingClientRect();
        const r = document.createElement('div');
        r.className = 'expanding-ripple';
        const x = parseFloat(h.style.left);
        const y = parseFloat(h.style.top);
        r.style.left = x + '%';
        r.style.top = y + '%';
        waterSurface.appendChild(r);
        setTimeout(() => r.remove(), 1000);

        // Hide hotspot
        h.style.transition = 'opacity 0.4s, transform 0.4s';
        h.style.opacity = '0';
        h.style.transform = 'translate(-50%,-50%) scale(0.5)';
        setTimeout(() => h.style.display = 'none', 400);

        // Blink frog after each click
        setTimeout(() => blinkFrog(), 200);

        // After 3 ripples, discover the frog
        if (ripplesClicked >= 3 && !frogDiscovered) {
          setTimeout(discoverFrog, 600);
        }
      });
    });

    // Water surface click anywhere also creates ripple
    waterSurface.addEventListener('click', (e) => {
      if (frogDiscovered) return;
      const rect = waterSurface.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      playRippleSound();
      const r = document.createElement('div');
      r.className = 'expanding-ripple';
      r.style.left = x + '%';
      r.style.top = y + '%';
      r.style.borderColor = 'rgba(220,240,245,0.4)';
      waterSurface.appendChild(r);
      setTimeout(() => r.remove(), 1000);
      if (ripplesClicked < 3) {
        ripplesClicked++;
        setTimeout(blinkFrog, 200);
        if (ripplesClicked >= 3) setTimeout(discoverFrog, 600);
      }
    });

    function blinkFrog() {
      frog.classList.add('frog-blink');
      playTone(180 + Math.random()*40, 0.1, 'triangle', 0.05);
      setTimeout(() => frog.classList.remove('frog-blink'), 150);
      blinkCount++;
    }

    function discoverFrog() {
      frogDiscovered = true;
      // Big glow
      frogGlow.style.animation = 'none';
      frogGlow.offsetHeight;
      frogGlow.style.animation = 'glowPulse 1.2s ease-out';
      frogGlow.style.opacity = '1';
      // Frog peeks out - become fully visible
      frog.classList.remove('hidden-frog');
      frog.style.opacity = '1';
      chime([523, 659]);
      // Update hint
      hintEl.innerHTML = '🐸 是小青蛙！它在和你对歌呢~';
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak('是小青蛙！它在和你对歌呢~');
      }
      setTimeout(() => showPuzzlePanel(), 1200);
    }

    function showPuzzlePanel() {
      puzzlePanel.classList.add('visible');
      hintEl.innerHTML = '🎵 按 <em>低→高→低</em> 的顺序拖动石头，和青蛙对歌！';
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak('按低、高、低的顺序拖动石头，和青蛙对歌！');
      }
      setTimeout(() => highlightCurrentSlider(), 500);
    }

    // ===== Vertical sliders with spring physics =====
    const sliders = document.querySelectorAll('.v-slider');
    let activeSlider = null;
    let dragStartY = 0;
    let dragStartPct = 0;
    let currentPct = 0;
    let springAnim = null;

    function highlightCurrentSlider() {
      sliders.forEach((s, i) => {
        s.classList.remove('next-up');
        if (i === currentStep && !s.classList.contains('done')) {
          s.classList.add('next-up');
        }
      });
      stepDots.forEach((d, i) => {
        d.classList.remove('active');
        if (i === currentStep) d.classList.add('active');
      });
    }

    function pctFromY(slider, clientY) {
      const rect = slider.getBoundingClientRect();
      const pct = ((rect.bottom - clientY) / rect.height) * 100;
      return Math.max(0, Math.min(100, pct));
    }

    function setSliderPos(slider, pct) {
      const fill = slider.querySelector('.slider-fill');
      const thumb = slider.querySelector('.slider-thumb');
      fill.style.height = pct + '%';
      thumb.style.bottom = pct + '%';
      thumb.style.transform = 'translate(-50%, 50%)';
      currentPct = pct;
      // Play tone based on pitch+height
      const pitch = slider.dataset.pitch;
      const base = pitch === 'high' ? 320 : 180;
      const freq = base + (pct/100) * (pitch === 'high' ? 250 : 180);
      // Only play on significant moves
      if (!slider._lastFreq || Math.abs(freq - slider._lastFreq) > 15) {
        playTone(freq, 0.08, 'sine', 0.05);
        slider._lastFreq = freq;
      }
    }

    function springBack(slider) {
      // Spring animation: elastic return to 0
      const fill = slider.querySelector('.slider-fill');
      const thumb = slider.querySelector('.slider-thumb');
      let pos = parseFloat(fill.style.height) || 0;
      let vel = 0;
      const stiffness = 0.25;
      const damping = 0.65;
      function step() {
        const force = -pos * stiffness;
        vel = (vel + force) * damping;
        pos += vel;
        fill.style.height = Math.max(0, pos) + '%';
        thumb.style.bottom = Math.max(0, pos) + '%';
        if (Math.abs(vel) > 0.3 || pos > 0.5) {
          springAnim = requestAnimationFrame(step);
        } else {
          fill.style.height = '0%';
          thumb.style.bottom = '0%';
          cancelAnimationFrame(springAnim);
          springAnim = null;
        }
      }
      if (springAnim) cancelAnimationFrame(springAnim);
      springAnim = requestAnimationFrame(step);
    }

    function lockSlider(slider) {
      // Slider stays up with bounce
      slider.classList.remove('next-up');
      slider.classList.add('done');
      const fill = slider.querySelector('.slider-fill');
      const thumb = slider.querySelector('.slider-thumb');
      // Bounce to top
      let pos = parseFloat(fill.style.height) || 0;
      let target = 100;
      let vel = 0;
      function bounce() {
        const diff = target - pos;
        vel += diff * 0.2;
        vel *= 0.7;
        pos += vel;
        fill.style.height = pos + '%';
        thumb.style.bottom = pos + '%';
        if (Math.abs(vel) > 0.5 || Math.abs(diff) > 0.5) {
          requestAnimationFrame(bounce);
        } else {
          fill.style.height = '100%';
          thumb.style.bottom = '100%';
        }
      }
      requestAnimationFrame(bounce);
      // Play croak sound
      croakSound(slider.dataset.pitch);
      // Update step dot
      stepDots.forEach(d => d.classList.remove('active'));
      if (stepDots[currentStep]) {
        stepDots[currentStep].classList.remove('active');
        stepDots[currentStep].classList.add('done');
      }
      // Show croak bubble from frog
      showCroakBubble(currentStep);
      currentStep++;
      if (currentStep >= SEQUENCE.length) {
        // All sliders done!
        setTimeout(onSlidersComplete, 300);
      } else {
        setTimeout(highlightCurrentSlider, 400);
      }
    }

    // Wrong slider: shake + spring back
    function wrongSlider(slider) {
      slider.style.animation = 'none';
      slider.offsetHeight;
      slider.style.animation = 'shakeX 0.4s';
      playTone(120, 0.15, 'square', 0.08);
      springBack(slider);
    }

    // Add shake keyframe
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `@keyframes shakeX { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-4px);} }`;
    document.head.appendChild(shakeStyle);

    function onDragStart(e, slider) {
      if (slider.classList.contains('done')) return;
      if (currentStep >= SEQUENCE.length) return;
      // Only allow dragging the "next-up" slider
      if (!slider.classList.contains('next-up')) {
        wrongSlider(slider);
        return;
      }
      e.preventDefault();
      ensureAudio();
      activeSlider = slider;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartY = clientY;
      dragStartPct = currentPct;
      if (springAnim) { cancelAnimationFrame(springAnim); springAnim = null; }
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('touchend', onDragEnd);
    }
    function onDragMove(e) {
      if (!activeSlider) return;
      e.preventDefault();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const pct = pctFromY(activeSlider, clientY);
      setSliderPos(activeSlider, pct);
    }
    function onDragEnd(e) {
      if (!activeSlider) return;
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
      document.removeEventListener('touchmove', onDragMove);
      document.removeEventListener('touchend', onDragEnd);
      const s = activeSlider;
      const pct = currentPct;
      activeSlider = null;
      // Must drag high enough (>75%) to count
      if (pct > 70) {
        lockSlider(s);
      } else {
        springBack(s);
      }
    }

    sliders.forEach(s => {
      s.addEventListener('mousedown', (e) => onDragStart(e, s));
      s.addEventListener('touchstart', (e) => onDragStart(e, s), { passive: false });
    });

    // ===== Croak bubbles from frog =====
    function showCroakBubble(step) {
      const texts = ['呱！', '呱呱！', '呱呱呱！'];
      const b = document.createElement('div');
      b.className = 'croak-bubble';
      b.textContent = texts[step] || '呱！';
      const rect = frog.getBoundingClientRect();
      const parentRect = document.body.getBoundingClientRect();
      b.style.left = (rect.left - parentRect.left - 20 + (step*15)) + 'px';
      b.style.top = (rect.top - parentRect.top - 20) + 'px';
      document.body.appendChild(b);
      setTimeout(() => {
        b.classList.add('fade-out');
        setTimeout(() => b.remove(), 500);
      }, 1200);
    }

    function onSlidersComplete() {
      hintEl.innerHTML = '🐸 小青蛙跳出来了！长按麦克风学它叫~';
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak('小青蛙跳出来了！长按麦克风，学它呱呱呱叫三声！');
      }
      // Frog jumps out from behind waterfall
      frog.classList.add('jump-out');
      frog.classList.add('frog-happy');
      curtain.style.opacity = '0.3';
      setTimeout(() => {
        // Show mic section
        micSection.style.display = 'flex';
        micSection.style.animation = 'slideUpMic 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';
      }, 700);
    }
    const micSlideStyle = document.createElement('style');
    micSlideStyle.textContent = `@keyframes slideUpMic { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }`;
    document.head.appendChild(micSlideStyle);

    // ===== Microphone =====
    let holdTimer = null;
    let holdStart = 0;
    let peakThreshold = 25; // will be calibrated
    let noiseFloor = 0;

    function startRecording() {
      if (isRecording || micCroaks >= 3) return;
      ensureAudio();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '🔴';
      // Reset cooldown
      peakCooldown = 0;
      peakDetected = false;

      // Try real microphone
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          micStream = stream;
          const src = audioCtx.createMediaStreamSource(stream);
          micAnalyser = audioCtx.createAnalyser();
          micAnalyser.fftSize = 512;
          src.connect(micAnalyser);
          const data = new Uint8Array(micAnalyser.frequencyBinCount);
          function tick() {
            if (!isRecording) return;
            micAnalyser.getByteFrequencyData(data);
            let sum = 0, peak = 0;
            const lowBins = Math.max(8, Math.floor(data.length / 3));
            let lowSum = 0;
            for (let i = 0; i < data.length; i++) {
              sum += data[i];
              if (data[i] > peak) peak = data[i];
              if (i < lowBins) lowSum += data[i];
            }
            const avg = sum / data.length;
            const lowAvg = lowSum / lowBins;
            updateMicVisual(Math.min(1, peak/150));
            // Peak detection — trigger on strong peak OR clear low-freq voice
            if (peakCooldown > 0) { peakCooldown -= 16; }
            if ((peak > 40 || lowAvg > 22) && peakCooldown <= 0) {
              registerCroak();
              peakCooldown = 350; // ms between croaks
            }
            micRAF = requestAnimationFrame(tick);
          }
          tick();
        }).catch(() => {
          // Mic denied - use fallback: hold duration based
          startFallbackRecording();
        });
      } else {
        startFallbackRecording();
      }
    }

    function startFallbackRecording() {
      // Fallback: simulate volume with hold duration, peaks triggered by releasing and pressing again
      let level = 0;
      function fakeTick() {
        if (!isRecording) return;
        level = Math.min(1, level + 0.05 + Math.random()*0.05);
        // Occasional "peak"
        updateMicVisual(level + Math.random()*0.3);
        micRAF = requestAnimationFrame(fakeTick);
      }
      fakeTick();
      // In fallback, register a croak every ~800ms of holding
      holdStart = Date.now();
      holdTimer = setInterval(() => {
        if (isRecording) registerCroak();
      }, 900);
    }

    function updateMicVisual(level) {
      // level 0..1
      const bars = document.querySelectorAll('#mic-visual .mv-bar, #mic-visual-r .mv-bar');
      const heights = [0.2, 0.4, 0.7, 0.4, 0.2];
      bars.forEach((b, i) => {
        const group = i < 5 ? 'l' : 'r';
        const idx = i % 5;
        const h = Math.max(0.1, heights[idx] * (0.3 + level * 1.2));
        b.style.height = (h*100) + '%';
      });
    }

    function registerCroak() {
      if (micCroaks >= 3) return;
      micCroaks++;
      croakSound('mid');
      croakDots[micCroaks-1].classList.add('got');
      // Flash feedback
      micBtn.style.transform = 'scale(0.85)';
      setTimeout(() => micBtn.style.transform = '', 150);
      if (window.VoiceGuide) {
        window.VoiceGuide.speak('呱呱！');
      }
      if (micCroaks >= 3) {
        setTimeout(stopRecording, 300);
        setTimeout(onMicComplete, 500);
      }
    }

    function stopRecording() {
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '<span class="mic-ring"></span><span class="mic-ring r2"></span>🎤';
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (micRAF) { cancelAnimationFrame(micRAF); micRAF = null; }
      if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
      // Reset visual bars
      updateMicVisual(0);
    }

    function onMicComplete() {
      // All done! Success
      playSuccess();
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak('呱呱呱！你学得真像！太棒了！小青蛙成为你的好朋友啦！你真是个勇敢的小探险家！');
      }
      setTimeout(() => {
        // Light up stars
        document.getElementById('star-1').classList.add('got');
        document.getElementById('star-1').classList.remove('dim');
        document.getElementById('star-2').classList.add('got');
        document.getElementById('star-2').classList.remove('dim');
        document.getElementById('star-3').classList.add('got');
        document.getElementById('star-3').classList.remove('dim');
        // Launch confetti
        launchConfetti();
        successOverlay.classList.add('show');
        if (window.VoiceGuide && window.VoiceGuide.speak) {
          setTimeout(function() {
            window.VoiceGuide.speak('获得三颗星光宝石！点击继续探险，去认识更多小动物吧！');
          }, 2000);
        }
      }, 500);
      hintEl.innerHTML = '🎉 太棒了！小青蛙和你做朋友啦！';
    }

    function launchConfetti() {
      const colors = ['#F2C94C','#00B894','#FF7675','#A855F7','#4ECDC4','#FDCB6E'];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('span');
        c.className = 'confetti-piece';
        c.style.left = Math.random()*100 + '%';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay = (Math.random()*0.5) + 's';
        c.style.animationDuration = (2 + Math.random()*1.5) + 's';
        successOverlay.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }

    // Mic button events (long press)
    function onMicDown(e) {
      e.preventDefault();
      startRecording();
    }
    function onMicUp(e) {
      if (isRecording && micCroaks < 3) {
        stopRecording();
        // Reset unearned dots feedback? No, keep earned ones
      }
    }
    micBtn.addEventListener('mousedown', onMicDown);
    micBtn.addEventListener('mouseup', onMicUp);
    micBtn.addEventListener('mouseleave', onMicUp);
    micBtn.addEventListener('touchstart', onMicDown, { passive: false });
    micBtn.addEventListener('touchend', onMicUp);
    micBtn.addEventListener('touchcancel', onMicUp);

    // Success button
    successBtn.addEventListener('click', () => {
      navigateAfterRescue();
    });

    // Back button
    backBtn.addEventListener('click', () => {
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      navigateBack();
    });

    // Water drip particles (add to scene background)
    setInterval(() => {
      if (frogDiscovered) return;
      const drip = document.createElement('span');
      drip.className = 'wf-drip';
      drip.style.left = (70 + Math.random()*20) + '%';
      drip.style.top = (5 + Math.random()*15) + '%';
      drip.style.animationDuration = (1 + Math.random()*0.5) + 's';
      drip.style.position = 'absolute';
      drip.style.zIndex = '2';
      document.querySelector('.scene-bg').appendChild(drip);
      setTimeout(() => drip.remove(), 1500);
    }, 600);
  })();
  </script>

  <script>
  // 语音引导增强：点击文字朗读 + 关键提示自动朗读
  (function() {
    // 等待 VoiceGuide 就绪
    function waitForVoiceGuide(callback) {
      if (window.VoiceGuide) {
        callback();
      } else {
        setTimeout(function() { waitForVoiceGuide(callback); }, 100);
      }
    }
    
    waitForVoiceGuide(function() {
      // 给所有提示类元素添加点击朗读
      function addClickSpeak(selector) {
        var els = document.querySelectorAll(selector);
        els.forEach(function(el) {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function(e) {
            e.stopPropagation();
            var text = el.textContent || el.innerText;
            if (text && text.trim()) {
              window.VoiceGuide.speak(text.trim());
            }
          });
        });
      }
      
      // 常见的提示文字选择器
      var selectors = [
        '#hint-text',
        '#hint-banner',
        '#error-hint-text',
        '#mic-status',
        '#mic-hint',
        '#friction-hint',
        '.hint-text',
        '.tip-text',
        '#gem-title',
        '#gem-subtitle'
      ];
      
      selectors.forEach(function(sel) {
        addClickSpeak(sel);
      });
      
      // 自动朗读初始的 hint-text
      var initialHint = document.querySelector('#hint-text, .hint-text');
      if (initialHint && initialHint.textContent.trim()) {
        setTimeout(function() {
          window.VoiceGuide.speak(initialHint.textContent.trim());
        }, 300);
      }
    });
  })();
  </script>


  <script>
  // 引导手势动画系统
  window.GestureGuide = {
    STORAGE_KEY: 'starlight_gesture_seen',
    
    
    GESTURE_ENABLE_KEY: 'starlight_gesture_enabled',
    
    _enabled: true,
    
    // 检查手势指引是否启用
    isEnabled: function() {
      const v = localStorage.getItem(this.GESTURE_ENABLE_KEY);
      return v !== 'false';
    },
    
    // 设置手势指引启用状态
    setEnabled: function(enabled) {
      this._enabled = enabled;
      localStorage.setItem(this.GESTURE_ENABLE_KEY, enabled ? 'true' : 'false');
    },
    
    // 检查是否已经看过某个手势
    hasSeen: function(id) { {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        return seen[id] === true;
      } catch(e) { return false; }
    },
    
    // 标记已看过
    markSeen: function(id) {
      try {
        var seen = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '{}');
        seen[id] = true;
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(seen));
      } catch(e) {}
    },
    
    // 移除手势
    remove: function(overlay) {
      if (overlay && overlay.parentNode) {
        overlay.style.opacity = '0';
        overlay.style.transition = 'opacity 0.3s';
        setTimeout(function() {
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }
    },
    
    // === 点击手势 ===
    showTap: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'tap_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 手指 emoji
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-tap-anim';
      hand.textContent = '👆';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      // 涟漪
      var ripple = document.createElement('div');
      ripple.className = 'gesture-ripple gesture-ripple-anim';
      ripple.style.left = (rect.left + rect.width / 2) + 'px';
      ripple.style.top = (rect.top + rect.height / 2) + 'px';
      overlay.appendChild(ripple);
      
      document.body.appendChild(overlay);
      
      var self = this;
      var timer = setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      overlay._timer = timer;
      return overlay;
    },
    
    // === 拖拽手势 ===
    showDrag: function(fromEl, toEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'drag_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 4000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var fromRect = fromEl.getBoundingClientRect();
      var toRect = toEl.getBoundingClientRect();
      
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand';
      hand.textContent = '👆';
      hand.style.fontSize = opts.size || '72px';
      hand.style.position = 'absolute';
      hand.style.top = (fromRect.top + fromRect.height / 2) + 'px';
      hand.style.left = (fromRect.left + fromRect.width / 2) + 'px';
      hand.style.opacity = '0';
      hand.style.transform = 'translate(-50%,-50%)';
      hand.style.transition = 'none';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      // 动画序列：出现→拖到目标→放下→消失
      var steps = [
        { t: 0,    opacity: 0,   x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1.3 },
        { t: 300,  opacity: 1, x: fromRect.left + fromRect.width/2, y: fromRect.top + fromRect.height/2, scale: 1 },
        { t: 1800, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 2200, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 0.85 },
        { t: 2500, opacity: 1, x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
        { t: 3000, opacity: 0,   x: toRect.left + toRect.width/2, y: toRect.top + toRect.height/2, scale: 1 },
      ];
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        // 找到当前所在的两个关键帧
        var prev = steps[0], next = steps[steps.length - 1];
        for (var i = 0; i < steps.length - 1; i++) {
          if (elapsed >= steps[i].t && elapsed < steps[i+1].t) {
            prev = steps[i]; next = steps[i+1]; break;
          }
        }
        if (elapsed >= steps[steps.length-1].t) {
          prev = next = steps[steps.length-1];
        }
        
        var progress = (next.t === prev.t) ? 1 : (elapsed - prev.t) / (next.t - prev.t);
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = prev.x + (next.x - prev.x) * ease;
        var curY = prev.y + (next.y - prev.y) * ease;
        var curOp = prev.opacity + (next.opacity - prev.opacity) * ease;
        var curScale = prev.scale + (next.scale - prev.scale) * ease;
        
        hand.style.left = curX + 'px';
        hand.style.top = curY + 'px';
        hand.style.opacity = curOp;
        hand.style.transform = 'translate(-50%,-50%) scale(' + curScale + ')';
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 双指摩擦手势 ===
    showRub: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'rub_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3500;
      var cycles = opts.cycles || 3;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 左手
      var handL = document.createElement('div');
      handL.className = 'gesture-hand';
      handL.textContent = '👆';
      handL.style.fontSize = '64px';
      handL.style.position = 'absolute';
      handL.style.top = (rect.top + rect.height / 2 - 10) + 'px';
      handL.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      handL.style.opacity = '0.9';
      handL.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handL);
      
      // 右手
      var handR = document.createElement('div');
      handR.className = 'gesture-hand';
      handR.textContent = '👆';
      handR.style.fontSize = '64px';
      handR.style.position = 'absolute';
      handR.style.top = (rect.top + rect.height / 2 + 10) + 'px';
      handR.style.left = (rect.left + rect.width / 2 + 20) + 'px';
      handR.style.opacity = '0.9';
      handR.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(handR);
      
      document.body.appendChild(overlay);
      
      // 来回搓动
      var rubDuration = 600; // 每次来回 600ms
      var totalRubTime = rubDuration * cycles;
      var startTime = null;
      var fadeStart = totalRubTime + 500;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        
        if (elapsed < totalRubTime) {
          // 搓动阶段
          var phase = (elapsed % rubDuration) / rubDuration;
          var offset = Math.sin(phase * Math.PI * 2) * 26;
          handL.style.transform = 'translate(calc(-50% + ' + (-offset) + 'px), -50%)';
          handR.style.transform = 'translate(calc(-50% + ' + offset + 'px), -50%)';
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else if (elapsed < fadeStart) {
          // 搓完停留
          handL.style.opacity = '0.9';
          handR.style.opacity = '0.9';
        } else {
          // 淡出
          var fadeProgress = (elapsed - fadeStart) / (duration - fadeStart);
          var fadeOp = Math.max(0, 0.65 * (1 - fadeProgress));
          handL.style.opacity = fadeOp;
          handR.style.opacity = fadeOp;
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    },
    
    // === 按住手势 ===
    showPress: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'press_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      var hand = document.createElement('div');
      hand.className = 'gesture-hand gesture-press-anim';
      hand.textContent = '👇';
      hand.style.left = (rect.left + rect.width / 2) + 'px';
      hand.style.top = (rect.top + rect.height / 2) + 'px';
      hand.style.fontSize = opts.size || '80px';
      overlay.appendChild(hand);
      
      document.body.appendChild(overlay);
      
      var self = this;
      setTimeout(function() {
        self.remove(overlay);
        if (once) self.markSeen(id);
        if (onComplete) onComplete();
      }, duration);
      
      return overlay;
    },
    
    // === 喊叫手势 ===
    showShout: function(targetEl, options) {
      if (!this.isEnabled()) return null;
      
      var opts = options || {};
      var id = opts.id || 'shout_' + Date.now();
      var once = opts.once !== false;
      var duration = opts.duration || 3000;
      var onComplete = opts.onComplete;
      
      if (once && this.hasSeen(id)) return null;
      
      var rect = targetEl.getBoundingClientRect();
      var overlay = document.createElement('div');
      overlay.className = 'gesture-overlay';
      
      
      // 嘴巴 emoji 靠近麦克风
      var mouth = document.createElement('div');
      mouth.className = 'gesture-hand';
      mouth.textContent = '📢';
      mouth.style.left = (rect.left + rect.width / 2) + 'px';
      mouth.style.top = (rect.top - 40) + 'px';
      mouth.style.fontSize = '64px';
      mouth.style.opacity = '0';
      mouth.style.transform = 'translate(-50%,-50%)';
      overlay.appendChild(mouth);
      
      // 声波效果
      for (var i = 1; i <= 3; i++) {
        var wave = document.createElement('div');
        wave.style.position = 'absolute';
        wave.style.left = (rect.left + rect.width / 2) + 'px';
        wave.style.top = (rect.top - 20) + 'px';
        wave.style.width = (20 + i * 15) + 'px';
        wave.style.height = (20 + i * 15) + 'px';
        wave.style.borderRadius = '50%';
        wave.style.border = '2px solid rgba(242,201,76,0.4)';
        wave.style.opacity = '0';
        wave.style.transform = 'translate(-50%,-50%)';
        wave.style.pointerEvents = 'none';
        wave._delay = i * 200;
        wave._index = i;
        overlay.appendChild(wave);
      }
      
      document.body.appendChild(overlay);
      
      var startTime = null;
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = elapsed / duration;
        
        // 嘴巴淡入淡出
        if (progress < 0.15) {
          mouth.style.opacity = (progress / 0.15) * 0.7;
        } else if (progress < 0.8) {
          mouth.style.opacity = '1';
        } else {
          mouth.style.opacity = Math.max(0, 0.7 * (1 - (progress - 0.8) / 0.2));
        }
        
        // 声波扩散
        var children = overlay.children;
        for (var i = 1; i < children.length; i++) {
          var w = children[i];
          if (!w._delay) continue;
          var wElapsed = elapsed - w._delay;
          if (wElapsed > 0 && wElapsed < 1500) {
            var wProgress = (wElapsed % 800) / 800;
            w.style.opacity = Math.max(0, 0.4 * (1 - wProgress));
            var wScale = 1 + wProgress * 1.5;
            w.style.transform = 'translate(-50%,-50%) scale(' + wScale + ')';
          } else {
            w.style.opacity = '0';
          }
        }
        
        if (elapsed < duration) {
          requestAnimationFrame(animate);
        } else {
          GestureGuide.remove(overlay);
          if (once) GestureGuide.markSeen(id);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animate);
      
      return overlay;
    }
  };
  </script>

  <script>
  (function() {
    const STORAGE_KEY = 'starlight_voice_guide';
    const synth = window.speechSynthesis;
    
    function isVoiceGuideEnabled() {
      const v = localStorage.getItem(STORAGE_KEY);
      return v !== 'false';
    }
    
    function setVoiceGuideEnabled(enabled) {
      localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
      updateBtnIcon();
      if (enabled) {
        speakGuide('语音引导已开启');
      }
    }
    
    function updateBtnIcon() {
      const btn = document.getElementById('voice-settings-btn');
      if (!btn) return;
      if (isVoiceGuideEnabled()) {
        btn.textContent = '🔊';
        btn.classList.remove('muted');
      } else {
        btn.textContent = '🔇';
        btn.classList.add('muted');
      }
    }
    
    let currentUtterance = null;
    
    function stopSpeak() {
      if (synth && synth.speaking) {
        synth.cancel();
      }
      currentUtterance = null;
    }
    
    function speakGuide(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      if (!text || !text.trim()) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = opts.rate || 0.9;
      utter.pitch = opts.pitch || 1.3;
      utter.volume = opts.volume || 1;
      
      const voices = synth.getVoices();
      const zhVoice = voices.find(function(v) {
        return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
      });
      if (zhVoice) utter.voice = zhVoice;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    function speakEn(text, options) {
      if (!isVoiceGuideEnabled()) return;
      if (!synth) return;
      
      stopSpeak();
      
      const opts = options || {};
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = opts.rate || 0.8;
      utter.pitch = opts.pitch || 1.2;
      utter.volume = opts.volume || 1;
      
      currentUtterance = utter;
      synth.speak(utter);
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('voice-settings-btn');
      const panel = document.getElementById('voice-settings-panel');
      const toggle = document.getElementById('voice-guide-toggle');
      const gestureToggle = document.getElementById('gesture-guide-toggle');
      const resetBtn = document.getElementById('reset-gesture-btn');
      
      updateBtnIcon();
      if (isVoiceGuideEnabled()) {
        if (toggle) toggle.classList.add('on');
      } else {
        if (toggle) toggle.classList.remove('on');
      }
      
      if (localStorage.getItem('starlight_gesture_enabled') !== 'false') {
        if (gestureToggle) gestureToggle.classList.add('on');
      } else {
        if (gestureToggle) gestureToggle.classList.remove('on');
      }
      
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (panel) panel.classList.toggle('show');
        });
      }
      
      document.addEventListener('click', function(e) {
        if (panel && !panel.contains(e.target) && e.target !== btn) {
          panel.classList.remove('show');
        }
      });
      
      if (toggle) {
        toggle.addEventListener('click', function() {
          const enabled = !isVoiceGuideEnabled();
          setVoiceGuideEnabled(enabled);
          if (enabled) {
            toggle.classList.add('on');
          } else {
            toggle.classList.remove('on');
          }
        });
      }
      
      if (gestureToggle) {
        gestureToggle.addEventListener('click', function() {
          const enabled = localStorage.getItem('starlight_gesture_enabled') !== 'false';
          localStorage.setItem('starlight_gesture_enabled', enabled ? 'false' : 'true');
          if (!enabled) {
            gestureToggle.classList.add('on');
          } else {
            gestureToggle.classList.remove('on');
          }
          if (window.GestureGuide && window.GestureGuide.setEnabled) {
            window.GestureGuide.setEnabled(!enabled);
          }
        });
      }
      
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          try {
            localStorage.removeItem('starlight_gesture_seen');
            alert('手势演示已重置！刷新页面即可重新看到引导动画。');
          } catch(e) {}
        });
      }
      
      if (synth) {
        synth.getVoices();
        window.addEventListener('voiceschanged', function() {
          synth.getVoices();
        });
      }
    });
    
    window.VoiceGuide = {
      speak: speakGuide,
      speakEn: speakEn,
      stop: stopSpeak,
      isEnabled: isVoiceGuideEnabled
    };
  })();
  </script>

  <script>
  // 小星星向导系统
  window.StarGuide = {
    container: null,
    star: null,
    balloon: null,
    currentStep: 0,
    idleTimer: null,
    idleTimeout: 3000,
    isFlying: false,
    targetGlow: null,
    
    shownSteps: [],
    // 每个页面的引导步骤配置
    steps: [],
    
    init: function(stepsConfig) {
      this.container = document.getElementById('star-guide-container');
      this.star = document.getElementById('star-guide');
      this.balloon = document.getElementById('star-guide-balloon');
      this.steps = stepsConfig || [];
      this.currentStep = 0;
      
      this.shownSteps = [];
      if (!this.container || !this.star || !this.balloon) return;
      
      var self = this;
      
      // 星星点击事件
      this.star.addEventListener('click', function() {
        self.showCurrentStep();
      });
      
      // 监听用户操作（重置空闲计时器）
      document.addEventListener('mousedown', function() { self.resetIdleTimer(); });
      document.addEventListener('touchstart', function() { self.resetIdleTimer(); });
      document.addEventListener('pointerdown', function() { self.resetIdleTimer(); });
      
      // 启动空闲检测
      this.startIdleTimer();
      
      // 页面加载完成后，延迟显示星星
      setTimeout(function() {
        self.container.classList.remove('hidden');
      }, 500);
    },
    
    startIdleTimer: function() {
      var self = this;
      this.idleTimer = setTimeout(function() {
        self.onIdle();
      }, this.idleTimeout);
    },
    
    resetIdleTimer: function() {
      if (this.idleTimer) {
        clearTimeout(this.idleTimer);
      }
      this.startIdleTimer();
      // 隐藏气球
      this.hideBalloon();
    },
    
    onIdle: function() {
      if (this.isFlying) return;
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      // 如果步骤需要等待某个条件，则检查
      if (step.condition && !step.condition()) {
        this.startIdleTimer();
        return;
      }

      // 如果本步骤已经展示过，跳过（避免语音重复覆盖教学）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) {
        this.startIdleTimer();
        return;
      }

      
      this.showCurrentStep();

    },
    
    showCurrentStep: function() {
      if (this.currentStep >= this.steps.length) return;
      
      var step = this.steps[this.currentStep];
      if (!step) return;
      
      var self = this;
      
      // 已展示过的步骤不再朗读（用户点星星时跳过）
      if ((this.shownSteps && this.shownSteps.indexOf(this.currentStep) !== -1)) return;
      // 如果有目标元素，飞过去
      if (step.target) {
        var targetEl = typeof step.target === 'string' 
          ? document.querySelector(step.target) 
          : step.target;
        
        if (targetEl) {
          this.flyTo(targetEl, function() {
                        // 记录已展示的步骤，防止重复朗读
            var shownSteps = self.shownSteps || (self.shownSteps = []);
            if (shownSteps.indexOf(self.currentStep) === -1) {
              shownSteps.push(self.currentStep);
            }
            self.speak(step.speak || step.text || '看！那里有一个发光的圈圈，点一下试试！');
            self.showBalloon(step.text || '点一下试试！');
            self.highlightTarget(targetEl);
          });
        } else {
          // 找不到目标，直接显示提示
          this.speak(step.speak || step.text);
          this.showBalloon(step.text);
        }
      } else {
        // 没有目标，直接显示提示
        this.speak(step.speak || step.text);
        this.showBalloon(step.text);
      }
    },
    
    flyTo: function(targetEl, callback) {
      this.isFlying = true;
      
      var self = this;
      var starRect = this.star.getBoundingClientRect();
      var targetRect = targetEl.getBoundingClientRect();
      
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      var endX = targetRect.left + targetRect.width / 2;
      var endY = targetRect.top + targetRect.height / 2 - 40;
      
      // 创建飞行中的星星克隆体
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      // 隐藏原星星
      this.container.classList.add('hidden');
      
      // 飞行动画
      var duration = 800;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        // 缓动函数
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          // 动画结束，移除飞行星星，显示原星星在目标位置
          document.body.removeChild(flyingStar);
          
          // 将原星星移到目标位置
          self.container.style.position = 'fixed';
          self.container.style.left = (endX - 30) + 'px';
          self.container.style.top = (endY - 30) + 'px';
          self.container.style.right = 'auto';
          self.container.style.bottom = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
          if (callback) callback();
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    returnToCorner: function() {
      if (this.isFlying) return;
      
      var self = this;
      
      // 创建飞行中的星星克隆体
      var starRect = this.star.getBoundingClientRect();
      var startX = starRect.left + starRect.width / 2;
      var startY = starRect.top + starRect.height / 2;
      
      var endX = window.innerWidth - 54;
      var endY = window.innerHeight - 54;
      
      var flyingStar = document.createElement('div');
      flyingStar.className = 'star-guide-flying';
      flyingStar.textContent = '⭐';
      flyingStar.style.left = startX + 'px';
      flyingStar.style.top = startY + 'px';
      flyingStar.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(flyingStar);
      
      this.container.classList.add('hidden');
      this.isFlying = true;
      
      var duration = 600;
      var startTime = null;
      
      function animate(now) {
        if (!startTime) startTime = now;
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        
        var ease = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
        
        var curX = startX + (endX - startX) * ease;
        var curY = startY + (endY - startY) * ease;
        
        flyingStar.style.left = curX + 'px';
        flyingStar.style.top = curY + 'px';
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          document.body.removeChild(flyingStar);
          
          self.container.style.position = 'fixed';
          self.container.style.right = '24px';
          self.container.style.bottom = '24px';
          self.container.style.left = 'auto';
          self.container.style.top = 'auto';
          self.container.classList.remove('hidden');
          
          self.isFlying = false;
        }
      }
      
      requestAnimationFrame(animate);
    },
    
    showBalloon: function(text) {
      if (!this.balloon) return;
      this.balloon.textContent = text;
      this.balloon.classList.add('show');
      
      // 3秒后自动隐藏
      setTimeout(function() {
        this.hideBalloon();
      }.bind(this), 3500);
    },
    
    hideBalloon: function() {
      if (!this.balloon) return;
      this.balloon.classList.remove('show');
    },
    
    highlightTarget: function(targetEl) {
      // 移除旧的光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
      }
      
      var rect = targetEl.getBoundingClientRect();
      this.targetGlow = document.createElement('div');
      this.targetGlow.className = 'star-guide-target-glow';
      this.targetGlow.style.left = (rect.left - 8) + 'px';
      this.targetGlow.style.top = (rect.top - 8) + 'px';
      this.targetGlow.style.width = (rect.width + 16) + 'px';
      this.targetGlow.style.height = (rect.height + 16) + 'px';
      
      document.body.appendChild(this.targetGlow);
      
      // 3秒后移除光环
      setTimeout(function() {
        if (this.targetGlow && this.targetGlow.parentNode) {
          this.targetGlow.parentNode.removeChild(this.targetGlow);
          this.targetGlow = null;
        }
      }.bind(this), 3500);
    },
    
    speak: function(text) {
      if (window.VoiceGuide && window.VoiceGuide.speak) {
        window.VoiceGuide.speak(text);
      }
    },
    
    nextStep: function() {
      // 清除目标光环
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      
      this.hideBalloon();
      this.currentStep++;
      
      // 返回角落
      setTimeout(function() {
        this.returnToCorner();
        
        // 重新启动空闲检测
        setTimeout(function() {
          this.startIdleTimer();
        }.bind(this), 1000);
      }.bind(this), 500);
    },
    
    reset: function() {
      this.currentStep = 0;
      this.returnToCorner();
      this.hideBalloon();
      if (this.targetGlow && this.targetGlow.parentNode) {
        this.targetGlow.parentNode.removeChild(this.targetGlow);
        this.targetGlow = null;
      }
      this.startIdleTimer();
    }
  };
  </script>

    { target: '.v-slider.next-up', condition: function() { var ms = document.getElementById('mic-section'); return document.getElementById('puzzle-panel').classList.contains('visible') && (!ms || window.getComputedStyle(ms).display !== 'flex'); }, text: '拖动这个石头，和小青蛙对歌！', speak: '拖动这个石头，和小青蛙对歌！按低、高、低的顺序！' },
    { target: '#mic-btn', condition: function() { var ms = document.getElementById('mic-section'); return ms && window.getComputedStyle(ms).display === 'flex' && !document.getElementById('success-overlay').classList.contains('show'); }, text: '长按麦克风，学青蛙呱呱叫三声！', speak: '长按麦克风，学青蛙呱呱叫三声！' },
    { target: '#success-btn', condition: function() { return document.getElementById('success-overlay').classList.contains('show'); }, text: '太棒了！点击继续探险吧！', speak: '太棒了！点击继续探险吧！' }
    
        ]);
      } else {

    }
    if (document.readyState === 'loading') {

    } else {

  })();
