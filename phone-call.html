<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>给朋友打电话</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --star-gold: #FDCB6E;
  --star-dark: #0B0C10;
  --star-purple: #6C5CE7;
  --star-blue: #45A29E;
  --star-light: #C5C6C7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', 'PingFang SC', sans-serif;
  background: radial-gradient(ellipse at top, #1a1a3e 0%, #0B0C10 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
}

.stars-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}
.back-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
.header-title {
  font-size: 18px;
  font-weight: 800;
  text-shadow: 0 0 20px rgba(253,203,110,0.5);
}

.main-content {
  padding: calc(env(safe-area-inset-top, 0px) + 70px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  max-width: 420px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.call-status {
  text-align: center;
  margin-bottom: 24px;
}
.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #4ECDC4;
  display: inline-block;
  animation: pulseGreen 1.5s ease-in-out infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes pulseGreen {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}
.status-text {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
  font-weight: 600;
}

.animal-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 0;
}

.animal-avatar {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), rgba(69,162,158,0.2) 60%, rgba(69,162,158,0.08));
  border: 4px solid rgba(253,203,110,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  box-shadow: 0 0 30px rgba(253,203,110,0.3), 0 8px 32px rgba(0,0,0,0.4);
  margin-bottom: 16px;
  transition: transform 0.3s;
}
.animal-avatar.wiggle {
  animation: wiggle 0.5s ease-in-out;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-10deg); }
  75% { transform: rotate(10deg); }
}
.animal-name {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 15px rgba(253,203,110,0.4);
  margin-bottom: 8px;
}
.animal-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}

.chat-bubble-container {
  width: 100%;
  margin-bottom: 24px;
}

.bubble {
  max-width: 85%;
  padding: 16px 20px;
  border-radius: 24px;
  position: relative;
  animation: bubblePop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes bubblePop {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.bubble.animal {
  background: linear-gradient(135deg, rgba(253,203,110,0.2) 0%, rgba(253,203,110,0.1) 100%);
  border: 2px solid rgba(253,203,110,0.4);
  color: #fff;
  margin-left: auto;
  margin-right: 0;
}
.bubble.animal::after {
  content: '';
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  background: rgba(253,203,110,0.2);
  border-right: 2px solid rgba(253,203,110,0.4);
  border-bottom: 2px solid rgba(253,203,110,0.4);
  transform: translateY(-50%) rotate(45deg);
}

.bubble.player {
  background: linear-gradient(135deg, rgba(78,205,196,0.2) 0%, rgba(78,205,196,0.1) 100%);
  border: 2px solid rgba(78,205,196,0.4);
  color: #fff;
  margin-left: 0;
  margin-right: auto;
}
.bubble.player::after {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  background: rgba(78,205,196,0.2);
  border-left: 2px solid rgba(78,205,196,0.4);
  border-bottom: 2px solid rgba(78,205,196,0.4);
  transform: translateY(-50%) rotate(-45deg);
}

.bubble-text {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
}

.answer-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.answer-btn {
  width: 100%;
  padding: 16px 20px;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.answer-btn:active {
  transform: scale(0.98);
  background: rgba(255,255,255,0.1);
  border-color: rgba(78,205,196,0.5);
}
.answer-btn:hover {
  border-color: rgba(78,205,196,0.4);
}
.answer-btn .emoji {
  font-size: 20px;
}

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 12px 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  max-width: fit-content;
  margin-left: auto;
}
.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(253,203,110,0.6);
  animation: typingBounce 1.4s infinite ease-in-out;
}
.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes typingBounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* === 拨号界面 === */
.dial-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.dial-screen.hidden { display: none !important; }
.call-screen.hidden { display: none !important; }
.hang-up-btn.hidden { display: none !important; }

.dial-title {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
  text-align: center;
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(253,203,110,0.5);
}
.dial-subtitle {
  font-size: 15px;
  color: rgba(255,255,255,0.6);
  text-align: center;
  margin-bottom: 48px;
}
.dial-phone-icon {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(78,205,196,0.3), rgba(78,205,196,0.15) 60%, rgba(78,205,196,0.05));
  border: 4px solid rgba(78,205,196,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  box-shadow: 0 0 40px rgba(78,205,196,0.3), 0 8px 32px rgba(0,0,0,0.4);
  margin-bottom: 40px;
  animation: phonePulse 2s ease-in-out infinite;
}
@keyframes phonePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(78,205,196,0.3), 0 8px 32px rgba(0,0,0,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(78,205,196,0.5), 0 8px 40px rgba(0,0,0,0.5); }
}
.dial-btn {
  width: 200px;
  height: 72px;
  border-radius: 36px;
  background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
  border: none;
  color: white;
  font-size: 22px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(78,205,196,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.2s;
  animation: btnGlow 2s ease-in-out infinite;
}
.dial-btn:active { transform: scale(0.95); }
@keyframes btnGlow {
  0%, 100% { box-shadow: 0 6px 30px rgba(78,205,196,0.4); }
  50% { box-shadow: 0 6px 40px rgba(78,205,196,0.6), 0 0 20px rgba(78,205,196,0.3); }
}
.dial-btn-icon { font-size: 28px; }
.animal-friends-preview {
  display: flex;
  gap: 12px;
  margin-top: 32px;
  flex-wrap: wrap;
  justify-content: center;
}
.friend-preview {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

/* === 通话界面状态切换 === */
.call-status.idle .status-dot {
  background: rgba(255,255,255,0.3);
  animation: none;
}
.call-status.idle .status-text {
  color: rgba(255,255,255,0.4);
}
.call-status.calling .status-dot {
  background: #FDCA6E;
  animation: pulseYellow 1s ease-in-out infinite;
}
@keyframes pulseYellow {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}
.call-status.calling .status-text { color: #FDCA6E; }

.hang-up-btn {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  right: 16px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(255,107,107,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 50;
}
.hang-up-btn:active { transform: scale(0.9); }

/* 语音设置 */
.voice-settings-btn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 70px);
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  cursor: pointer;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
.voice-settings-btn:active { transform: scale(0.9); }
.voice-settings-btn.muted { opacity: 0.5; }

.voice-settings-panel {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 114px);
  right: 12px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 16px;
  z-index: 101;
  min-width: 200px;
  border: 1px solid rgba(255,255,255,0.15);
  display: none;
}
.voice-settings-panel.show { display: block; animation: panelIn 0.2s ease-out; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.voice-settings-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}
.voice-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.voice-setting-label {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}
.voice-toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  padding: 0;
}
.voice-toggle.on { background: #4ECDC4; }
.voice-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: left 0.2s;
}
.voice-toggle.on::after { left: 22px; }
    /* === 引导手势动画系统 === */
    .gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gesture-hand {
      position: absolute;
      font-size: 80px;
      opacity: 0;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(255,255,255,0.5));
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes gestureTap {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      40% { opacity: 1; transform: translate(-50%,-50%) scale(0.95); }
      60% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
      80% { opacity: 0.9; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
    }
    .gesture-tap-anim { animation: gestureTap 1.8s ease-in-out infinite; }
    @keyframes gestureRipple {
      0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0.8; }
      100% { transform: translate(-50%,-50%) scale(3); opacity: 0; }
    }
    .gesture-ripple {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 4px solid rgba(255,200,60,0.9);
      pointer-events: none;
      z-index: 9999;
    }
    .gesture-ripple-anim { animation: gestureRipple 1.8s ease-out infinite; }
    /* === 小星星向导 === */
    .star-guide-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9998;
      pointer-events: none;
      transition: transform 0.3s;
    }
    .star-guide-container.hidden {
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .star-guide {
      width: 60px; height: 60px;
      background: radial-gradient(circle at 30% 30%, #FFF4B8, #FFD700);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      animation: starBounce 2s ease-in-out infinite;
      position: relative;
    }
    .star-guide::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(255,215,0,0.4);
      animation: starRotate 8s linear infinite;
    }
    @keyframes starBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes starRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .star-guide-bubble {
      position: absolute;
      bottom: 70px;
      right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px 14px 4px 14px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 220px;
      white-space: normal;
      line-height: 1.4;
    }
    .star-guide-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .star-guide-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 20px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(0,0,0,0.85);
    }
  </style>
</head>
<body>
  <div class="stars-bg" id="stars-bg"></div>
  
  <header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h1 class="header-title">📞 给朋友打电话</h1>
    <div class="call-status idle" id="call-status">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">准备通话</span>
    </div>
  </header>
  
  <main class="main-content">
    <!-- 拨号界面 -->
    <div class="dial-screen" id="dial-screen">
      <div class="dial-phone-icon">📱</div>
      <div class="dial-title">给动物朋友打电话</div>
      <div class="dial-subtitle">打个电话，和小动物聊聊天吧！</div>
      <button class="dial-btn" id="call-btn" onclick="makeCall()">
        <span class="dial-btn-icon">📞</span>
        <span>拨打电话</span>
      </button>
      <div class="animal-friends-preview">
        <div class="friend-preview">🦜</div>
        <div class="friend-preview">🦉</div>
        <div class="friend-preview">🐸</div>
        <div class="friend-preview">🐠</div>
        <div class="friend-preview">🐙</div>
        <div class="friend-preview">🐢</div>
        <div class="friend-preview">🐒</div>
      </div>
    </div>
    
    <!-- 通话界面 -->
    <div class="call-screen hidden" id="call-screen">
      <div class="animal-area">
        <div class="animal-avatar" id="animal-avatar">🦜</div>
        <div class="animal-name" id="animal-name">小鹦鹉</div>
        <div class="animal-subtitle" id="animal-subtitle">回声谷的好朋友</div>
      </div>
      
      <div class="chat-bubble-container" id="chat-container">
      </div>
      
      <div class="answer-buttons" id="answer-buttons">
      </div>
    </div>
  </main>
  
  <button class="hang-up-btn hidden" id="hang-up-btn" onclick="hangUp()">📞</button>

  <!-- 语音设置 -->
  <button class="voice-settings-btn" id="voice-settings-btn" onclick="toggleVoiceSettings()">🔊</button>
  <div class="voice-settings-panel" id="voice-settings-panel">
    <div class="voice-settings-title">语音设置</div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">语音引导</span>
      <button class="voice-toggle on" id="voice-toggle" onclick="toggleVoiceGuide()"></button>
    </div>
    <div class="voice-setting-row">
      <span class="voice-setting-label">手势指引</span>
      <button id="gesture-toggle" class="voice-toggle on" aria-label="手势指引开关"></button>
    </div>
    <div class="voice-setting-row" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 8px; padding-top: 12px;">
      <span class="voice-setting-label">重置手势演示</span>
      <button id="reset-gesture-btn" style="background: rgba(255,200,60,0.3); border: 1px solid rgba(255,200,60,0.5); color: #FFC048; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">重置</button>
    </div>
  </div>

  <script>
// ========== VoiceGuide 系统 ==========
(function() {
  const STORAGE_KEY = 'starlight_voice_guide';
  const synth = window.speechSynthesis || null;

  function isVoiceGuideEnabled() {
    const v = localStorage.getItem(STORAGE_KEY);
    return v !== 'false';
  }

  function setVoiceGuideEnabled(enabled) {
    localStorage.setItem(STORAGE_KEY, enabled ? 'true' : 'false');
    updateBtnIcon();
    if (enabled) {
      speakGuide('语音引导已开启');
    }
  }

  function updateBtnIcon() {
    const btn = document.getElementById('voice-settings-btn');
    if (!btn) return;
    if (isVoiceGuideEnabled()) {
      btn.textContent = '🔊';
      btn.classList.remove('muted');
    } else {
      btn.textContent = '🔇';
      btn.classList.add('muted');
    }
  }

  let currentUtterance = null;

  function stopSpeak() {
    if (synth && synth.speaking) {
      synth.cancel();
    }
    currentUtterance = null;
  }

  function speakGuide(text, options) {
    if (!isVoiceGuideEnabled()) return;
    if (!synth) return;
    if (!text || !text.trim()) return;

    stopSpeak();

    const opts = options || {};
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = opts.rate || 0.9;
    utter.pitch = opts.pitch || 1.3;
    utter.volume = opts.volume || 1;

    const voices = synth.getVoices();
    const zhVoice = voices.find(function(v) {
      return v.lang && v.lang.toLowerCase().indexOf('zh') === 0;
    });
    if (zhVoice) utter.voice = zhVoice;

    currentUtterance = utter;
    synth.speak(utter);
  }

  function speakEn(text, options) {
    if (!isVoiceGuideEnabled()) return;
    if (!synth) return;
    if (!text || !text.trim()) return;

    stopSpeak();

    const opts = options || {};
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = opts.rate || 0.8;
    utter.pitch = opts.pitch || 1.2;
    utter.volume = opts.volume || 1;

    currentUtterance = utter;
    synth.speak(utter);
  }

  const GESTURE_KEY = 'starlight_gesture_enabled';

  function isGestureGuideEnabled() {
    const v = localStorage.getItem(GESTURE_KEY);
    return v !== 'false';
  }

  function setGestureGuideEnabled(enabled) {
    localStorage.setItem(GESTURE_KEY, enabled ? 'true' : 'false');
    if (window.GestureGuide) {
      window.GestureGuide.setEnabled(enabled);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('voice-settings-btn');
    const panel = document.getElementById('voice-settings-panel');
    const toggle = document.getElementById('voice-toggle');
    const gestureToggle = document.getElementById('gesture-toggle');
    const resetBtn = document.getElementById('reset-gesture-btn');

    updateBtnIcon();
    if (isVoiceGuideEnabled()) {
      if (toggle) toggle.classList.add('on');
    } else {
      if (toggle) toggle.classList.remove('on');
    }

    if (isGestureGuideEnabled()) {
      if (gestureToggle) gestureToggle.classList.add('on');
    } else {
      if (gestureToggle) gestureToggle.classList.remove('on');
    }

    if (btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (panel) panel.classList.toggle('show');
      });
    }

    document.addEventListener('click', function(e) {
      if (panel && !panel.contains(e.target) && e.target !== btn) {
        panel.classList.remove('show');
      }
    });

    if (toggle) {
      toggle.addEventListener('click', function() {
        const enabled = !isVoiceGuideEnabled();
        setVoiceGuideEnabled(enabled);
        if (enabled) {
          toggle.classList.add('on');
        } else {
          toggle.classList.remove('on');
        }
      });
    }

    if (gestureToggle) {
      gestureToggle.addEventListener('click', function() {
        const enabled = !isGestureGuideEnabled();
        setGestureGuideEnabled(enabled);
        if (enabled) {
          gestureToggle.classList.add('on');
        } else {
          gestureToggle.classList.remove('on');
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        try {
          localStorage.removeItem('starlight_gesture_seen');
          alert('手势演示已重置！刷新页面即可重新看到引导动画。');
        } catch(e) {}
      });
    }

    if (synth) {
      synth.getVoices();
      window.addEventListener('voiceschanged', function() {
        synth.getVoices();
      });
    }
  });

  window.VoiceGuide = {
    speak: speakGuide,
    speakEn: speakEn,
    stop: stopSpeak,
    isEnabled: isVoiceGuideEnabled
  };
})();

    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1.1;
    speechSynthesis.speak(utterance);

function makeCall() {
  if (callStarted) return;
  callStarted = true;
  
  var callBtn = document.getElementById('call-btn');

    callBtn.innerHTML = '<span class="dial-btn-icon">📞</span><span>正在接通...</span>';

  const name = document.getElementById('animal-name');
  const subtitle = document.getElementById('animal-subtitle');
  
  avatar.textContent = currentAnimal.emoji;
  avatar.style.borderColor = currentAnimal.color;
  avatar.style.boxShadow = `0 0 30px ${currentAnimal.color}40, 0 8px 32px rgba(0,0,0,0.4)`;
  name.textContent = currentAnimal.name;
  subtitle.textContent = currentAnimal.subtitle;
}

function askQuestion() {
  let topicIndex = Math.floor(Math.random() * TOPICS.length);
  if (TOPICS.length > 1 && topicIndex === lastTopicIndex) {
    topicIndex = (topicIndex + 1) % TOPICS.length;
  }
  lastTopicIndex = topicIndex;
  currentTopic = TOPICS[topicIndex];
  
  addBubble('animal', currentTopic.question);
  speak(currentTopic.question);
  
  guidePlayedThisRound = false;
  
  if (conversationCount < 2) {
    setTimeout(() => {
      speak('点一点回答小动物的问题吧！');
      guidePlayedThisRound = true;
    }, 500);
  }
  
  renderAnswers();
}

function addBubble(type, text) {
  const container = document.getElementById('chat-container');
  const bubble = document.createElement('div');
  bubble.className = `bubble ${type}`;
  bubble.innerHTML = `<div class="bubble-text">${text}</div>`;
  container.appendChild(bubble);
  
  container.scrollTop = container.scrollHeight;
  
  const avatar = document.getElementById('animal-avatar');
  if (type === 'animal') {
    avatar.classList.remove('wiggle');
    void avatar.offsetWidth;
    avatar.classList.add('wiggle');
  }
}

function renderAnswers() {
  const buttonsContainer = document.getElementById('answer-buttons');
  buttonsContainer.innerHTML = '';
  
  currentTopic.answers.forEach((answer, index) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="emoji">${answer.emoji}</span><span>${answer.text}</span>`;
    btn.onclick = () => handleAnswer(answer);
    btn.style.animationDelay = `${index * 0.1}s`;
    buttonsContainer.appendChild(btn);
  });
}

function handleAnswer(answer) {
  if (isAnimating) return;
  isAnimating = true;
  
  conversationCount++;
  
  const buttonsContainer = document.getElementById('answer-buttons');
  buttonsContainer.innerHTML = '';
  
  addBubble('player', answer.text);
  speak(answer.text);
  
  setTimeout(() => {
    addBubble('animal', answer.response);
    speak(answer.response);
    
    setTimeout(() => {
      const followup = FOLLOWUP_RESPONSES[Math.floor(Math.random() * FOLLOWUP_RESPONSES.length)];
      addBubble('animal', followup);
      speak(followup);
      
      setTimeout(() => {
        askQuestion();
        isAnimating = false;
      }, 1500);
    }, 1500);
  }, 1000);
}

  window.location.href = 'world-map-v2.html';

function hangUp() {
  document.body.style.transition = 'opacity 0.3s';
  document.body.style.opacity = '0';
  setTimeout(() => {
    window.location.href = 'world-map-v2.html';

    var timer = setTimeout(function() {
      self.remove(overlay);
      if (once) self.markSeen(id);
    }, duration);
    overlay._timer = timer;
    return overlay;
  }
};
</script>

<script>
// 小星星向导
window.StarGuide = {
  container: null,
  star: null,
  bubble: null,
  steps: [],
  currentStep: 0,
  idleTimer: null,
  init: function(steps) {
    this.steps = steps || [];
    this.currentStep = 0;
    this.createDOM();
    this.startIdleWatch();
  },
  createDOM: function() {
    if (this.container) return;
    this.container = document.createElement('div');
    this.container.className = 'star-guide-container hidden';
    this.container.id = 'star-guide';
    this.star = document.createElement('div');
    this.star.className = 'star-guide';
    this.star.textContent = '⭐';
    this.bubble = document.createElement('div');
    this.bubble.className = 'star-guide-bubble';
    this.container.appendChild(this.bubble);
    this.container.appendChild(this.star);
    document.body.appendChild(this.container);
  },
  show: function(text, targetSelector) {
    if (!this.container) this.createDOM();
    this.container.classList.remove('hidden');
    this.bubble.textContent = text;
    this.bubble.classList.add('show');
    if (targetSelector) {
      var target = document.querySelector(targetSelector);
      if (target) {
        var rect = target.getBoundingClientRect();
        this.container.style.position = 'fixed';
        this.container.style.bottom = 'auto';
        this.container.style.right = 'auto';
        this.container.style.left = (rect.left + rect.width/2 - 30) + 'px';
        this.container.style.top = (rect.top + rect.height + 12) + 'px';
      }
    } else {
      this.container.style.position = 'fixed';
      this.container.style.bottom = '24px';
      this.container.style.right = '24px';
      this.container.style.left = 'auto';
      this.container.style.top = 'auto';
    }
    clearTimeout(this._hideTimer);
    this._hideTimer = setTimeout(() => { this.hide(); }, 5000);
  },
  hide: function() {
    if (!this.container) return;
    this.bubble.classList.remove('show');
    this.container.classList.add('hidden');
  },
  startIdleWatch: function() {
    var self = this;
    var lastActivity = Date.now();
    function onActivity() { lastActivity = Date.now(); }
    document.addEventListener('click', onActivity);
    document.addEventListener('touchstart', onActivity);
    document.addEventListener('pointerdown', onActivity);
    function checkIdle() {
      if (Date.now() - lastActivity > 3000 && self.currentStep < self.steps.length) {
        var step = self.steps[self.currentStep];
        if (!step.condition || step.condition()) {
          self.show(step.text, step.target);
          if (step.speak && window.VoiceGuide) window.VoiceGuide.speak(step.speak);
        }
      }
    }
    self.idleTimer = setInterval(checkIdle, 1000);
  },
  nextStep: function() {
    this.currentStep++;
    this.hide();
  }
};

// 页面专属StarGuide配置
(function() {
  function initStarGuide() {
    if (window.StarGuide) {
      window.StarGuide.init([
        { 
          target: '#call-btn', 
          condition: function() { return !document.getElementById('call-btn').classList.contains('hidden') && !callStarted; },
          text: '点击按钮，给动物朋友打电话吧！'
        },
        {
          target: '.answer-btn',
          condition: function() { 
            var btns = document.querySelectorAll('.answer-btn');
            return btns.length > 0 && callStarted && !document.getElementById('success-overlay') && conversationCount < 2 && !guidePlayedThisRound;
          },
          text: '点一点回答小动物的问题吧！',
          speak: '点一点回答小动物的问题吧！'
        }
      ]);
      
      var callBtn = document.getElementById('call-btn');
      if (callBtn) {
        callBtn.addEventListener('click', function() {
          window.StarGuide.nextStep();
        });
      }
    } else {
      setTimeout(initStarGuide, 300);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(initStarGuide, 500); });
  } else {
    setTimeout(initStarGuide, 500);
  }
})();

// 页面专属手势引导
(function() {
  function waitAndShow() {
    if (window.GestureGuide) {
      var btn = document.getElementById('call-btn');
      if (btn && !callStarted) {
        setTimeout(function() {
          localStorage.removeItem('starlight_gesture_seen');
          GestureGuide.showTap(btn, { id: 'phone_call_btn_v2', duration: 6000, once: false });
        }, 1500);
      }
    } else {
      setTimeout(waitAndShow, 200);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(waitAndShow, 500); });
  } else {
    setTimeout(waitAndShow, 500);
  }
})();
</script>
</body>
